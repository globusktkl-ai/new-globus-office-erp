<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Collect Fee - Globus</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <nav class="app-header">
        <div class="header-left" style="flex: 1; display: flex; align-items: center; gap: 10px;">
            <img src="assets/images/logo.png" class="logo-small" alt="Logo">
            <div style="display: flex; flex-direction: column;">
                <span style="font-size: 16px; font-weight: bold;">Globus</span>
                <span style="font-size: 11px; color: #64748b;">Technical Academy</span>
            </div>
        </div>
        <div class="header-right"><button class="btn-logout-custom" id="logoutBtn">Logout</button></div>
    </nav>

    <main class="main-content">
        <div class="form-card">
            <h2 style="font-size: 18px; margin-bottom: 20px; color: var(--primary-dark);">Collect Fee</h2>
            
            <form id="feeForm">
                <div class="form-group">
                    <label class="form-label">Search Student</label>
                    <input type="text" id="studentSearchInput" class="form-control" placeholder="Name, reg no, or 10-digit phone..." autocomplete="off">
                    <select id="studentSelect" class="form-control" size="4" style="margin-top: 8px; display: none; height: auto;" required></select>
                </div>

                <div id="feeDetails" style="display: none; background: #FEF2F2; border: 1px solid #FCA5A5; padding: 15px; border-radius: 12px; margin-bottom: 20px;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                        <span style="color: #6B7280; font-size: 14px;">Total Fee:</span>
                        <span id="txtTotalFee" style="font-weight: 600;">₹ 0</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                        <span style="color: #6B7280; font-size: 14px;">Total Paid:</span>
                        <span id="txtTotalPaid" style="font-weight: 600; color: #10B981;">₹ 0</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; margin-top: 12px; padding-top: 12px; border-top: 1px solid #FCA5A5;">
                        <span style="color: #111827; font-size: 16px; font-weight: 700;">Pending Balance:</span>
                        <span id="txtPending" style="font-size: 18px; font-weight: 800; color: #EF4444;">₹ 0</span>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Amount to Pay (₹)</label>
                    <input type="number" id="amountPaid" class="form-control" required min="0" placeholder="Enter amount">
                </div>

                <!-- DISCOUNT COLUMN WITH ZERO REMOVED -->
                <div class="form-group">
                    <label class="form-label">Discount / Adjustment (₹)</label>
                    <input type="number" id="discountAmount" class="form-control" min="0" placeholder="Enter discount (optional)">
                </div>

                <div class="form-group">
                    <label class="form-label">Payment Mode</label>
                    <select id="paymentMode" class="form-control" required>
                        <option value="Cash">Cash</option><option value="UPI">UPI</option><option value="Bank Transfer">Bank Transfer</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Receipt / Transaction ID</label>
                    <input type="text" id="txnId" class="form-control" placeholder="Enter receipt id (optional)">
                </div>

                <div class="form-group" style="margin-bottom: 24px;">
                    <label class="form-label">Payment Date</label>
                    <input type="date" id="paymentDate" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-primary" id="submitBtn">Submit Payment</button>
            </form>
            <div style="text-align: center; margin-top: 20px;"><a href="dashboard.html" style="color: #3b82f6; font-weight: 600;">Return to Dashboard</a></div>
        </div>
    </main>

    <script type="module">
        import { supabase } from './assets/js/supabase-config.js';
        let studentsData = [];
        let paymentsData = [];
        let selectedStudentId = null;
        let currentBalance = 0;

        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return; }
            document.getElementById('paymentDate').value = new Date().toISOString().split('T')[0];
            fetchData();
        }

        async function fetchData() {
            const [studentsRes, paymentsRes] = await Promise.all([
                supabase.from('students').select('id, register_number, full_name, phone_number, total_fee, admission_fee').order('full_name'),
                supabase.from('fee_payments').select('student_id, amount_paid, discount_amount')
            ]);
            studentsData = studentsRes.data || [];
            paymentsData = paymentsRes.data || [];
        }

        document.getElementById('studentSearchInput').addEventListener('input', function() {
            let query = this.value.trim().toLowerCase();
            const select = document.getElementById('studentSelect');
            select.innerHTML = '';
            
            if (query.length === 0) { select.style.display = 'none'; return; }

            const filtered = studentsData.filter(s => 
                s.full_name?.toLowerCase().includes(query) || 
                s.register_number?.toLowerCase().includes(query) || 
                s.phone_number?.toLowerCase().includes(query)
            );

            if (filtered.length > 0) {
                select.style.display = 'block';
                filtered.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.id;
                    opt.textContent = `${s.full_name} (${s.register_number}) - ${s.phone_number}`;
                    select.appendChild(opt);
                });
            } else {
                select.style.display = 'none';
            }
        });

        function updateLiveBalance() {
            if (!selectedStudentId) return;
            
            const paying = Number(document.getElementById('amountPaid').value) || 0;
            const discount = Number(document.getElementById('discountAmount').value) || 0;
            const totalDeduction = paying + discount;
            const newBalance = currentBalance - totalDeduction;
            
            const pEl = document.getElementById('txtPending');
            const submitBtn = document.getElementById('submitBtn');
            
            if (newBalance < 0) {
                pEl.textContent = `₹ ${newBalance} (Amount exceeds pending balance!)`;
                pEl.style.color = "#EF4444";
                submitBtn.disabled = true;
            } else if (newBalance === 0) {
                pEl.textContent = "Fully Paid (₹ 0)";
                pEl.style.color = "#10B981";
                submitBtn.disabled = false;
            } else {
                pEl.textContent = `₹ ${newBalance}`;
                pEl.style.color = "#EF4444";
                submitBtn.disabled = false;
            }
        }

        document.getElementById('amountPaid').addEventListener('input', updateLiveBalance);
        document.getElementById('discountAmount').addEventListener('input', updateLiveBalance);

        document.getElementById('studentSelect').addEventListener('change', function() {
            selectedStudentId = this.value;
            const div = document.getElementById('feeDetails');
            
            if (!selectedStudentId) { div.style.display = 'none'; return; }

            const s = studentsData.find(x => x.id === selectedStudentId);
            if (s) {
                document.getElementById('studentSearchInput').value = `${s.full_name} (${s.register_number})`;
                this.style.display = 'none';

                document.getElementById('amountPaid').value = '';
                document.getElementById('discountAmount').value = '';

                const tFee = Number(s.total_fee) || 0;
                const aFee = Number(s.admission_fee) || 0;
                
                const pay = paymentsData.filter(p => p.student_id === s.id).reduce((sum, p) => {
                    const paidAmt = Number(p.amount_paid) || 0;
                    const discAmt = Number(p.discount_amount) || 0;
                    return sum + paidAmt + discAmt;
                }, 0);
                
                currentBalance = tFee - (aFee + pay);

                document.getElementById('txtTotalFee').textContent = `₹ ${tFee}`;
                document.getElementById('txtTotalPaid').textContent = `₹ ${aFee + pay}`;
                
                const pEl = document.getElementById('txtPending');
                if (currentBalance <= 0) {
                    pEl.textContent = "Fully Paid (₹ 0)";
                    pEl.style.color = "#10B981";
                    document.getElementById('amountPaid').disabled = true;
                    document.getElementById('discountAmount').disabled = true;
                    document.getElementById('submitBtn').disabled = true;
                } else {
                    pEl.textContent = `₹ ${currentBalance}`;
                    pEl.style.color = "#EF4444";
                    document.getElementById('amountPaid').disabled = false;
                    document.getElementById('discountAmount').disabled = false;
                    document.getElementById('submitBtn').disabled = false;
                }
                div.style.display = 'block';
            }
        });

        document.getElementById('feeForm').addEventListener('submit', async (e) => {
            e.preventDefault(); 
            if (!selectedStudentId) { alert('Warning: Please select a student.'); return; }

            const amountPaid = Number(document.getElementById('amountPaid').value) || 0;
            const discountAmount = Number(document.getElementById('discountAmount').value) || 0;
            const totalDeduction = amountPaid + discountAmount;

            if (totalDeduction === 0) {
                alert('Warning: Please enter a valid payment or discount amount.');
                return;
            }

            if (totalDeduction > currentBalance) {
                alert(`Error: The total deduction (Payment + Discount = ₹ ${totalDeduction}) cannot exceed the pending balance (₹ ${currentBalance})!`);
                return;
            }

            document.getElementById('submitBtn').disabled = true;
            document.getElementById('submitBtn').textContent = 'Processing...';
            
            const { error } = await supabase.from('fee_payments').insert([{
                student_id: selectedStudentId,
                amount_paid: amountPaid,
                discount_amount: discountAmount,
                payment_mode: document.getElementById('paymentMode').value,
                receipt_no: document.getElementById('txnId').value, 
                payment_date: document.getElementById('paymentDate').value
            }]);

            if (error) {
                alert('Error processing payment: ' + error.message);
                document.getElementById('submitBtn').disabled = false;
                document.getElementById('submitBtn').textContent = 'Submit Payment';
            } else { 
                alert('Payment recorded successfully!'); 
                window.location.href = 'dashboard.html'; 
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => { 
            await supabase.auth.signOut(); localStorage.clear(); window.location.replace('login.html'); 
        });

        checkAuth();
    </script>
</body>
</html>

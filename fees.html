<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fee Collection - Globus Office ERP</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .navbar { background-color: var(--white); padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .navbar-left { display: flex; align-items: center; gap: 15px; }
        .btn-back { text-decoration: none; padding: 6px 12px; background: #F1F5F9; color: var(--text-dark); border-radius: 4px; font-weight: 600; font-size: 14px; border: 1px solid var(--border); }
        .btn-back:hover { background: #E2E8F0; }
        .navbar-brand { font-size: 20px; font-weight: 700; color: var(--primary-dark); }
        .navbar-menu { display: flex; gap: 20px; }
        .navbar-menu a { text-decoration: none; color: var(--text-muted); font-weight: 500; }
        .navbar-menu a:hover, .navbar-menu a.active { color: var(--primary-dark); }
        .navbar-user { display: flex; align-items: center; gap: 15px; }
        .user-name { font-size: 14px; font-weight: 600; color: var(--text-dark); }
        .btn-logout { background-color: transparent; color: var(--error); border: 1px solid var(--error); padding: 6px 16px; border-radius: 4px; cursor: pointer; font-weight: 500; }
        .main-content { padding: 32px 24px; max-width: 800px; margin: 0 auto; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .full-width { grid-column: span 2; }
        
        .student-card { background-color: #F8FAFC; border: 1px solid var(--border); padding: 16px; border-radius: var(--radius-md); margin-bottom: 20px; display: none; }
        .student-card p { margin-bottom: 8px; font-size: 14px; }
        .student-card span { font-weight: 600; color: var(--primary-dark); }
        .fee-details-box { display: flex; gap: 20px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed #ccc; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-left">
            <a href="javascript:history.back()" class="btn-back">← Back</a>
            <div class="navbar-brand">Globus ERP</div>
        </div>
        <div class="navbar-menu">
            <a href="dashboard.html">Dashboard</a>
            <a href="students.html">Students</a>
            <a href="fees.html" class="active">Fees</a>
        </div>
        <div class="navbar-user">
            <span id="userName" class="user-name">Loading...</span>
            <button id="logoutBtn" class="btn-logout">Logout</button>
        </div>
    </nav>

    <main class="main-content">
        <div class="page-header" style="margin-bottom: 24px;">
            <h2>Collect Monthly Fees</h2>
        </div>

        <div class="card">
            <div id="alertMessage" class="alert hidden" style="margin-bottom: 20px;"></div>

            <form id="feeForm">
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label class="form-label">Select Student *</label>
                        <select id="studentId" class="form-control" required>
                            <option value="">-- Loading Students... --</option>
                        </select>
                    </div>

                    <!-- Student Details Card with Balance Info -->
                    <div id="studentDetailsCard" class="form-group full-width student-card">
                        <p>Name: <span id="dispName">N/A</span> &nbsp;&nbsp;|&nbsp;&nbsp; Reg No: <span id="dispReg">N/A</span></p>
                        <p>Course: <span id="dispCourse">N/A</span></p>
                        
                        <div class="fee-details-box">
                            <div>
                                <p style="color: var(--text-muted); font-size: 12px; margin:0;">Total Course Fee</p>
                                <h3 id="dispTotal" style="margin:0; font-size: 16px;">₹ 0</h3>
                            </div>
                            <div>
                                <p style="color: var(--text-muted); font-size: 12px; margin:0;">Admission Fee Paid</p>
                                <h3 id="dispAdmFee" style="margin:0; font-size: 16px; color:#3b82f6;">₹ 0</h3>
                            </div>
                            <div>
                                <p style="color: var(--text-muted); font-size: 12px; margin:0;">Balance to Pay</p>
                                <h3 id="dispBalance" style="margin:0; font-size: 18px; color: #ef4444;">₹ 0</h3>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Payment Date *</label>
                        <input type="date" id="paymentDate" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Amount (₹) *</label>
                        <input type="number" id="amount" class="form-control" required placeholder="0.00" min="1">
                        <small style="color:var(--text-muted); display:block; margin-top:4px;">Cannot exceed Balance amount</small>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Payment Mode *</label>
                        <select id="paymentMode" class="form-control" required>
                            <option value="Cash">Cash</option>
                            <option value="UPI">UPI / GPay</option>
                            <option value="Bank Transfer">Bank Transfer</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Reference / Receipt No</label>
                        <input type="text" id="reference" class="form-control" placeholder="e.g. UPI Ref No">
                    </div>
                </div>

                <div class="form-group mt-4" style="text-align: right;">
                    <button type="submit" class="btn btn-primary" id="submitBtn">Save Payment</button>
                </div>
            </form>
        </div>
    </main>

    <script type="module">
        import { supabase } from './assets/js/supabase-config.js';

        const alertMessage = document.getElementById('alertMessage');
        const submitBtn = document.getElementById('submitBtn');
        const studentSelect = document.getElementById('studentId');
        let allStudents = [];

        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return; }
            document.getElementById('userName').textContent = session.user.user_metadata.full_name || session.user.email;
            document.getElementById('paymentDate').valueAsDate = new Date();
            loadStudents();
        }

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabase.auth.signOut();
            window.location.href = 'login.html';
        });

        function showAlert(msg, isError = true) {
            alertMessage.textContent = msg;
            alertMessage.className = `alert ${isError ? 'alert-error' : 'alert-success'}`;
            alertMessage.classList.remove('hidden');
        }

        async function loadStudents() {
            try {
                const { data, error } = await supabase
                    .from('students')
                    .select('id, full_name, register_number, total_fee, admission_fee, courses(course_name), fee_payments(amount_paid)')
                    .eq('status', 'active');
                
                if (error) throw error;
                
                allStudents = data || [];
                studentSelect.innerHTML = '<option value="">-- Choose Student --</option>';
                allStudents.forEach(s => {
                    studentSelect.add(new Option(`${s.register_number} - ${s.full_name}`, s.id));
                });
            } catch (err) {
                studentSelect.innerHTML = '<option value="">-- Error Loading Data --</option>';
            }
        }

        studentSelect.addEventListener('change', (e) => {
            const studentId = e.target.value;
            const detailsCard = document.getElementById('studentDetailsCard');
            
            if (!studentId) {
                detailsCard.style.display = 'none';
                return;
            }

            const student = allStudents.find(s => s.id === studentId);
            if (student) {
                document.getElementById('dispName').textContent = student.full_name;
                document.getElementById('dispReg').textContent = student.register_number || 'N/A';
                document.getElementById('dispCourse').textContent = student.courses ? student.courses.course_name : 'N/A';
                
                const tFee = Number(student.total_fee) || 0;
                const aFee = Number(student.admission_fee) || 0;
                const paidFees = student.fee_payments ? student.fee_payments.reduce((sum, p) => sum + Number(p.amount_paid), 0) : 0;
                
                const bal = tFee - aFee - paidFees;

                document.getElementById('dispTotal').textContent = `₹ ${tFee}`;
                document.getElementById('dispAdmFee').textContent = `₹ ${aFee}`;
                
                const dispBal = document.getElementById('dispBalance');
                if(bal <= 0) {
                    dispBal.textContent = '₹ 0 (Fully Paid)';
                    dispBal.style.color = '#22c55e';
                    document.getElementById('amount').max = 0;
                    document.getElementById('amount').disabled = true;
                    submitBtn.disabled = true;
                } else {
                    dispBal.textContent = `₹ ${bal}`;
                    dispBal.style.color = '#ef4444';
                    document.getElementById('amount').max = bal;
                    document.getElementById('amount').disabled = false;
                    submitBtn.disabled = false;
                }

                detailsCard.style.display = 'block';
            }
        });

        document.getElementById('feeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            alertMessage.classList.add('hidden');
            
            submitBtn.textContent = 'Processing...';
            submitBtn.disabled = true;

            const mode = document.getElementById('paymentMode').value;
            const ref = document.getElementById('reference').value;
            const combinedReceipt = ref ? `${mode} - ${ref}` : mode;

            const paymentData = {
                student_id: studentSelect.value,
                amount_paid: parseFloat(document.getElementById('amount').value),
                payment_date: document.getElementById('paymentDate').value,
                receipt_no: combinedReceipt
            };

            try {
                const { error } = await supabase.from('fee_payments').insert([paymentData]);
                if (error) throw error;
                showAlert('Payment saved successfully! Redirecting...', false);
                setTimeout(() => { window.location.reload(); }, 1500);
            } catch (err) {
                showAlert(err.message || 'An error occurred while saving.');
                submitBtn.textContent = 'Save Payment';
                submitBtn.disabled = false;
            }
        });

        checkAuth();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Collect Fees - VPKTechsolutions</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .fee-details-box { display: flex; justify-content: space-between; margin-top: 10px; padding-top: 10px; border-top: 1px dashed #E5E7EB; }
        .fee-item h3 { font-size: 15px; margin-top: 4px; }
    </style>
</head>
<body>

    <nav class="app-header">
        <div class="header-left">
            <a href="dashboard.html" class="btn-back-icon">←</a>
            <img src="assets/images/logo.png" class="logo-small" alt="Logo" onerror="this.style.display='none'">
        </div>
        <div class="header-center">Collect Fee</div>
        <div class="header-right">
            <span class="user-name-small" id="userName">Loading...</span>
            <button class="btn-logout-small" id="logoutBtn">Logout</button>
        </div>
    </nav>

    <main class="main-content">
        <div class="card">
            <form id="feeForm">
                <div class="form-group">
                    <label class="form-label">Select Student <span class="req-star">*</span></label>
                    <select id="studentId" class="form-control" required>
                        <option value="">-- Loading Students... --</option>
                    </select>
                </div>

                <!-- Balance Details Card -->
                <div id="studentDetailsCard" class="form-group" style="display:none; background:#F8FAFC; padding:12px; border-radius:8px; border:1px solid #E5E7EB;">
                    <div style="font-weight:700; color:#3730A3; font-size:15px; margin-bottom:4px;" id="dispName">N/A</div>
                    <div style="font-size:12px; color:#6B7280; margin-bottom:10px;">Course: <span id="dispCourse">N/A</span></div>
                    
                    <div class="fee-details-box">
                        <div class="fee-item">
                            <span style="font-size:11px; color:#6B7280; text-transform:uppercase;">Total Fee</span>
                            <h3 id="dispTotal">₹ 0</h3>
                        </div>
                        <div class="fee-item" style="text-align:right;">
                            <span style="font-size:11px; color:#ef4444; text-transform:uppercase; font-weight:700;">Balance</span>
                            <h3 id="dispBalance" style="color:#ef4444;">₹ 0</h3>
                        </div>
                    </div>
                </div>
                
                <!-- Row 1: Payment Date & Amount (Same width) -->
                <div class="form-row-2">
                    <div class="form-group-mobile">
                        <label class="form-label">Payment Date <span class="req-star">*</span></label>
                        <input type="date" id="paymentDate" class="form-control" required>
                    </div>
                    <div class="form-group-mobile">
                        <label class="form-label">Amount (₹) <span class="req-star">*</span></label>
                        <input type="number" id="amount" class="form-control" placeholder="0.00" required min="1">
                    </div>
                </div>

                <!-- Row 2: Mode & Ref No (Same width) -->
                <div class="form-row-2">
                    <div class="form-group-mobile">
                        <label class="form-label">Payment Mode <span class="req-star">*</span></label>
                        <select id="paymentMode" class="form-control" required>
                            <option value="Cash">Cash</option>
                            <option value="UPI">UPI / GPay</option>
                            <option value="Bank">Bank Transfer</option>
                        </select>
                    </div>
                    <div class="form-group-mobile">
                        <label class="form-label">Reference / Receipt No</label>
                        <input type="text" id="reference" class="form-control" placeholder="UPI Ref">
                    </div>
                </div>

                <div class="form-group mt-4">
                    <button type="submit" class="btn btn-primary" id="submitBtn">Save Payment</button>
                </div>
            </form>
        </div>
    </main>

    <script type="module">
        import { supabase } from './assets/js/supabase-config.js';

        let allStudents = [];
        document.getElementById('paymentDate').valueAsDate = new Date();

        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return; }
            document.getElementById('userName').textContent = session.user.user_metadata.full_name || session.user.email.split('@')[0];
            loadStudents();
        }

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabase.auth.signOut();
            window.location.href = 'login.html';
        });

        async function loadStudents() {
            const { data } = await supabase.from('students').select('id, full_name, register_number, total_fee, admission_fee, courses(course_name), fee_payments(amount_paid)').eq('status', 'active');
            allStudents = data || [];
            const studentSelect = document.getElementById('studentId');
            studentSelect.innerHTML = '<option value="">-- Choose Student --</option>';
            allStudents.forEach(s => studentSelect.add(new Option(`${s.full_name} (${s.register_number})`, s.id)));
        }

        document.getElementById('studentId').addEventListener('change', (e) => {
            const student = allStudents.find(s => s.id === e.target.value);
            const card = document.getElementById('studentDetailsCard');
            if (!student) { card.style.display = 'none'; return; }

            document.getElementById('dispName').textContent = student.full_name;
            document.getElementById('dispCourse').textContent = student.courses ? student.courses.course_name : 'N/A';
            
            const tFee = Number(student.total_fee) || 0;
            const aFee = Number(student.admission_fee) || 0;
            const paidFees = student.fee_payments ? student.fee_payments.reduce((sum, p) => sum + Number(p.amount_paid), 0) : 0;
            const bal = tFee - aFee - paidFees;

            document.getElementById('dispTotal').textContent = `₹ ${tFee}`;
            const dispBal = document.getElementById('dispBalance');
            const amtInput = document.getElementById('amount');
            const submitBtn = document.getElementById('submitBtn');

            if(bal <= 0) {
                dispBal.textContent = '₹ 0 (Paid)'; dispBal.style.color = '#10B981';
                amtInput.max = 0; amtInput.disabled = true; submitBtn.disabled = true;
            } else {
                dispBal.textContent = `₹ ${bal}`; dispBal.style.color = '#ef4444';
                amtInput.max = bal; amtInput.disabled = false; submitBtn.disabled = false;
            }
            card.style.display = 'block';
        });

        document.getElementById('feeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.textContent = 'Processing...'; submitBtn.disabled = true;

            const mode = document.getElementById('paymentMode').value;
            const ref = document.getElementById('reference').value;
            
            const paymentData = {
                student_id: document.getElementById('studentId').value,
                amount_paid: parseFloat(document.getElementById('amount').value),
                payment_date: document.getElementById('paymentDate').value,
                receipt_no: ref ? `${mode} - ${ref}` : mode
            };

            const { error } = await supabase.from('fee_payments').insert([paymentData]);
            if (!error) {
                alert('Payment saved successfully!');
                window.location.reload();
            } else {
                alert('Error: ' + error.message);
                submitBtn.textContent = 'Save Payment'; submitBtn.disabled = false;
            }
        });

        checkAuth();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Add Expense - ERP Technical Academy</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, sans-serif; padding-bottom: 30px; }
        
        .main-content { padding: 15px; max-width: 600px; margin: 0 auto; }
        
        /* Premium 3D Back to Dashboard Button (Icon Only) */
        .btn-back-dashboard { display: inline-flex; align-items: center; justify-content: center; background: #ffffff; border: 1px solid #cbd5e1; padding: 10px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05), inset 0 -2px 0 rgba(226,232,240,0.8); transition: all 0.2s ease; cursor: pointer; }
        .btn-back-dashboard:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.08), inset 0 -2px 0 rgba(226,232,240,0.8); border-color: #94a3b8; }
        .btn-back-dashboard:active { transform: translateY(1px); box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .btn-back-dashboard svg { width: 22px; height: 22px; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; filter: drop-shadow(0px 2px 2px rgba(37,99,235,0.3)); }

        /* DISABLE SCROLLING ON NUMBER INPUTS */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        
        .form-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e5e7eb; }
        .form-title { color: #1e3a8a; margin-top: 0; font-size: 20px; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; font-weight: 900;}
        
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        .form-group label { font-weight: bold; color: #374151; font-size: 14px; margin-bottom: 5px; }
        .form-group input, .form-group select, .form-group textarea { 
            padding: 12px; 
            border: 1px solid #d1d5db; 
            border-radius: 6px; 
            font-size: 15px; 
            background-color: #f9fafb;
            transition: border-color 0.2s;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: #3b82f6;
            background-color: #fff;
        }
        
        /* Updated Blue Submit Button */
        .btn-submit { 
            background: linear-gradient(135deg, #3b82f6, #2563eb); 
            color: white; 
            border: none; 
            padding: 14px; 
            font-size: 16px; 
            font-weight: bold; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 100%; 
            margin-top: 10px;
            box-shadow: 0 4px 6px rgba(59, 130, 246, 0.3);
            transition: all 0.2s;
        }
        .btn-submit:hover { background: linear-gradient(135deg, #2563eb, #1d4ed8); }
        .btn-submit:disabled { background: #9CA3AF; cursor: not-allowed; box-shadow: none; }
    </style>
</head>
<body>

    <nav class="app-header" style="position: relative; display: flex; align-items: center; justify-content: center; padding: 12px 15px; min-height: 60px;">
        <a href="dashboard.html" class="btn-back-dashboard" style="position: absolute; left: 15px; padding: 8px 12px;" title="Back to Dashboard">
            <svg viewBox="0 0 24 24" style="stroke:url(#grad-return);">
                <defs>
                    <linearGradient id="grad-return" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#2563eb" />
                        <stop offset="100%" stop-color="#9333ea" />
                    </linearGradient>
                </defs>
                <path d="M9 14L4 9l5-5" />
                <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11" />
            </svg>
        </a>
        <h1 style="font-size: 16px; font-weight: 900; color: #1e3a8a; text-transform: uppercase; margin: 0; letter-spacing: 0.5px;">DAY BOOK</h1>
    </nav>

    <div class="main-content">
        <div class="form-card">
            
            <form id="expenseForm">
                <div class="form-group">
                    <label for="expense_date">Expense Date *</label>
                    <input type="date" id="expense_date" required>
                </div>

                <div class="form-group">
                    <label for="purpose">Purpose / Name *</label>
                    <input type="text" id="purpose" placeholder="e.g. Electricity Bill, Staff Salary" required>
                </div>

                <div class="form-group">
                    <label for="category">Category *</label>
                    <select id="category" required>
                        <option value="General">General</option>
                        <option value="Salary">Salary</option>
                        <option value="Rent">Rent</option>
                        <option value="Electricity">Electricity</option>
                        <option value="Office Supplies">Office Supplies</option>
                        <option value="Maintenance">Maintenance</option>
                        <option value="Marketing">Marketing / Ads</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="amount">Amount (₹) *</label>
                    <input type="number" id="amount" placeholder="0.00" min="1" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="voucher_no">Voucher / Receipt No. (Optional)</label>
                    <input type="text" id="voucher_no" placeholder="e.g. VCH-001">
                </div>

                <div class="form-group">
                    <label for="payment_method">Payment Method</label>
                    <select id="payment_method">
                        <option value="Cash">Cash</option>
                        <option value="Bank Transfer">Bank Transfer</option>
                        <option value="UPI">UPI / GPay</option>
                        <option value="Cheque">Cheque</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="remarks">Remarks (Optional)</label>
                    <textarea id="remarks" rows="2" placeholder="Any extra details..."></textarea>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">Save Expense Record</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { supabase } from './assets/js/supabase-config.js';

        // PREVENT SCROLL WHEEL ON NUMBER INPUTS
        document.addEventListener('wheel', function(event) {
            if (document.activeElement.type === 'number') { document.activeElement.blur(); }
        });

        // Set default date to today
        document.getElementById('expense_date').value = new Date().toISOString().split('T')[0];

        // ==========================================
        // NEW MAGIC ALERT OVERRIDE FOR ALL WARNINGS AND ERRORS
        // ==========================================
        window.alert = function(msg) {
            const oldBox = document.getElementById('customPromptBox'); 
            if (oldBox) oldBox.remove();
            const box = document.createElement('div'); 
            box.id = 'customPromptBox';
            
            let iconHtml = `<div style="background:#dbeafe; color:#2563eb; width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 15px;"><svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" fill="none"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg></div>`;
            
            if(msg.includes('⚠️') || msg.includes('❌') || msg.includes('Error') || msg.includes('disabled') || msg.includes('failed') || msg.includes('Warning')) {
                iconHtml = `<div style="background:#fee2e2; color:#ef4444; width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 15px;"><svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" fill="none"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg></div>`;
            } else if (msg.includes('✅') || msg.includes('success') || msg.includes('successfully') || msg.includes('Complete')) {
                iconHtml = `<div style="background:#d1fae5; color:#10b981; width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 15px;"><svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" fill="none"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg></div>`;
            }

            box.style.cssText = `position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.85); z-index: 100000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px);`;
            box.innerHTML = `
                <div style="background: #ffffff; padding: 24px; border-radius: 16px; width: 90%; max-width: 320px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); text-align: center; animation: sheetUp 0.3s ease;">
                    ${iconHtml}
                    <div style="font-size: 15px; font-weight: 800; color: #0f172a; margin-bottom: 20px; white-space: pre-wrap; line-height: 1.5;">${msg}</div>
                    <button id="cAlertOk" style="width: 100%; padding: 12px; background: #3b82f6; color: #fff; border: none; border-radius: 10px; font-weight: 800; font-size: 14px; cursor: pointer; transition: 0.2s;">OK, Got it</button>
                </div>
            `;
            if(!document.querySelector('style#sheetUpAnim')){ document.head.insertAdjacentHTML('beforeend', '<style id="sheetUpAnim">@keyframes sheetUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}</style>'); }
            document.body.appendChild(box);
            document.getElementById('cAlertOk').onclick = () => box.remove();
        };

        // GUEST RESTRICTION
        async function checkAuth() {
            const userRole = localStorage.getItem('userRole') || 'Admin';
            const { data: { session } } = await supabase.auth.getSession();
            
            if (!session && userRole !== 'Guest') { 
                window.location.href = 'login.html'; 
                return; 
            }
        }
        checkAuth();

        document.getElementById('expenseForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Checking Guest Mode
            if (localStorage.getItem('userRole') === 'Guest') { 
                alert("⚠️ This action is disabled in Guest/Demo mode. You cannot record expenses."); 
                return; 
            }

            const btn = document.getElementById('submitBtn');
            btn.textContent = 'Saving...';
            btn.disabled = true;

            const expenseData = {
                expense_date: document.getElementById('expense_date').value,
                purpose: document.getElementById('purpose').value,
                category: document.getElementById('category').value,
                amount: parseFloat(document.getElementById('amount').value),
                voucher_no: document.getElementById('voucher_no').value || null,
                payment_method: document.getElementById('payment_method').value,
                remarks: document.getElementById('remarks').value || null
            };

            try {
                const { error } = await supabase.from('expenses').insert([expenseData]);
                
                if (error) throw error;
                
                alert("✅ Expense recorded successfully!");
                document.getElementById('expenseForm').reset();
                document.getElementById('expense_date').value = new Date().toISOString().split('T')[0]; // reset date
                
            } catch (error) {
                console.error('Error saving expense:', error);
                alert("❌ Failed to save expense. Please check connection.");
            } finally {
                btn.textContent = 'Save Expense Record';
                btn.disabled = false;
            }
        });
    </script>

    <!-- THE NEW DYNAMIC SECURITY SYSTEM -->
    <script type="module">
        import './assets/js/auth-check.js';
        window.checkDynamicAccess('DayBook');
    </script>
</body>
</html>

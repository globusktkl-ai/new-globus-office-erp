<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Add Expense - Globus Technical Academy</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, sans-serif; padding-bottom: 30px; }
        
        .main-content { padding: 15px; max-width: 600px; margin: 0 auto; }
        
        /* Premium 3D Back to Dashboard Button */
        .btn-back-dashboard { display: inline-flex; align-items: center; gap: 8px; background: #ffffff; border: 1px solid #cbd5e1; padding: 8px 16px; border-radius: 10px; color: #1e293b; font-weight: 800; font-size: 14px; text-decoration: none; box-shadow: 0 4px 6px rgba(0,0,0,0.05), inset 0 -2px 0 rgba(226,232,240,0.8); transition: all 0.2s ease; cursor: pointer; }
        .btn-back-dashboard:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.08), inset 0 -2px 0 rgba(226,232,240,0.8); border-color: #94a3b8; }
        .btn-back-dashboard:active { transform: translateY(1px); box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .btn-back-dashboard svg { width: 22px; height: 22px; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; filter: drop-shadow(0px 2px 2px rgba(37,99,235,0.3)); }

        /* DISABLE SCROLLING ON NUMBER INPUTS */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        
        .form-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e5e7eb; }
        .form-title { color: #EF4444; margin-top: 0; font-size: 20px; border-bottom: 2px solid #fef2f2; padding-bottom: 10px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        .form-group label { font-weight: bold; color: #374151; font-size: 14px; margin-bottom: 5px; }
        .form-group input, .form-group select, .form-group textarea { 
            padding: 12px; 
            border: 1px solid #d1d5db; 
            border-radius: 6px; 
            font-size: 15px; 
            background-color: #f9fafb;
            transition: border-color 0.2s;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: #EF4444;
            background-color: #fff;
        }
        
        /* Updated Blue Submit Button */
        .btn-submit { 
            background: linear-gradient(135deg, #3b82f6, #2563eb); 
            color: white; 
            border: none; 
            padding: 14px; 
            font-size: 16px; 
            font-weight: bold; 
            border-radius: 6px; 
            cursor: pointer; 
            width: 100%; 
            margin-top: 10px;
            box-shadow: 0 2px 4px rgba(59, 130, 246, 0.3);
            transition: all 0.2s;
        }
        .btn-submit:hover { background: linear-gradient(135deg, #2563eb, #1d4ed8); }
        .btn-submit:disabled { background: #9CA3AF; cursor: not-allowed; box-shadow: none; }

        /* Notification Toast */
        #toast {
            visibility: hidden; min-width: 250px; background-color: #333; color: #fff; text-align: center;
            border-radius: 8px; padding: 16px; position: fixed; z-index: 1000; left: 50%; bottom: 30px;
            font-size: 15px; transform: translateX(-50%); box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        #toast.show { visibility: visible; -webkit-animation: fadein 0.5s, fadeout 0.5s 2.5s; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        #toast.success { background-color: #10B981; }
        #toast.error { background-color: #EF4444; }
        @-webkit-keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @-webkit-keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body>

    <nav class="app-header">
        <div class="header-left" style="display: flex; align-items: center; gap: 10px; flex: 1;">
            <img src="assets/images/logo.png" class="logo-small" alt="Logo" onerror="this.style.display='none'">
            <div style="display: flex; flex-direction: column;">
                <span class="brand-top" style="font-size: 16px;">Globus</span>
                <span class="brand-bottom">Technical Academy</span>
            </div>
        </div>
        <div class="header-right">
            <!-- Premium 3D Back Button Added Here -->
            <a href="dashboard.html" class="btn-back-dashboard">
                <svg viewBox="0 0 24 24" style="stroke:url(#grad-return);">
                    <defs>
                        <linearGradient id="grad-return" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#2563eb" />
                            <stop offset="100%" stop-color="#9333ea" />
                        </linearGradient>
                    </defs>
                    <path d="M9 14L4 9l5-5" />
                    <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11" />
                </svg>
                <span>Dashboard</span>
            </a>
        </div>
    </nav>

    <div class="main-content">
        <div class="form-card">
            <!-- Emoji Removed -->
            <h2 class="form-title">Add New Expense</h2>
            
            <form id="expenseForm">
                <div class="form-group">
                    <label for="expense_date">Expense Date *</label>
                    <input type="date" id="expense_date" required>
                </div>

                <div class="form-group">
                    <label for="purpose">Purpose / Name *</label>
                    <input type="text" id="purpose" placeholder="e.g. Electricity Bill, Staff Salary" required>
                </div>

                <div class="form-group">
                    <label for="category">Category *</label>
                    <select id="category" required>
                        <option value="General">General</option>
                        <option value="Salary">Salary</option>
                        <option value="Rent">Rent</option>
                        <option value="Electricity">Electricity</option>
                        <option value="Office Supplies">Office Supplies</option>
                        <option value="Maintenance">Maintenance</option>
                        <option value="Marketing">Marketing / Ads</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="amount">Amount (₹) *</label>
                    <input type="number" id="amount" placeholder="0.00" min="1" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="voucher_no">Voucher / Receipt No. (Optional)</label>
                    <input type="text" id="voucher_no" placeholder="e.g. VCH-001">
                </div>

                <div class="form-group">
                    <label for="payment_method">Payment Method</label>
                    <select id="payment_method">
                        <option value="Cash">Cash</option>
                        <option value="Bank Transfer">Bank Transfer</option>
                        <option value="UPI">UPI / GPay</option>
                        <option value="Cheque">Cheque</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="remarks">Remarks (Optional)</label>
                    <textarea id="remarks" rows="2" placeholder="Any extra details..."></textarea>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">Save Expense Record</button>
            </form>
        </div>
    </div>

    <div id="toast">Message here</div>

    <script type="module">
        import { supabase } from './assets/js/supabase-config.js';

        // PREVENT SCROLL WHEEL ON NUMBER INPUTS
        document.addEventListener('wheel', function(event) {
            if (document.activeElement.type === 'number') { document.activeElement.blur(); }
        });

        // Set default date to today
        document.getElementById('expense_date').value = new Date().toISOString().split('T')[0];

        function showToast(message, type = 'success') {
            const toast = document.getElementById("toast");
            toast.textContent = message;
            toast.className = "show " + type;
            setTimeout(() => { toast.className = toast.className.replace("show " + type, ""); }, 3000);
        }

        document.getElementById('expenseForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.textContent = 'Saving...';
            btn.disabled = true;

            const expenseData = {
                expense_date: document.getElementById('expense_date').value,
                purpose: document.getElementById('purpose').value,
                category: document.getElementById('category').value,
                amount: parseFloat(document.getElementById('amount').value),
                voucher_no: document.getElementById('voucher_no').value || null,
                payment_method: document.getElementById('payment_method').value,
                remarks: document.getElementById('remarks').value || null
            };

            try {
                const { error } = await supabase.from('expenses').insert([expenseData]);
                
                if (error) throw error;
                
                showToast("✅ Expense recorded successfully!", "success");
                document.getElementById('expenseForm').reset();
                document.getElementById('expense_date').value = new Date().toISOString().split('T')[0]; // reset date
                
            } catch (error) {
                console.error('Error saving expense:', error);
                showToast("❌ Failed to save expense. Please check connection.", "error");
            } finally {
                btn.textContent = 'Save Expense Record';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>

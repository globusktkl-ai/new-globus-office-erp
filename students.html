<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Directory - Globus Technical Academy</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        /* PDF ഡൗൺലോഡ് ചെയ്യുമ്പോഴും പ്രിന്റ് ചെയ്യുമ്പോഴും കാർഡ് മാത്രം കാണിക്കാനുള്ള സ്റ്റൈൽ */
        @media print {
            body * {
                visibility: hidden;
            }
            #studentModal, #studentModal * {
                visibility: visible;
            }
            #studentModal {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                background: white !important;
                display: flex !important;
                justify-content: center;
                align-items: flex-start;
                padding-top: 20px;
            }
            .no-print {
                display: none !important;
            }
            /* പ്രിന്റ് ചെയ്യുമ്പോൾ ബാക്ക്ഗ്രൗണ്ട് കളർ വരാൻ */
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
    </style>
</head>
<body>
    
    <nav class="app-header no-print">
        <div class="header-left" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px;">
            <img src="assets/images/logo.png" class="logo-small" alt="Logo" onerror="this.style.display='none'">
            <div style="display: flex; flex-direction: column; overflow: hidden;">
                <span class="brand-top" style="font-size: 16px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Globus</span>
                <span class="brand-bottom" style="text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Technical Academy</span>
            </div>
        </div>
        
        <div class="header-right" style="flex-shrink: 0; margin-left: 10px;">
            <button class="btn-logout-custom" id="logoutBtn">Logout</button>
        </div>
    </nav>

    <main class="main-content no-print">
        <div style="text-align: center; margin-bottom: 20px;">
            <a href="dashboard.html" style="color: var(--primary-light); text-decoration: none; font-weight: 600;">← Return to Dashboard</a>
        </div>
        
        <div class="filter-section">
            <input type="text" id="searchInput" class="form-control" placeholder="🔍 Search Name, Phone, Reg No...">
        </div>
        <div id="studentsList"><div style="text-align:center; padding:20px; color:#6B7280;">Loading students...</div></div>
    </main>

    <!-- Student Details / Smart ID Card / Edit Modal Popup -->
    <div id="studentModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:100; justify-content:center; align-items:center; padding:15px;">
        <div style="background:#fff; width:100%; max-width:400px; border-radius:16px; padding:20px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); overflow-y:auto; max-height:95vh; position:relative;">
            
            <!-- Edit Form Container (മറച്ചുവെച്ചിരിക്കുന്നു, Edit ചെയ്യുമ്പോൾ മാത്രം വരും) -->
            <div id="editFormContainer" style="display:none;">
                <h3 id="modalTitle" style="margin-bottom:15px; font-size:18px; color:var(--primary-dark);">Edit Student</h3>
                <div id="modalContent"></div>
                <div style="margin-top:20px; text-align:right;">
                    <button type="button" onclick="closeModal()" style="padding:8px 16px; background:#6B7280; color:#fff; border:none; border-radius:6px; cursor:pointer;">Close</button>
                </div>
            </div>

            <!-- Smart ID Card Container (View ചെയ്യുമ്പോൾ വരും) -->
            <div id="smartCardContainer" style="display:none;">
                <div id="smartCardContent" style="background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); border: 2px solid #3B82F6; border-radius: 12px; padding: 20px; text-align: center; position: relative; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
                    <div style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 12px; border-bottom: 2px solid #cbd5e1; padding-bottom: 10px;">
                        <span style="font-size: 15px; font-weight: 800; color: #1e3a8a; letter-spacing: 0.5px;">GLOBUS TECHNICAL ACADEMY</span>
                    </div>

                    <!-- കുട്ടിയുടെ ഫോട്ടോ / അവതാർ -->
                    <div style="width: 80px; height: 80px; background: #3B82F6; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: bold; margin: 0 auto 15px auto; border: 3px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.1); overflow:hidden;" id="cardAvatar">
                        S
                    </div>

                    <!-- കുട്ടിയുടെ വിവരങ്ങൾ -->
                    <h3 id="cardStudentName" style="font-size: 20px; color: #111827; margin-bottom: 4px; font-weight: 700;">Name</h3>
                    <p id="cardCourseName" style="font-size: 13px; color: #2563eb; font-weight: 600; margin-bottom: 18px; text-transform: uppercase;">Course</p>

                    <div style="text-align: left; background: #ffffff; padding: 15px; border-radius: 8px; font-size: 13px; color: #374151; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); line-height: 1.6;">
                        <div style="display: flex; justify-content: space-between; border-bottom: 1px solid #f1f5f9; padding-bottom: 5px; margin-bottom: 5px;">
                            <strong>Reg No:</strong> <span id="cardRegNo">-</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; border-bottom: 1px solid #f1f5f9; padding-bottom: 5px; margin-bottom: 5px;">
                            <strong>Phone:</strong> <span id="cardPhone">-</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; border-bottom: 1px solid #f1f5f9; padding-bottom: 5px; margin-bottom: 5px;">
                            <strong>Gender:</strong> <span id="cardGender">-</span>
                        </div>
                        <div style="display: flex; justify-content: space-between;">
                            <strong>Qualification:</strong> <span id="cardQual">-</span>
                        </div>
                    </div>

                    <div style="margin-top: 15px; font-size: 11px; color: #64748b; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;">
                        Official Student Profile Card
                    </div>
                </div>

                <!-- ആക്ഷൻ ബട്ടണുകൾ (Print, Share, Close) -->
                <div style="margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;" class="no-print">
                    <button type="button" onclick="printCard()" style="background: #2563eb; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px;">🖨️ PDF / Print</button>
                    <button type="button" onclick="shareCard()" style="background: #10b981; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px;">🔗 Share</button>
                </div>
                <div style="margin-top: 10px; text-align: center;" class="no-print">
                    <button type="button" onclick="closeModal()" style="width: 100%; background: #6b7280; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px;">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase } from './assets/js/supabase-config.js';
        let allStudents = [];
        let currentStudentData = null; // ഷെയർ ചെയ്യാൻ നിലവിലെ കുട്ടിയുടെ ഡാറ്റ ശേഖരിക്കാൻ

        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return; }
            fetchStudents();
        }

        async function fetchStudents() {
            const { data, error } = await supabase
                .from('students')
                .select('id, register_number, full_name, phone_number, gender, qualification, status, total_fee, admission_fee, photo_url')
                .order('created_at', { ascending: false });
            
            if (error) {
                console.error("Fetch Error:", error);
                alert("Database Error: " + error.message);
                return;
            }

            allStudents = data || [];
            renderList(allStudents);
        }

        function renderList(data) {
            const container = document.getElementById('studentsList'); container.innerHTML = '';
            if (data.length === 0) { container.innerHTML = '<div style="text-align:center; padding:20px; color:#ef4444;">No students found.</div>'; return; }
            
            data.forEach(s => {
                const bal = (Number(s.total_fee)||0) - (Number(s.admission_fee)||0) - (s.fee_payments ? s.fee_payments.reduce((sum, p) => sum + Number(p.amount_paid), 0) : 0);
                const balColor = bal > 0 ? '#EF4444' : '#10B981';
                const balText = bal > 0 ? `₹ ${bal}` : 'Fully Paid';
                let avatarUrl = s.photo_url || (s.gender === 'Female' ? 'https://avatar.iran.liara.run/public/girl' : 'https://avatar.iran.liara.run/public/boy');

                let qualBadge = '';
                const q = s.qualification ? s.qualification.trim() : 'N/A';
                if (q.toLowerCase() === 'sslc') {
                    qualBadge = `<span style="background: #E0F2FE; color: #0369A1; padding: 3px 8px; border-radius: 4px; font-weight: 700;">SSLC</span>`;
                } else if (q.toLowerCase() === 'plus two' || q.toLowerCase() === 'plustwo') {
                    qualBadge = `<span style="background: #DCFCE7; color: #15803D; padding: 3px 8px; border-radius: 4px; font-weight: 700;">Plus Two</span>`;
                } else if (q.toLowerCase() === 'degree') {
                    qualBadge = `<span style="background: #FCE7F3; color: #BE185D; padding: 3px 8px; border-radius: 4px; font-weight: 700;">Degree</span>`;
                } else {
                    qualBadge = `<span style="background: #F3F4F6; color: #374151; padding: 3px 8px; border-radius: 4px; font-weight: 700;">${q}</span>`;
                }

                const card = document.createElement('div');
                card.className = 'student-mobile-card';
                card.innerHTML = `
                    <div class="smc-header">
                        <div class="smc-header-left">
                            <div class="smc-name">${s.full_name}</div>
                            <div class="smc-reg">${s.register_number}</div>
                        </div>
                        <div class="smc-header-center"><img src="${avatarUrl}" class="student-avatar" alt="Photo"></div>
                    </div>
                    <div class="smc-row"><span class="smc-label">Phone:</span> <span class="smc-value">${s.phone_number || 'N/A'}</span></div>
                    <div class="smc-row"><span class="smc-label">Course:</span> <span class="smc-value">${s.courses?.course_name || 'N/A'}</span></div>
                    <div class="smc-row"><span class="smc-label">Qualification:</span> <span class="smc-value">${qualBadge}</span></div>
                    <div class="smc-row"><span class="smc-label">Balance Fee:</span> <span class="smc-value" style="color:${balColor}; font-weight:800;">${balText}</span></div>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 15px;">
                        <button onclick="viewStudent('${s.id}')" style="background: #3B82F6; color: #fff; border: none; padding: 8px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px;">View</button>
                        <button onclick="editStudent('${s.id}')" style="background: #F59E0B; color: #fff; border: none; padding: 8px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px;">Edit</button>
                        <button onclick="deleteStudent('${s.id}', '${s.register_number}')" style="background: #EF4444; color: #fff; border: none; padding: 8px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px;">Delete</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // View Button -> Smart ID Card കാണിക്കാൻ
        window.viewStudent = function(id) {
            const s = allStudents.find(x => x.id === id);
            if (!s) return;
            currentStudentData = s;

            // എഡിറ്റ് ഫോം മറച്ചു വെച്ച് സ്മാർട്ട് കാർഡ് കാണിക്കുക
            document.getElementById('editFormContainer').style.display = 'none';
            document.getElementById('smartCardContainer').style.display = 'block';

            // ഡാറ്റ പോപ്പുലേറ്റ് ചെയ്യുക
            const name = s.full_name || 'Unknown';
            document.getElementById('cardStudentName').textContent = name;
            
            if (s.photo_url) {
                document.getElementById('cardAvatar').innerHTML = `<img src="${s.photo_url}" style="width:100%; height:100%; object-fit:cover;">`;
            } else {
                document.getElementById('cardAvatar').textContent = name.charAt(0).toUpperCase();
            }

            document.getElementById('cardCourseName').textContent = s.courses?.course_name || 'N/A';
            document.getElementById('cardRegNo').textContent = s.register_number || 'N/A';
            document.getElementById('cardPhone').textContent = s.phone_number || 'N/A';
            document.getElementById('cardGender').textContent = s.gender || 'N/A';
            document.getElementById('cardQual').textContent = s.qualification || 'N/A';

            document.getElementById('studentModal').style.display = 'flex';
        };

        // Edit Button -> എഡിറ്റ് ഫോം കാണിക്കാൻ
        window.editStudent = function(id) {
            const s = allStudents.find(x => x.id === id);
            if (!s) return;
            
            // സ്മാർട്ട് കാർഡ് മറച്ചു വെച്ച് എഡിറ്റ് ഫോം കാണിക്കുക
            document.getElementById('smartCardContainer').style.display = 'none';
            document.getElementById('editFormContainer').style.display = 'block';

            document.getElementById('modalContent').innerHTML = `
                <form id="editForm" onsubmit="saveEdit(event, '${s.id}')">
                    <div style="margin-bottom:12px;"><label style="font-size:13px; font-weight:600;">Full Name</label><input type="text" id="editName" value="${s.full_name}" class="form-control" required></div>
                    <div style="margin-bottom:12px;"><label style="font-size:13px; font-weight:600;">Phone Number</label><input type="text" id="editPhone" value="${s.phone_number}" class="form-control" required maxlength="10"></div>
                    <div style="margin-bottom:12px;"><label style="font-size:13px; font-weight:600;">Qualification</label>
                        <select id="editQual" class="form-control" required>
                            <option value="SSLC" ${s.qualification==='SSLC'?'selected':''}>SSLC</option>
                            <option value="Plus Two" ${s.qualification==='Plus Two'?'selected':''}>Plus Two</option>
                            <option value="Degree" ${s.qualification==='Degree'?'selected':''}>Degree</option>
                            <option value="Other" ${s.qualification==='Other'?'selected':''}>Other</option>
                        </select>
                    </div>
                    <button type="submit" style="width:100%; background:#10B981; color:#fff; border:none; padding:10px; border-radius:6px; font-weight:600; cursor:pointer;">Update Student</button>
                </form>
            `;
            document.getElementById('studentModal').style.display = 'flex';
        };

        window.saveEdit = async function(e, id) {
            e.preventDefault();
            const newName = document.getElementById('editName').value;
            const newPhone = document.getElementById('editPhone').value;
            const newQual = document.getElementById('editQual').value;

            if(newPhone.length !== 10) {
                alert('Phone number must be 10 digits.');
                return;
            }

            const { error } = await supabase.from('students').update({
                full_name: newName,
                phone_number: newPhone,
                qualification: newQual
            }).eq('id', id);

            if (error) {
                alert('Error updating: ' + error.message);
            } else {
                alert('Updated successfully!');
                closeModal();
                fetchStudents();
            }
        };

        // PDF ഡൗൺലോഡ് / പ്രിന്റ് ചെയ്യാൻ
        window.printCard = function() {
            window.print();
        };

        // വാട്സാപ്പിലോ മറ്റോ ഷെയർ ചെയ്യാൻ
        window.shareCard = async function() {
            if (!currentStudentData) return;
            const s = currentStudentData;
            
            const shareText = `🎓 *Globus Technical Academy*\n\n*Student Profile*\n👤 Name: ${s.full_name}\n🔢 Reg No: ${s.register_number}\n📚 Course: ${s.courses?.course_name || 'N/A'}\n📱 Phone: ${s.phone_number}\n\nJoin our technical courses today!`;
            
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'Student Profile Card',
                        text: shareText,
                    });
                } catch (err) {
                    console.log('Share cancelled:', err);
                }
            } else {
                navigator.clipboard.writeText(shareText);
                alert('Student profile details copied to clipboard. You can paste and share it anywhere!');
            }
        };

        window.closeModal = function() {
            document.getElementById('studentModal').style.display = 'none';
        };

        window.deleteStudent = async function(id, regNo) {
            const inp = prompt(`⚠️ Type the register number to delete: ${regNo}`);
            if (inp === regNo) {
                await supabase.from('fee_payments').delete().eq('student_id', id);
                await supabase.from('students').delete().eq('id', id);
                fetchStudents(); 
            } else if (inp) alert('Register number does not match.');
        };

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            renderList(allStudents.filter(s => s.full_name?.toLowerCase().includes(val) || s.register_number?.toLowerCase().includes(val) || s.phone_number?.toLowerCase().includes(val)));
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => { 
            await supabase.auth.signOut(); localStorage.clear(); sessionStorage.clear();
            window.history.replaceState(null, '', 'login.html'); window.location.replace('login.html'); 
        });
        checkAuth();
    </script>
</body>
</html>

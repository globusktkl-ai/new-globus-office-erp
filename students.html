<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Directory - Globus Technical Academy</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    
    <!-- അപ്ഡേറ്റ് ചെയ്ത ഹെഡർ: ബാക്ക് ബട്ടൺ ഒഴിവാക്കി -->
    <nav class="app-header">
        <div class="header-left" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px;">
            <img src="assets/images/logo.png" class="logo-small" alt="Logo" onerror="this.style.display='none'">
            <div style="display: flex; flex-direction: column; overflow: hidden;">
                <span class="brand-top" style="font-size: 16px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Globus</span>
                <span class="brand-bottom" style="text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Technical Academy</span>
            </div>
        </div>
        
        <div class="header-right" style="flex-shrink: 0; margin-left: 10px;">
            <button class="btn-logout-custom" id="logoutBtn">Logout</button>
        </div>
    </nav>

    <main class="main-content">
        <div style="text-align: center; margin-bottom: 20px;">
            <a href="dashboard.html" style="color: var(--primary-light); text-decoration: none; font-weight: 600;">← Return to Dashboard</a>
        </div>
        
        <div class="filter-section">
            <input type="text" id="searchInput" class="form-control" placeholder="🔍 Search Name, Phone, Reg No...">
        </div>
        <div id="studentsList"><div style="text-align:center; padding:20px; color:#6B7280;">Loading students...</div></div>
    </main>

    <script type="module">
        import { supabase } from './assets/js/supabase-config.js';
        let allStudents = [];

        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return; }
            fetchStudents();
        }

        async function fetchStudents() {
            const { data } = await supabase.from('students').select('id, register_number, full_name, phone_number, gender, status, total_fee, admission_fee, photo_url, courses(course_name), fee_payments(amount_paid)').order('created_at', { ascending: false });
            allStudents = data || [];
            renderList(allStudents);
        }

        function renderList(data) {
            const container = document.getElementById('studentsList'); container.innerHTML = '';
            if (data.length === 0) { container.innerHTML = '<div style="text-align:center; padding:20px; color:#ef4444;">No students found.</div>'; return; }
            
            data.forEach(s => {
                const bal = (Number(s.total_fee)||0) - (Number(s.admission_fee)||0) - (s.fee_payments ? s.fee_payments.reduce((sum, p) => sum + Number(p.amount_paid), 0) : 0);
                const balColor = bal > 0 ? '#EF4444' : '#10B981';
                const balText = bal > 0 ? `₹ ${bal}` : 'Fully Paid';
                let avatarUrl = s.photo_url || (s.gender === 'Female' ? 'https://avatar.iran.liara.run/public/girl' : 'https://avatar.iran.liara.run/public/boy');

                const card = document.createElement('div');
                card.className = 'student-mobile-card';
                card.innerHTML = `
                    <div class="smc-header">
                        <div class="smc-header-left"><div class="smc-name">${s.full_name}</div><div class="smc-reg">${s.register_number}</div></div>
                        <div class="smc-header-center"><img src="${avatarUrl}" class="student-avatar" alt="Photo"></div>
                    </div>
                    <div class="smc-row"><span class="smc-label">Course:</span> <span class="smc-value">${s.courses?.course_name || 'N/A'}</span></div>
                    <div class="smc-row"><span class="smc-label">Balance Fee:</span> <span class="smc-value" style="color:${balColor}; font-weight:800;">${balText}</span></div>
                    <div class="smc-actions">
                        <button onclick="deleteStudent('${s.id}', '${s.register_number}')" class="smc-btn btn-delete">Delete</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            renderList(allStudents.filter(s => s.full_name?.toLowerCase().includes(val) || s.register_number?.toLowerCase().includes(val)));
        });

        window.deleteStudent = async function(id, regNo) {
            const inp = prompt(`⚠️ Type the register number to delete: ${regNo}`);
            if (inp === regNo) {
                await supabase.from('fee_payments').delete().eq('student_id', id);
                await supabase.from('students').delete().eq('id', id);
                fetchStudents(); 
            } else if (inp) alert('Register number does not match.');
        };

        document.getElementById('logoutBtn').addEventListener('click', async () => { 
            await supabase.auth.signOut(); localStorage.clear(); sessionStorage.clear();
            window.history.replaceState(null, '', 'login.html'); window.location.replace('login.html'); 
        });
        checkAuth();
    </script>
</body>
</html>

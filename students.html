<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Directory - Globus Technical Academy</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        /* പ്രിന്റ് ചെയ്യുമ്പോൾ കാർഡ് മാത്രം കാണിക്കാനും എടിഎം കാർഡ് വലുപ്പത്തിൽ വരാനുമുള്ള സ്റ്റൈൽ */
        @media print {
            body * {
                visibility: hidden;
            }
            #studentModal, #smartCardContainer, #smartCardContainer * {
                visibility: visible;
            }
            #studentModal {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                background: white !important;
                display: flex !important;
                justify-content: flex-start;
                align-items: flex-start;
                padding: 0;
                margin: 0;
            }
            .no-print {
                display: none !important;
            }
            /* Scale down exactly to standard ATM/CR80 Card Size */
            #smartCardContent {
                width: 320px !important;
                height: 510px !important;
                transform: scale(0.65) !important;
                transform-origin: top left !important;
                box-shadow: none !important;
                border: 1px dashed #999 !important; /* Cutting line for print */
                margin: 10px;
            }
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
    </style>
</head>
<body>
    
    <nav class="app-header no-print">
        <div class="header-left" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px;">
            <img src="assets/images/logo.png" class="logo-small" alt="Logo" onerror="this.style.display='none'">
            <div style="display: flex; flex-direction: column; overflow: hidden;">
                <span class="brand-top" style="font-size: 16px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Globus</span>
                <span class="brand-bottom" style="text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Technical Academy</span>
            </div>
        </div>
        
        <div class="header-right" style="flex-shrink: 0; margin-left: 10px;">
            <button class="btn-logout-custom" id="logoutBtn">Logout</button>
        </div>
    </nav>

    <main class="main-content no-print">
        <div style="text-align: center; margin-bottom: 20px;">
            <a href="dashboard.html" style="color: var(--primary-light); text-decoration: none; font-weight: 600;">← Return to Dashboard</a>
        </div>
        
        <div class="filter-section">
            <input type="text" id="searchInput" class="form-control" placeholder="🔍 Search Name, Phone, Reg No...">
        </div>
        <div id="studentsList"><div style="text-align:center; padding:20px; color:#6B7280;">Loading students...</div></div>
    </main>

    <!-- Student Live Editor & Smart ID Card Modal -->
    <div id="studentModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:100; justify-content:center; align-items:center; padding:15px;">
        <div style="background:#fff; width:100%; max-width:750px; border-radius:16px; padding:20px; display:flex; gap:20px; flex-wrap:wrap; max-height:95vh; overflow-y:auto; box-shadow: 0 10px 25px rgba(0,0,0,0.3);">
            
            <!-- Left Side: Live Smart ID Card Preview (The Printable Area) -->
            <div id="smartCardContainer" style="flex:1; display:flex; justify-content:center; align-items:flex-start; min-width:320px;">
                <div id="smartCardContent" style="width: 320px; height: 510px; background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 50%, #e2e8f0 100%); border: 2px solid #cbd5e1; border-radius: 12px; padding: 15px; position: relative; box-sizing: border-box; overflow: hidden; box-shadow: 0 8px 15px rgba(0,0,0,0.1);">
                    
                    <!-- Header (Logo Left, Text Center 2 lines) -->
                    <div style="display: flex; align-items: center; border-bottom: 2px solid rgba(30, 58, 138, 0.2); padding-bottom: 8px; margin-bottom: 8px;">
                        <img src="assets/images/logo.png" style="width: 60px; height: 60px; object-fit: contain; margin-right: 12px;" alt="Logo" onerror="this.style.display='none'">
                        <div style="text-align: center; flex: 1; margin-right: 15px;">
                            <span style="font-size: 22px; font-weight: 900; color: #1e3a8a; display: block; line-height: 1;">GLOBUS</span>
                            <span style="font-size: 11px; font-weight: 800; color: #dc2626; display: block; margin-top: 3px; letter-spacing: 0.5px;">TECHNICAL ACADEMY</span>
                        </div>
                    </div>

                    <!-- Title -->
                    <div style="background: #1e3a8a; color: #fff; font-size: 13px; font-weight: 700; text-align: center; padding: 4px 0; border-radius: 4px; margin-bottom: 12px; letter-spacing: 1.5px;">
                        STUDENT ID CARD
                    </div>

                    <!-- Large Photo -->
                    <div style="text-align: center; margin-bottom: 12px;">
                        <img id="cardAvatarImg" src="https://avatar.iran.liara.run/public" style="width: 110px; height: 135px; object-fit: cover; border-radius: 8px; border: 3px solid #e5e7eb; box-shadow: 0 4px 8px rgba(0,0,0,0.15);">
                    </div>

                    <!-- Details Section -->
                    <div style="text-align: center; position: relative; z-index: 2;">
                        <h3 id="cardStudentName" style="font-size: 21px; color: #111827; margin: 0 0 4px 0; font-weight: 800; text-transform:uppercase;">Student Name</h3>
                        <div id="cardCourseName" style="font-size: 13px; color: #047857; font-weight: 800; margin-bottom: 15px; text-transform:uppercase;">Course Name</div>

                        <div style="display: flex; justify-content: center; gap: 25px; font-size: 13px; color: #111827; font-weight: 700; background: rgba(255,255,255,0.7); padding: 8px; border-radius: 8px;">
                            <div><span style="color:#6b7280; font-size:10px; font-weight:600; display:block;">REG NO</span> <span id="cardRegNo">GLB-001</span></div>
                            <div><span style="color:#6b7280; font-size:10px; font-weight:600; display:block;">PHONE</span> <span id="cardPhone">9876543210</span></div>
                        </div>
                    </div>

                    <!-- Round Digital Seal (Bottom Right) -->
                    <div style="position: absolute; bottom: 35px; right: 12px; width: 65px; height: 65px; border: 2px solid rgba(30, 58, 138, 0.3); border-radius: 50%; display: flex; align-items: center; justify-content: center; transform: rotate(-15deg); z-index: 1;">
                        <div style="width: 57px; height: 57px; border: 1px dashed rgba(30, 58, 138, 0.5); border-radius: 50%; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 6.5px; font-weight: 800; color: rgba(30, 58, 138, 0.5); padding: 2px; line-height: 1.2;">
                            GLOBUS<br>TECHNICAL<br>ACADEMY<br>KOTTAKKAL
                        </div>
                    </div>

                    <!-- Tiny Footer Note -->
                    <div style="position: absolute; bottom: 6px; left: 0; width: 100%; font-size: 7px; color: #9ca3af; font-weight: 600; text-align: center; z-index: 2;">
                        If found, please return to this number: +91 9846000000
                    </div>
                </div>
            </div>

            <!-- Right Side: Live Edit Form & Action Buttons (Hidden during Print) -->
            <div class="no-print" style="flex:1; min-width:300px; background:#f8fafc; padding:20px; border-radius:12px; border:1px solid #e2e8f0; display:flex; flex-direction:column;">
                <h3 style="font-size:16px; color:#1e40af; margin-bottom:15px; border-bottom:2px solid #e2e8f0; padding-bottom:5px;">✏️ Edit & Generate Card</h3>

                <!-- Live Photo Input -->
                <label style="font-size:12px; font-weight:600; color:#374151;">Upload Photo (For Live Preview & Print)</label>
                <input type="file" id="livePhotoInput" accept="image/*" class="form-control" style="margin-bottom:12px; padding:6px; font-size:12px;" onchange="updateLivePhoto(event)">

                <label style="font-size:12px; font-weight:600; color:#374151;">Student Name</label>
                <input type="text" id="liveName" class="form-control" style="margin-bottom:12px;" oninput="document.getElementById('cardStudentName').innerText = this.value || 'N/A'">

                <label style="font-size:12px; font-weight:600; color:#374151;">Course Name</label>
                <input type="text" id="liveCourse" class="form-control" style="margin-bottom:12px;" oninput="document.getElementById('cardCourseName').innerText = this.value || 'N/A'">

                <div style="display:flex; gap:10px; margin-bottom:20px;">
                    <div style="flex:1;">
                        <label style="font-size:12px; font-weight:600; color:#374151;">Reg No</label>
                        <input type="text" id="liveReg" class="form-control" oninput="document.getElementById('cardRegNo').innerText = this.value || 'N/A'">
                    </div>
                    <div style="flex:1;">
                        <label style="font-size:12px; font-weight:600; color:#374151;">Phone</label>
                        <input type="text" id="livePhone" class="form-control" oninput="document.getElementById('cardPhone').innerText = this.value || 'N/A'">
                    </div>
                </div>

                <!-- Action Buttons: Share & Print (Works without saving) -->
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:15px;">
                    <button type="button" onclick="printCard()" style="background: #2563eb; color: #fff; border: none; padding: 10px; border-radius: 6px; font-weight: 600; cursor: pointer; display:flex; justify-content:center; align-items:center; gap:5px;">🖨️ Print Card</button>
                    <button type="button" onclick="shareCard()" style="background: #10b981; color: #fff; border: none; padding: 10px; border-radius: 6px; font-weight: 600; cursor: pointer; display:flex; justify-content:center; align-items:center; gap:5px;">🔗 Share</button>
                </div>
                
                <hr style="border:none; border-top:1px dashed #cbd5e1; margin-bottom:15px;">
                
                <!-- Save Button (Saves text data to DB) -->
                <button type="button" onclick="saveTextDataToDB()" style="background: #f59e0b; color: #fff; border: none; padding: 12px; border-radius: 6px; font-weight: 600; cursor: pointer; margin-bottom:10px;">💾 Save Details to Database</button>
                <button type="button" onclick="closeModal()" style="background: #6b7280; color: #fff; border: none; padding: 10px; border-radius: 6px; font-weight: 600; cursor: pointer;">Cancel / Close</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase } from './assets/js/supabase-config.js';
        let allStudents = [];
        let currentStudentData = null;

        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return; }
            fetchStudents();
        }

        async function fetchStudents() {
            try {
                // ജോയിൻ ഒഴിവാക്കി സ്റ്റുഡന്റ്സ് മാത്രം ഫെച്ച് ചെയ്യുന്നു
                const { data: studentsData, error: studentError } = await supabase
                    .from('students')
                    .select('*')
                    .order('created_at', { ascending: false });
                
                if (studentError) throw studentError;

                // കോഴ്‌സ് പേരുകൾ എടുക്കാൻ
                const { data: coursesData } = await supabase.from('courses').select('id, course_name');
                const courseMap = {};
                if (coursesData) {
                    coursesData.forEach(c => courseMap[c.id] = c.course_name);
                }

                allStudents = studentsData || [];

                allStudents.forEach(s => {
                    if (s.course_id && courseMap[s.course_id]) {
                        s.display_course_name = courseMap[s.course_id];
                    } else {
                        s.display_course_name = s.course_name || s.course || 'Not Assigned';
                    }
                });

                renderList(allStudents);
            } catch (err) {
                console.error("Database Error:", err);
                alert("Database Error: " + err.message);
            }
        }

        function renderList(data) {
            const container = document.getElementById('studentsList'); container.innerHTML = '';
            if (data.length === 0) { container.innerHTML = '<div style="text-align:center; padding:20px; color:#ef4444;">No students found.</div>'; return; }
            
            data.forEach(s => {
                let avatarUrl = s.photo_url || (s.gender === 'Female' ? 'https://avatar.iran.liara.run/public/girl' : 'https://avatar.iran.liara.run/public/boy');

                const card = document.createElement('div');
                card.className = 'student-mobile-card';
                card.innerHTML = `
                    <div class="smc-header">
                        <div class="smc-header-left">
                            <div class="smc-name">${s.full_name || 'N/A'}</div>
                            <div class="smc-reg">${s.register_number || 'N/A'}</div>
                        </div>
                        <div class="smc-header-center"><img src="${avatarUrl}" class="student-avatar" alt="Photo"></div>
                    </div>
                    <div class="smc-row"><span class="smc-label">Phone:</span> <span class="smc-value">${s.phone_number || 'N/A'}</span></div>
                    <div class="smc-row"><span class="smc-label">Course:</span> <span class="smc-value" style="font-weight:600;">${s.display_course_name}</span></div>
                    
                    <div style="display: flex; gap: 10px; margin-top: 15px;">
                        <button onclick="openCardEditor('${s.id}')" style="flex:1; background: #3B82F6; color: #fff; border: none; padding: 10px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px;">View & Edit Card</button>
                        <button onclick="deleteStudent('${s.id}', '${s.register_number}')" style="background: #EF4444; color: #fff; border: none; padding: 10px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px;">Delete</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // കാർഡ് എഡിറ്റർ തുറക്കുന്നു
        window.openCardEditor = function(id) {
            const s = allStudents.find(x => x.id === id);
            if (!s) return;
            currentStudentData = s;

            // ഫോമിലേക്ക് ഡാറ്റ മാറ്റുന്നു
            document.getElementById('liveName').value = s.full_name || '';
            document.getElementById('liveCourse').value = s.display_course_name || '';
            document.getElementById('liveReg').value = s.register_number || '';
            document.getElementById('livePhone').value = s.phone_number || '';
            document.getElementById('livePhotoInput').value = ''; // Reset file input

            // കാർഡിലേക്ക് ഡാറ്റ നൽകുന്നു
            document.getElementById('cardStudentName').innerText = s.full_name || 'N/A';
            document.getElementById('cardCourseName').innerText = s.display_course_name || 'N/A';
            document.getElementById('cardRegNo').innerText = s.register_number || 'N/A';
            document.getElementById('cardPhone').innerText = s.phone_number || 'N/A';

            // ഫോട്ടോ സെറ്റ് ചെയ്യുന്നു
            if (s.photo_url) {
                document.getElementById('cardAvatarImg').src = s.photo_url;
            } else {
                document.getElementById('cardAvatarImg').src = s.gender === 'Female' ? 'https://avatar.iran.liara.run/public/girl' : 'https://avatar.iran.liara.run/public/boy';
            }

            document.getElementById('studentModal').style.display = 'flex';
        };

        // ലോക്കൽ ഫോട്ടോ സെലക്ട് ചെയ്യുമ്പോൾ ഉടൻ തന്നെ കാർഡിൽ മാറാൻ
        window.updateLivePhoto = function(event) {
            const file = event.target.files[0];
            if (file) {
                const imageUrl = URL.createObjectURL(file);
                document.getElementById('cardAvatarImg').src = imageUrl;
            }
        };

        // ഡാറ്റാബേസിലേക്ക് ടെക്സ്റ്റ് വിവരങ്ങൾ മാത്രം സേവ് ചെയ്യാൻ
        window.saveTextDataToDB = async function() {
            if (!currentStudentData) return;
            
            const newName = document.getElementById('liveName').value.trim();
            const newPhone = document.getElementById('livePhone').value.trim();
            const newReg = document.getElementById('liveReg').value.trim();

            if (newPhone && newPhone.length !== 10) {
                alert('Phone number must be 10 digits.');
                return;
            }

            // ഡാറ്റാബേസിൽ അപ്ഡേറ്റ് ചെയ്യുന്നു (ഫോട്ടോ ഇതിൽ അപ്ഡേറ്റ് ചെയ്യുന്നില്ല)
            const { error } = await supabase.from('students').update({
                full_name: newName,
                phone_number: newPhone,
                register_number: newReg
            }).eq('id', currentStudentData.id);

            if (error) {
                alert('Error saving data: ' + error.message);
            } else {
                alert('Details saved successfully!\n(Note: The selected photo is kept for printing/sharing but not uploaded to the server to save space).');
                fetchStudents(); // ലിസ്റ്റ് റിഫ്രഷ് ചെയ്യാൻ
            }
        };

        // PDF ഡൗൺലോഡ് / പ്രിന്റ് ചെയ്യാൻ
        window.printCard = function() {
            window.print();
        };

        // വാട്സാപ്പിലോ മറ്റോ ഷെയർ ചെയ്യാൻ
        window.shareCard = async function() {
            const name = document.getElementById('liveName').value || 'Unknown';
            const course = document.getElementById('liveCourse').value || 'N/A';
            const reg = document.getElementById('liveReg').value || 'N/A';
            const phone = document.getElementById('livePhone').value || 'N/A';
            
            const shareText = `🎓 *Globus Technical Academy*\n\n*Student ID Profile*\n👤 Name: ${name}\n🔢 Reg No: ${reg}\n📚 Course: ${course}\n📱 Phone: ${phone}\n\nJoin our technical courses today!`;
            
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'Student ID Card Details',
                        text: shareText,
                    });
                } catch (err) {
                    console.log('Share cancelled:', err);
                }
            } else {
                navigator.clipboard.writeText(shareText);
                alert('Student details copied to clipboard. You can paste and share it anywhere!');
            }
        };

        window.closeModal = function() {
            document.getElementById('studentModal').style.display = 'none';
        };

        window.deleteStudent = async function(id, regNo) {
            const inp = prompt(`⚠️ Type the register number to delete: ${regNo}`);
            if (inp === regNo) {
                await supabase.from('fee_payments').delete().eq('student_id', id);
                await supabase.from('students').delete().eq('id', id);
                fetchStudents(); 
            } else if (inp) alert('Register number does not match.');
        };

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            renderList(allStudents.filter(s => s.full_name?.toLowerCase().includes(val) || s.register_number?.toLowerCase().includes(val) || s.phone_number?.toLowerCase().includes(val)));
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => { 
            await supabase.auth.signOut(); localStorage.clear(); sessionStorage.clear();
            window.history.replaceState(null, '', 'login.html'); window.location.replace('login.html'); 
        });
        
        checkAuth();
    </script>
</body>
</html>

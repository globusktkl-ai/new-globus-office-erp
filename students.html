<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directory - Globus Technical Academy</title>
    <link rel="stylesheet" href="assets/css/style.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        /* Shared Styles */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 100; justify-content: center; align-items: flex-start; padding: 30px 10px; overflow-y: auto; }
        .modal-container { background: #fff; width: 100%; max-width: 780px; border-radius: 16px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); margin: auto; display: flex; gap: 20px; flex-wrap: wrap; }
        
        /* Directory List Styles */
        .search-filter-container { display: flex; border: 2px solid #cbd5e1; border-radius: 30px; overflow: hidden; background: white; margin-bottom: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .search-box-pill { flex: 2; border: none; padding: 14px 20px; outline: none; font-size: 15px; color: #333; }
        .filter-dropdown-pill { flex: 1; border: none; border-left: 2px solid #cbd5e1; padding: 12px 15px; outline: none; background: #f8fafc; font-size: 14px; font-weight: 700; color: #1e3a8a; cursor: pointer; }
        
        .student-mobile-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .smc-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; border-bottom: 2px dashed #cbd5e1; padding-bottom: 12px; }
        .smc-name { font-size: 18px; font-weight: 800; color: #1e3a8a; margin-bottom: 4px; line-height: 1.2; }
        .smc-reg { font-size: 14px; color: #64748b; font-weight: 600; }
        .smc-header-center img { width: 65px; height: 65px; border-radius: 50%; object-fit: cover; border: 2px solid #cbd5e1; }
        .smc-row { display: flex; align-items: flex-start; margin-bottom: 8px; font-size: 14px; }
        .smc-label { width: 100px; color: #64748b; font-weight: 600; flex-shrink: 0; }
        .smc-value { flex: 1; color: #1f2937; font-weight: 500; }

        .card-action-btns { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 10px; margin-top: 15px; border-top: 1px solid #f1f5f9; padding-top: 15px; }
        .btn-card { border: none; padding: 10px 5px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; text-align: center; }
        .btn-view { background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; }
        .btn-id { background: #3b82f6; color: #fff; }
        .btn-cert-mini { background: #f59e0b; color: #fff; }
        .btn-del { background: #fff; color: #ef4444; border: 1px solid #ef4444; }

        /* Certificate Modal Specific Styles (Copied from exams) */
        .cert-modal-container { max-width: 950px; }
        .cert-form-col { flex: 1; min-width: 300px; background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .cert-preview-col { flex: 1.5; min-width: 350px; display: flex; flex-direction: column; background: #e2e8f0; padding: 15px; border-radius: 8px; }
        .zoom-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-weight: bold; color: #1e3a8a; }
        .zoom-btn { background: #fff; border: 1px solid #cbd5e1; padding: 4px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; margin-left: 5px; }
        .cert-scroll-area { width: 100%; height: 500px; overflow: auto; background: #cbd5e1; border-radius: 6px; display: flex; justify-content: center; align-items: flex-start; padding: 10px; }
        .cert-viewport { transition: all 0.2s; }
        .cert-wrapper { position: relative; width: 700px; height: 990px; background-color: white; background-image: url('assets/images/Cirtificate.jpg'); background-size: 100% 100%; transform-origin: top left; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .cert-text { position: absolute; font-family: 'Times New Roman', Times, serif; color: #000; font-weight: bold; white-space: nowrap; }
        
        #c-serial { top: 9.5%; left: 16%; font-size: 18px; color: #d32f2f; }
        #c-reg { top: 9.5%; right: 16%; font-size: 18px; color: #d32f2f; }
        #c-name { top: 40.5%; left: 50%; transform: translateX(-50%); font-size: 26px; }
        #c-course { top: 45.5%; left: 50%; transform: translateX(-50%); font-size: 20px; text-transform: uppercase; }
        #c-grade { top: 51.5%; left: 63%; font-size: 22px; }
        #c-date-from { top: 54.3%; left: 35%; font-size: 18px; }
        #c-date-to { top: 54.3%; left: 58%; font-size: 18px; }
        #c-exam-date { top: 57.5%; left: 32%; font-size: 18px; }
        #c-issue-date { top: 57.5%; left: 65%; font-size: 18px; }

        .form-control-cert { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; margin-bottom: 10px; outline: none; }

        @media (max-width: 650px) {
            .search-filter-container { flex-direction: column; border-radius: 12px; }
            .filter-dropdown-pill { border-left: none; border-top: 1px solid #cbd5e1; padding: 14px 15px; }
        }

        @media print {
            body * { visibility: hidden; }
            #certModal, #certModal * { visibility: visible; }
            #certModal { position: absolute; left: 0; top: 0; width: 100%; margin: 0; padding: 0; background: white; }
            .modal-container { box-shadow: none; padding: 0; max-width: 100%; display: block; }
            .cert-form-col, .zoom-controls { display: none !important; }
            .cert-preview-col { background: white; padding: 0; display: block; overflow: visible; }
            .cert-scroll-area { height: auto; overflow: visible; background: white; padding: 0; }
            #certViewport { width: 700px !important; height: 990px !important; margin: 0 auto; }
            .cert-wrapper { transform: scale(1) !important; margin: 0 auto; box-shadow: none; }
            @page { size: A4 portrait; margin: 0; }
        }
    </style>
</head>
<body>
    
    <nav class="app-header no-print">
        <div class="header-left" style="flex: 1; display: flex; align-items: center; gap: 10px;">
            <img src="assets/images/logo.png" class="logo-small" alt="Logo" onerror="this.style.display='none'">
            <div style="display: flex; flex-direction: column;">
                <span style="font-size: 15px; font-weight: 900; letter-spacing: 0.5px;">GLOBUS</span>
            </div>
        </div>
        <div class="header-right"><button class="btn-logout-custom" id="logoutBtn" style="padding: 6px 12px; font-size: 12px; border-radius: 6px; background: #ef4444; color: white; border: none; font-weight: bold;">Logout</button></div>
    </nav>

    <main class="main-content no-print">
        <div style="text-align: center; margin-bottom: 10px;"><a href="dashboard.html" style="color: #3b82f6; text-decoration: none; font-weight: 600;">← Return to Dashboard</a></div>
        <h2 style="text-align: center; font-size: 20px; margin-bottom: 20px; color: #1e3a8a; font-weight: 900; text-transform: uppercase;">Student Directory</h2>
        
        <div class="search-filter-container">
            <input type="text" id="searchInput" class="search-box-pill" placeholder="🔍 Search Name, Reg No, Phone...">
            <select id="statusFilter" class="filter-dropdown-pill">
                <option value="active" selected>🟢 Active Students</option>
                <option value="completed">🎓 Completed Students</option>
                <option value="all">📁 All Students</option>
            </select>
        </div>
        
        <div id="studentsList"><div style="text-align:center; padding:20px; color:#6B7280;">Loading students...</div></div>
    </main>

    <!-- Certificate Modal (Hidden by Default) -->
    <div id="certModal" class="modal-overlay">
        <div class="modal-container cert-modal-container">
            <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; margin-bottom: 15px;">
                <h3 style="margin:0; color:#1e3a8a; font-size: 18px;">🎓 Print / View Certificate</h3>
                <button onclick="closeModal()" class="no-print" style="background:#ef4444; color:#fff; border:none; padding:5px 12px; border-radius:6px; cursor:pointer; font-weight:bold;">X Close</button>
            </div>
            
            <div class="cert-form-col no-print">
                <label style="font-size:11px; font-weight:600; color:#475569;">Serial # & Reg #</label>
                <div style="display:flex; gap:10px;">
                    <input type="text" id="f-serial" class="form-control-cert" oninput="updateCert()">
                    <input type="text" id="f-reg" class="form-control-cert" oninput="updateCert()">
                </div>
                
                <label style="font-size:11px; font-weight:600; color:#475569;">Student & Course</label>
                <input type="text" id="f-name" class="form-control-cert" oninput="updateCert()">
                <input type="text" id="f-course" class="form-control-cert" oninput="updateCert()">
                
                <label style="font-size:11px; font-weight:600; color:#475569;">Grade & Issue Date</label>
                <div style="display:flex; gap:10px;">
                    <input type="text" id="f-grade" class="form-control-cert" oninput="updateCert()">
                    <input type="text" id="f-issue-date" class="form-control-cert" oninput="updateCert()">
                </div>

                <label style="font-size:11px; font-weight:600; color:#475569;">Duration (From - To)</label>
                <div style="display:flex; gap:10px;">
                    <input type="text" id="f-date-from" class="form-control-cert" oninput="updateCert()">
                    <input type="text" id="f-date-to" class="form-control-cert" oninput="updateCert()">
                </div>

                <label style="font-size:11px; font-weight:600; color:#475569;">Exam Conducted On</label>
                <input type="text" id="f-exam-date" class="form-control-cert" oninput="updateCert()">
                
                <hr style="border:1px dashed #cbd5e1; margin: 15px 0;">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <button onclick="printCertificate()" style="padding:10px; background:#4f46e5; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">🖨️ Print / PDF</button>
                    <button id="shareBtn" onclick="shareCertificate()" style="padding:10px; background:#059669; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">📲 Send PNG</button>
                </div>
            </div>
            
            <div class="cert-preview-col">
                <div class="zoom-controls no-print">
                    <span>🔍 Preview</span>
                    <div>
                        <button class="zoom-btn" onclick="zoomCert(0.1)">+</button>
                        <button class="zoom-btn" onclick="zoomCert(-0.1)">-</button>
                    </div>
                </div>
                <div class="cert-scroll-area">
                    <div id="certViewport">
                        <div class="cert-wrapper" id="certificateRenderArea">
                            <div class="cert-text" id="c-serial">GM 0000000</div>
                            <div class="cert-text" id="c-reg">MP 000000</div>
                            <div class="cert-text" id="c-name">STUDENT NAME</div>
                            <div class="cert-text" id="c-course">COURSE NAME</div>
                            <div class="cert-text" id="c-grade">A+</div>
                            <div class="cert-text" id="c-date-from">DD-MM-YYYY</div>
                            <div class="cert-text" id="c-date-to">DD-MM-YYYY</div>
                            <div class="cert-text" id="c-exam-date">DD-MM-YYYY</div>
                            <div class="cert-text" id="c-issue-date">DD-MM-YYYY</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Keep ID Card Modal Code Below (Hidden in this snippet for brevity, but functions must remain!) -->
    <!-- (Normally you keep the #viewEditContainer and #profileCardContainer here from the previous code) -->

    <script type="module">
        import { supabase } from './assets/js/supabase-config.js';
        let allStudents = [], globalCourses = [], currentZoom = 0.5;

        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return; }
            fetchStudents();
        }

        async function fetchStudents() {
            try {
                const { data: studentsData } = await supabase.from('students').select('*').order('created_at', { ascending: false });
                const { data: coursesData } = await supabase.from('courses').select('id, course_name, modules');
                const { data: paymentsData } = await supabase.from('fee_payments').select('student_id, amount_paid');

                globalCourses = coursesData || [];
                const courseMap = {}; globalCourses.forEach(c => courseMap[c.id] = c.course_name);

                allStudents = studentsData || [];
                allStudents.forEach(s => {
                    s.display_course_name = (s.course_id && courseMap[s.course_id]) ? courseMap[s.course_id] : (s.course_name || 'N/A');
                    let paid = 0;
                    if (paymentsData) paid = paymentsData.filter(p => p.student_id === s.id).reduce((sum, p) => sum + Number(p.amount_paid || 0), 0);
                    s.total_paid_fees = paid;
                });
                applyFilters(); 
            } catch (err) { console.error("Database Error:", err); }
        }

        window.applyFilters = function() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const statusTerm = document.getElementById('statusFilter').value; 

            let filtered = allStudents.filter(s => {
                const matchesSearch = (s.full_name?.toLowerCase().includes(searchTerm) || s.register_number?.toLowerCase().includes(searchTerm) || s.phone_number?.toLowerCase().includes(searchTerm));
                let matchesStatus = true;
                const stuStatus = (s.status || 'active').toLowerCase();
                if (statusTerm === 'active') matchesStatus = (stuStatus === 'active');
                else if (statusTerm === 'completed') matchesStatus = (stuStatus === 'completed' || stuStatus === 'inactive');
                return matchesSearch && matchesStatus;
            });
            renderList(filtered);
        }

        document.getElementById('searchInput').addEventListener('input', applyFilters);
        document.getElementById('statusFilter').addEventListener('change', applyFilters);

        function renderList(data) {
            const container = document.getElementById('studentsList'); container.innerHTML = '';
            if (data.length === 0) { container.innerHTML = '<div style="text-align:center; padding:20px; color:#ef4444; font-weight:bold;">No students found.</div>'; return; }
            
            data.forEach(s => {
                const bal = (Number(s.total_fee)||0) - (Number(s.admission_fee)||0) - s.total_paid_fees;
                const balColor = bal > 0 ? '#EF4444' : '#10B981';
                const balText = bal > 0 ? `₹ ${bal}` : 'Fully Paid';
                let avatarUrl = s.photo_url || (s.gender === 'Female' ? 'https://avatar.iran.liara.run/public/girl' : 'https://avatar.iran.liara.run/public/boy');
                let stuStatus = (s.status || 'active').toLowerCase();

                const card = document.createElement('div');
                card.className = 'student-mobile-card';
                
                // Constructing action buttons dynamically based on status
                let actionBtnsHTML = `
                    <button onclick="/* view logic */" class="btn-card btn-view">View</button>
                    <button onclick="/* id card logic */" class="btn-card btn-id">ID Card</button>
                `;
                if(stuStatus === 'completed') {
                    // Added Certificate Button for completed students
                    actionBtnsHTML += `<button onclick="openCertModal('${s.id}', '${s.course_id}')" class="btn-card btn-cert-mini">🎓 Certificate</button>`;
                } else {
                    actionBtnsHTML += `<button onclick="deleteStudent('${s.id}', '${s.register_number}')" class="btn-card btn-del">Delete</button>`;
                }

                card.innerHTML = `
                    <div class="smc-header">
                        <div class="smc-header-left">
                            <div class="smc-name">${s.full_name || 'N/A'}</div>
                            <div class="smc-reg">Reg No: ${s.register_number || 'N/A'}</div>
                        </div>
                        <div class="smc-header-center"><img src="${avatarUrl}" class="student-avatar" alt="Photo"></div>
                    </div>
                    <div class="smc-row"><span class="smc-label">Course:</span> <span class="smc-value" style="font-weight:700; color:#1e3a8a;">${s.display_course_name}</span></div>
                    <div class="smc-row"><span class="smc-label">Fee Status:</span> <span class="smc-value" style="color:${balColor}; font-weight:800;">${balText}</span></div>
                    <div class="card-action-btns">${actionBtnsHTML}</div>
                `;
                container.appendChild(card);
            });
        }

        // --- Certificate Logic for Directory ---
        window.zoomCert = function(amount) {
            currentZoom += amount;
            if(currentZoom < 0.3) currentZoom = 0.3; if(currentZoom > 1.5) currentZoom = 1.5;
            document.getElementById('certificateRenderArea').style.transform = `scale(${currentZoom})`;
            document.getElementById('certViewport').style.width = `${700 * currentZoom}px`;
            document.getElementById('certViewport').style.height = `${990 * currentZoom}px`;
        };

        window.openCertModal = function(studentId, courseId) {
            const student = allStudents.find(s => s.id === studentId), course = globalCourses.find(c => c.id === courseId);
            if(!student || !course) return; 
            
            const today = new Date(), dateStr = today.getDate().toString().padStart(2, '0') + '-' + (today.getMonth()+1).toString().padStart(2, '0') + '-' + today.getFullYear();
            let fromDate = student.admission_date ? new Date(student.admission_date) : today;

            document.getElementById('f-serial').value = 'GM ' + Date.now().toString().slice(-7);
            document.getElementById('f-reg').value = student.register_number || 'REG N/A';
            document.getElementById('f-name').value = (student.full_name || '').toUpperCase();
            document.getElementById('f-course').value = (course.course_name || '').toUpperCase();
            document.getElementById('f-issue-date').value = dateStr; document.getElementById('f-exam-date').value = dateStr;
            document.getElementById('f-date-from').value = fromDate.getDate().toString().padStart(2, '0') + '-' + (fromDate.getMonth()+1).toString().padStart(2, '0') + '-' + fromDate.getFullYear();
            document.getElementById('f-date-to').value = dateStr;

            updateCert(); zoomCert(0); // Reset zoom
            document.getElementById('certModal').style.display = 'flex';
        };

        window.updateCert = function() {
            ['serial', 'reg', 'name', 'course', 'grade', 'issue-date', 'exam-date', 'date-from', 'date-to'].forEach(id => {
                document.getElementById(`c-${id}`).innerText = document.getElementById(`f-${id}`).value;
            });
        };

        window.closeModal = function() { document.getElementById('certModal').style.display = 'none'; };
        window.printCertificate = function() { window.print(); };

        window.shareCertificate = async function() {
            const btn = document.getElementById('shareBtn'), originalText = btn.innerHTML;
            btn.innerHTML = '⏳ Generating...'; btn.disabled = true;
            try {
                const wrapper = document.getElementById('certificateRenderArea'), oldTransform = wrapper.style.transform;
                wrapper.style.transform = 'scale(1)'; // Real size for render
                const canvas = await html2canvas(wrapper, { scale: 2, useCORS: true, backgroundColor: '#ffffff' });
                wrapper.style.transform = oldTransform; 

                canvas.toBlob(async (blob) => {
                    const name = document.getElementById('f-name').value.trim() || 'Student';
                    const file = new File([blob], `Certificate_${name}.png`, { type: 'image/png' });
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        try { await navigator.share({ files: [file], title: 'Certificate', text: `Certificate for ${name}` }); } catch (err) {}
                    } else {
                        const link = document.createElement('a'); link.download = `Certificate_${name}.png`; link.href = canvas.toDataURL('image/png'); link.click();
                    }
                    btn.innerHTML = originalText; btn.disabled = false;
                }, 'image/png');
            } catch (error) { alert("Error generating image."); btn.innerHTML = originalText; btn.disabled = false; }
        };

        document.getElementById('logoutBtn').addEventListener('click', async () => { 
            await supabase.auth.signOut(); localStorage.clear(); window.location.replace('login.html'); 
        });

        checkAuth();
    </script>
</body>
</html>

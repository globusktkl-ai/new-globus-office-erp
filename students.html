<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Directory - Globus Technical Academy</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <nav class="app-header">
        <div class="header-left">
            <a href="dashboard.html" class="btn-back-icon">←</a>
            <img src="assets/images/logo.png" class="logo-small" alt="Logo" onerror="this.style.display='none'">
        </div>
        <div class="header-center">Directory</div>
        <div class="header-right">
            <span class="user-name-small" id="userName">Loading...</span>
            <button class="btn-logout-small" id="logoutBtn">Logout</button>
        </div>
    </nav>

    <main class="main-content">
        <div class="filter-section">
            <input type="text" id="searchInput" class="form-control" placeholder="🔍 Search Name, Phone, Reg No...">
            <div class="form-row-2" style="margin-bottom:0;">
                <select id="filterCourse" class="form-control"><option value="all">All Courses</option></select>
                <select id="filterFee" class="form-control">
                    <option value="all">All Fee Status</option>
                    <option value="pending">Fee Pending</option>
                    <option value="paid">Fully Paid</option>
                </select>
            </div>
        </div>

        <div id="studentsList">
            <div style="text-align:center; padding:20px; color:#6B7280;">Loading students...</div>
        </div>
    </main>

    <script type="module">
        import { supabase } from './assets/js/supabase-config.js';
        
        let allStudents = [];

        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return; }
            document.getElementById('userName').textContent = session.user.user_metadata.full_name || session.user.email.split('@')[0];
            fetchStudents();
        }

        async function fetchStudents() {
            const { data } = await supabase.from('students').select('id, register_number, full_name, phone_number, gender, status, total_fee, admission_fee, photo_url, courses(course_name), fee_payments(amount_paid)').order('created_at', { ascending: false });
            allStudents = data || [];
            
            const courseSelect = document.getElementById('filterCourse');
            const uniqueCourses = new Set();
            allStudents.forEach(s => { if(s.courses?.course_name) uniqueCourses.add(s.courses.course_name); });
            uniqueCourses.forEach(course => courseSelect.add(new Option(course, course)));
            
            renderList(allStudents);
        }

        function renderList(data) {
            const container = document.getElementById('studentsList');
            container.innerHTML = '';
            
            if (data.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:20px; color:#ef4444; background:#fff; border-radius:8px;">No students found.</div>';
                return;
            }
            
            data.forEach(s => {
                const tFee = Number(s.total_fee) || 0;
                const aFee = Number(s.admission_fee) || 0;
                const pFees = s.fee_payments ? s.fee_payments.reduce((sum, p) => sum + Number(p.amount_paid), 0) : 0;
                const bal = tFee - aFee - pFees;
                
                // Red color for balance
                const balColor = bal > 0 ? '#EF4444' : '#10B981';
                const balText = bal > 0 ? `₹ ${bal}` : 'Fully Paid';
                const cName = s.courses ? s.courses.course_name : 'N/A';

                // Photo Logic
                let avatarUrl = s.photo_url;
                if (!avatarUrl) {
                    avatarUrl = s.gender === 'Female' ? 'https://avatar.iran.liara.run/public/girl' : 'https://avatar.iran.liara.run/public/boy';
                }

                const card = document.createElement('div');
                card.className = 'student-mobile-card';
                card.innerHTML = `
                    <div class="smc-header">
                        <div class="smc-header-left">
                            <div class="smc-name">${s.full_name}</div>
                            <div class="smc-reg">${s.register_number}</div>
                        </div>
                        <div class="smc-header-center">
                            <img src="${avatarUrl}" class="student-avatar" alt="Photo">
                        </div>
                        <div class="smc-header-right">
                            <div class="smc-status status-active">${(s.status || 'Active').toUpperCase()}</div>
                        </div>
                    </div>
                    <div class="smc-row"><span class="smc-label">Course:</span> <span class="smc-value">${cName}</span></div>
                    <div class="smc-row"><span class="smc-label">Phone:</span> <span class="smc-value">${s.phone_number || 'N/A'}</span></div>
                    <div class="smc-row"><span class="smc-label">Balance Fee:</span> <span class="smc-value" style="color:${balColor}; font-weight:800;">${balText}</span></div>
                    
                    <div class="smc-actions">
                        <button onclick="alert('View details of ${s.full_name}')" class="smc-btn btn-view">View</button>
                        <button onclick="alert('Edit details of ${s.full_name}')" class="smc-btn btn-edit">Edit</button>
                        <button onclick="deleteStudent('${s.id}')" class="smc-btn btn-delete">Delete</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function applyFilters() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const course = document.getElementById('filterCourse').value;
            const fee = document.getElementById('filterFee').value;

            const filtered = allStudents.filter(s => {
                const mSearch = (s.full_name?.toLowerCase().includes(search)) || (s.register_number?.toLowerCase().includes(search)) || (s.phone_number?.toLowerCase().includes(search));
                const mCourse = (course === 'all') || (s.courses?.course_name === course);
                
                let mFee = true;
                if (fee !== 'all') {
                    const bal = (Number(s.total_fee) || 0) - (Number(s.admission_fee) || 0) - (s.fee_payments ? s.fee_payments.reduce((sum, p) => sum + Number(p.amount_paid), 0) : 0);
                    if (fee === 'pending') mFee = (bal > 0);
                    if (fee === 'paid') mFee = (bal <= 0);
                }
                return mSearch && mCourse && mFee;
            });
            renderList(filtered);
        }

        document.getElementById('searchInput').addEventListener('input', applyFilters);
        document.getElementById('filterCourse').addEventListener('change', applyFilters);
        document.getElementById('filterFee').addEventListener('change', applyFilters);

        window.deleteStudent = async function(studentId) {
            if (confirm("Are you sure you want to delete this student?")) {
                await supabase.from('fee_payments').delete().eq('student_id', studentId);
                await supabase.from('students').delete().eq('id', studentId);
                fetchStudents(); 
            }
        };

        document.getElementById('logoutBtn').addEventListener('click', async () => { await supabase.auth.signOut(); window.location.href = 'login.html'; });
        checkAuth();
    </script>
</body>
</html>

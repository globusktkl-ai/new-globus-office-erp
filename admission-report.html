<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admission Analytics - Globus</title>
    <link rel="stylesheet" href="assets/css/style.css">
    
    <!-- Chart.js for Live Graphs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- html2pdf for PDF export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        body { background-color: #f8fafc; padding-bottom: 40px; }
        .main-content { padding: 15px; max-width: 1000px; margin: 0 auto; }
        
        .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        
        /* Premium 3D Back Button */
        .btn-back-dashboard { display: inline-flex; align-items: center; justify-content: center; background: #ffffff; border: 1px solid #cbd5e1; padding: 10px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05), inset 0 -2px 0 rgba(226,232,240,0.8); transition: all 0.2s ease; cursor: pointer; }
        .btn-back-dashboard:active { transform: translateY(1px); box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .btn-back-dashboard svg { width: 22px; height: 22px; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; stroke: #2563eb; }

        .page-title { font-size: 22px; font-weight: 900; color: #0f172a; margin: 0; display: flex; align-items: center; gap: 8px; }
        
        /* Filter Section */
        .filter-card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); border: 1px solid #e2e8f0; margin-bottom: 20px; }
        .filter-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
        .filter-col { flex: 1; min-width: 150px; }
        .filter-label { font-size: 12px; font-weight: 700; color: #64748b; margin-bottom: 4px; display: block; }
        
        .form-select, .form-input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; font-weight: 600; color: #1e293b; background: #f8fafc; outline: none; box-sizing: border-box; }
        .form-select:focus, .form-input:focus { border-color: #3b82f6; }
        
        .btn-primary { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 14px; box-shadow: 0 4px 6px rgba(59, 130, 246, 0.2); }
        .btn-primary:active { transform: scale(0.98); }

        /* Charts Section */
        .charts-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .chart-box { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); border: 1px solid #e2e8f0; }
        .chart-title { font-size: 14px; font-weight: 800; color: #334155; margin-bottom: 15px; text-align: center; border-bottom: 1px dashed #cbd5e1; padding-bottom: 8px; }
        
        /* Table Section */
        .table-card { background: white; padding: 0; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); border: 1px solid #e2e8f0; overflow: hidden; margin-bottom: 20px;}
        .table-header-row { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; }
        .table-title { font-size: 16px; font-weight: 800; color: #0f172a; margin: 0; }
        
        .export-btns { display: flex; gap: 8px; }
        .btn-export { background: white; border: 1px solid #cbd5e1; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 700; color: #475569; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .btn-export.excel { color: #059669; border-color: #a7f3d0; background: #f0fdf4; }
        .btn-export.pdf { color: #dc2626; border-color: #fecaca; background: #fef2f2; }

        .table-responsive { overflow-x: auto; width: 100%; }
        table { width: 100%; border-collapse: collapse; min-width: 700px; }
        th { background: #f1f5f9; padding: 12px 15px; text-align: left; font-size: 13px; font-weight: 800; color: #475569; text-transform: uppercase; }
        td { padding: 12px 15px; border-bottom: 1px solid #f1f5f9; font-size: 14px; color: #1e293b; font-weight: 500; }
        tbody tr:hover { background: #f8fafc; }

        .metric-badge { background: #e0e7ff; color: #1d4ed8; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 800; }

        @media (max-width: 768px) {
            .charts-container { grid-template-columns: 1fr; }
            .export-btns { flex-direction: column; }
            .btn-export { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <main class="main-content">
        <div class="top-nav">
            <a href="dashboard.html" class="btn-back-dashboard" title="Back to Dashboard">
                <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </a>
            <h1 class="page-title">📊 Admission Analytics</h1>
        </div>

        <!-- Smart Filter Section -->
        <div class="filter-card no-print">
            <div class="filter-row">
                <div class="filter-col">
                    <label class="filter-label">Quick Period</label>
                    <select id="quickFilter" class="form-select" onchange="applyQuickFilter()">
                        <option value="all">All Time History</option>
                        <option value="1m">Last 1 Month</option>
                        <option value="2m">Last 2 Months</option>
                        <option value="6m">Last 6 Months</option>
                        <option value="thisYear">This Year</option>
                        <option value="lastYear">Last Year</option>
                        <option value="custom">Custom Date Range...</option>
                    </select>
                </div>
                <div class="filter-col">
                    <label class="filter-label">Course Filter</label>
                    <select id="courseFilter" class="form-select">
                        <option value="all">All Courses</option>
                    </select>
                </div>
            </div>
            
            <div id="customDateRow" class="filter-row" style="display: none; background: #f1f5f9; padding: 10px; border-radius: 8px;">
                <div class="filter-col">
                    <label class="filter-label">From Date</label>
                    <input type="date" id="fromDate" class="form-input">
                </div>
                <div class="filter-col">
                    <label class="filter-label">To Date</label>
                    <input type="date" id="toDate" class="form-input">
                </div>
            </div>

            <button onclick="generateReport()" class="btn-primary">Generate Report & Graphs</button>
        </div>

        <!-- Live Charts Section -->
        <div class="charts-container" id="printable-charts">
            <div class="chart-box">
                <h3 class="chart-title">Admissions by Course (Pie Chart)</h3>
                <div style="position: relative; height:250px; width:100%; display:flex; justify-content:center;">
                    <canvas id="coursePieChart"></canvas>
                </div>
            </div>
            <div class="chart-box">
                <h3 class="chart-title">Monthly Admission Trend (Bar Graph)</h3>
                <div style="position: relative; height:250px; width:100%;">
                    <canvas id="monthBarChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Detailed Data Table -->
        <div class="table-card">
            <div class="table-header-row no-print">
                <h3 class="table-title">Student Details <span id="totalCountBadge" class="metric-badge">0</span></h3>
                <div class="export-btns">
                    <button onclick="exportToExcel()" class="btn-export excel">📥 Download Excel</button>
                    <button onclick="printReport()" class="btn-export pdf">🖨️ Print / Save PDF</button>
                </div>
            </div>
            <div class="table-responsive" id="printable-table">
                <table id="reportTable">
                    <thead>
                        <tr>
                            <th>Adm. Date</th>
                            <th>Reg No</th>
                            <th>Student Name</th>
                            <th>Phone</th>
                            <th>Address</th>
                            <th>Course</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="6" style="text-align: center; color: #94a3b8;">Select filters and click Generate to load data.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script type="module">
        import { supabase } from './assets/js/supabase-config.js';
        
        let allStudents = [];
        let allCourses = [];
        let pieChartInstance = null;
        let barChartInstance = null;

        async function initPage() {
            try {
                const { data: { session } } = await supabase.auth.getSession();
                if (!session) { window.location.href = 'login.html'; return; }

                // Fetch Courses for Dropdown
                const { data: cData } = await supabase.from('courses').select('id, course_name');
                if (cData) {
                    allCourses = cData;
                    const cSelect = document.getElementById('courseFilter');
                    cData.forEach(c => cSelect.add(new Option(c.course_name, c.id)));
                }

                // Fetch All Students once
                const { data: sData } = await supabase.from('students').select('*').order('admission_date', { ascending: false });
                if (sData) {
                    allStudents = sData;
                    // Inject course names into student objects
                    allStudents.forEach(s => {
                        const c = allCourses.find(xc => xc.id == s.course_id);
                        s.course_name_display = c ? c.course_name : (s.course_name || 'N/A');
                    });
                }
                
                // Initial Load
                generateReport();

            } catch(e) { console.error("Error loading data", e); }
        }

        window.applyQuickFilter = function() {
            const val = document.getElementById('quickFilter').value;
            const customRow = document.getElementById('customDateRow');
            const fromInp = document.getElementById('fromDate');
            const toInp = document.getElementById('toDate');
            
            const today = new Date();
            let fromDate = new Date();
            let toDate = new Date();

            if (val === 'custom') {
                customRow.style.display = 'flex';
                return;
            } else {
                customRow.style.display = 'none';
            }

            if (val === 'all') { fromInp.value = ''; toInp.value = ''; return; }
            
            if (val === '1m') { fromDate.setMonth(today.getMonth() - 1); }
            else if (val === '2m') { fromDate.setMonth(today.getMonth() - 2); }
            else if (val === '6m') { fromDate.setMonth(today.getMonth() - 6); }
            else if (val === 'thisYear') { fromDate = new Date(today.getFullYear(), 0, 1); }
            else if (val === 'lastYear') { 
                fromDate = new Date(today.getFullYear() - 1, 0, 1);
                toDate = new Date(today.getFullYear() - 1, 11, 31);
            }

            fromInp.value = fromDate.toISOString().split('T')[0];
            toInp.value = toDate.toISOString().split('T')[0];
        };

        window.generateReport = function() {
            const quickVal = document.getElementById('quickFilter').value;
            const courseVal = document.getElementById('courseFilter').value;
            const fromVal = document.getElementById('fromDate').value;
            const toVal = document.getElementById('toDate').value;

            // 1. Filter Data
            let filtered = allStudents.filter(s => {
                let matchCourse = (courseVal === 'all' || s.course_id == courseVal);
                let matchDate = true;
                
                if (quickVal !== 'all' && s.admission_date) {
                    if (fromVal && s.admission_date < fromVal) matchDate = false;
                    if (toVal && s.admission_date > toVal) matchDate = false;
                }
                return matchCourse && matchDate;
            });

            // 2. Update Table
            document.getElementById('totalCountBadge').innerText = filtered.length;
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #ef4444; font-weight:bold;">No admissions found for this period.</td></tr>';
            } else {
                filtered.forEach(s => {
                    tbody.innerHTML += `
                        <tr>
                            <td style="font-weight:700; color:#3b82f6;">${s.admission_date || '-'}</td>
                            <td style="font-weight:700;">${s.register_number || '-'}</td>
                            <td style="font-weight:800; color:#0f172a;">${s.full_name}</td>
                            <td>${s.phone_number}</td>
                            <td style="font-size:12px; color:#64748b;">${s.address || '-'}</td>
                            <td style="font-weight:700; color:#10b981;">${s.course_name_display}</td>
                        </tr>
                    `;
                });
            }

            // 3. Prepare Data for Charts
            // Pie Chart Data (Count by Course)
            const courseCounts = {};
            filtered.forEach(s => {
                courseCounts[s.course_name_display] = (courseCounts[s.course_name_display] || 0) + 1;
            });
            const pieLabels = Object.keys(courseCounts);
            const pieData = Object.values(courseCounts);

            // Bar Chart Data (Count by Month)
            const monthCounts = {};
            filtered.forEach(s => {
                if (s.admission_date) {
                    const d = new Date(s.admission_date);
                    const monthYear = d.toLocaleString('default', { month: 'short', year: 'numeric' });
                    monthCounts[monthYear] = (monthCounts[monthYear] || 0) + 1;
                }
            });
            
            // Sort months chronologically
            const sortedMonths = Object.keys(monthCounts).sort((a, b) => new Date('01 ' + a) - new Date('01 ' + b));
            const barLabels = sortedMonths;
            const barData = sortedMonths.map(m => monthCounts[m]);

            // 4. Render Charts
            renderPieChart(pieLabels, pieData);
            renderBarChart(barLabels, barData);
        };

        function renderPieChart(labels, data) {
            const ctx = document.getElementById('coursePieChart').getContext('2d');
            if (pieChartInstance) pieChartInstance.destroy();
            
            if(data.length === 0) return;

            pieChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ef4444', '#14b8a6', '#f43f5e'],
                        borderWidth: 2,
                        borderColor: '#ffffff'
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { position: 'right', labels: {font:{size: 11, family:'Arial'}}} }
                }
            });
        }

        function renderBarChart(labels, data) {
            const ctx = document.getElementById('monthBarChart').getContext('2d');
            if (barChartInstance) barChartInstance.destroy();
            
            if(data.length === 0) return;

            barChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Number of Admissions',
                        data: data,
                        backgroundColor: '#8b5cf6',
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } },
                    plugins: { legend: { display: false } }
                }
            });
        }

        window.exportToExcel = function() {
            let csv = [];
            let rows = document.querySelectorAll("#reportTable tr");
            for (let i = 0; i < rows.length; i++) {
                let row = [], cols = rows[i].querySelectorAll("td, th");
                for (let j = 0; j < cols.length; j++) { 
                    // Clean text for CSV to prevent breakages
                    let text = cols[j].innerText.replace(/(\r\n|\n|\r)/gm, " ").replace(/"/g, '""');
                    row.push('"' + text + '"'); 
                }
                csv.push(row.join(","));
            }
            let csvFile = new Blob([csv.join("\n")], {type: "text/csv;charset=utf-8;"});
            let link = document.createElement("a");
            link.download = "Admission_Report.csv";
            link.href = window.URL.createObjectURL(csvFile);
            link.style.display = "none";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        window.printReport = function() {
            window.print();
        };

        document.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>
</html>

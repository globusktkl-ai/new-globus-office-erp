<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admission Analytics - ERP</title>
    <link rel="stylesheet" href="assets/css/style.css">
    
    <!-- Chart.js for Live Graphs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- html2pdf for PDF export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        body { background-color: #f8fafc; padding-bottom: 40px; }
        .main-content { padding: 15px; max-width: 1000px; margin: 0 auto; }
        
        /* Clean Header Fixes for Overlapping */
        .top-nav { display: flex; align-items: center; justify-content: center; position: relative; margin-bottom: 25px; padding: 12px 15px; min-height: 60px; border-bottom: 2px solid #e2e8f0; }
        
        /* Premium 3D Back Button (Icon Only) */
        .btn-back-dashboard { position: absolute; left: 15px; display: inline-flex; align-items: center; justify-content: center; background: #ffffff; border: 1px solid #cbd5e1; padding: 10px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05), inset 0 -2px 0 rgba(226,232,240,0.8); transition: all 0.2s ease; cursor: pointer; flex-shrink: 0; }
        .btn-back-dashboard:active { transform: translateY(1px); box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .btn-back-dashboard svg { width: 22px; height: 22px; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; stroke: #2563eb; }

        .page-title { font-size: 18px; font-weight: 900; color: #0f172a; margin: 0; text-transform: uppercase; letter-spacing: 0.5px; text-align: center; padding: 0 50px; }
        
        /* Filter Section */
        .filter-card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); border: 1px solid #e2e8f0; margin-bottom: 20px; }
        .filter-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
        .filter-col { flex: 1; min-width: 150px; }
        .filter-label { font-size: 12px; font-weight: 800; color: #64748b; margin-bottom: 6px; display: block; text-transform: uppercase;}
        
        .form-select, .form-input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; font-weight: 600; color: #1e293b; background: #f8fafc; outline: none; box-sizing: border-box; }
        .form-select:focus, .form-input:focus { border-color: #3b82f6; background: #fff; }
        
        .btn-primary { background: linear-gradient(135deg, #0ea5e9, #0284c7); color: white; border: none; padding: 14px; border-radius: 8px; font-weight: 800; cursor: pointer; width: 100%; font-size: 15px; box-shadow: 0 4px 6px rgba(2, 132, 199, 0.3); transition: all 0.2s ease; margin-top: 5px;}
        .btn-primary:active { transform: scale(0.98); }

        /* Charts Section (Strict Mobile Optimization & Premium Look) */
        .charts-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        .chart-box { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.01); border: 1px solid #f1f5f9; display: flex; flex-direction: column; overflow: hidden; position: relative;}
        .chart-title { font-size: 14px; font-weight: 900; color: #1e293b; margin-bottom: 20px; text-align: center; text-transform: uppercase; letter-spacing: 0.5px;}
        
        /* Strict wrapper to prevent Chart.js from overflowing on mobile */
        .chart-wrapper { position: relative; width: 100%; height: 280px; margin: 0 auto; }

        /* Table Section */
        .table-card { background: white; padding: 0; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); border: 1px solid #e2e8f0; overflow: hidden; margin-bottom: 20px;}
        .table-header-row { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; flex-wrap: wrap; gap: 10px;}
        .table-title { font-size: 15px; font-weight: 900; color: #0f172a; margin: 0; display: flex; align-items: center; gap: 8px;}
        
        .export-btns { display: flex; gap: 8px; flex-wrap: wrap;}
        .btn-export { background: white; border: 1px solid #cbd5e1; padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 800; color: #475569; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: all 0.2s;}
        .btn-export:active { transform: scale(0.95); }
        .btn-export.excel { color: #059669; border-color: #34d399; background: #ecfdf5; }
        .btn-export.pdf { color: #dc2626; border-color: #fca5a5; background: #fef2f2; }

        .table-responsive { overflow-x: auto; width: 100%; -webkit-overflow-scrolling: touch;}
        table { width: 100%; border-collapse: collapse; min-width: 700px; }
        th { background: #f1f5f9; padding: 12px 15px; text-align: left; font-size: 12px; font-weight: 900; color: #475569; text-transform: uppercase; border-bottom: 2px solid #e2e8f0;}
        td { padding: 12px 15px; border-bottom: 1px solid #f1f5f9; font-size: 13px; color: #1e293b; font-weight: 600; }
        tbody tr:hover { background: #f8fafc; }

        .metric-badge { background: #e0e7ff; color: #1d4ed8; padding: 4px 10px; border-radius: 20px; font-size: 13px; font-weight: 900; }

        /* Media Queries for Mobile Screens */
        @media (max-width: 768px) {
            .page-title { font-size: 16px; padding: 0 40px; } 
            .charts-container { grid-template-columns: 1fr; } /* Stack charts vertically */
            .chart-wrapper { height: 260px; } 
            .export-btns { width: 100%; }
            .btn-export { flex: 1; justify-content: center; padding: 10px;}
        }
        
        @media print {
            body { background: white; }
            .no-print { display: none !important; }
            .table-card { border: none; box-shadow: none; }
            .chart-box { border: none; box-shadow: none; page-break-inside: avoid; }
            table th { background: #eee !important; -webkit-print-color-adjust: exact; }
        }
    </style>
</head>
<body>

    <main class="main-content">
        <!-- Clean Header -->
        <div class="top-nav no-print">
            <a href="dashboard.html" class="btn-back-dashboard" title="Back to Dashboard">
                <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </a>
            <h1 class="page-title">Admission Analytics</h1>
        </div>

        <!-- Smart Filter Section -->
        <div class="filter-card no-print">
            <div class="filter-row">
                <div class="filter-col">
                    <label class="filter-label">Time Period</label>
                    <select id="quickFilter" class="form-select" onchange="applyQuickFilter()">
                        <option value="all">All Time History</option>
                        <option value="1m">Last 1 Month</option>
                        <option value="2m">Last 2 Months</option>
                        <option value="6m">Last 6 Months</option>
                        <option value="thisYear">This Year</option>
                        <option value="lastYear">Last Year</option>
                        <option value="custom">Custom Date Range...</option>
                    </select>
                </div>
                <div class="filter-col">
                    <label class="filter-label">Course Filter</label>
                    <select id="courseFilter" class="form-select">
                        <option value="all">All Courses</option>
                    </select>
                </div>
            </div>
            
            <div id="customDateRow" class="filter-row" style="display: none; background: #f1f5f9; padding: 12px; border-radius: 8px; border: 1px dashed #cbd5e1; margin-top: 15px;">
                <div class="filter-col">
                    <label class="filter-label">From Date</label>
                    <input type="date" id="fromDate" class="form-input">
                </div>
                <div class="filter-col">
                    <label class="filter-label">To Date</label>
                    <input type="date" id="toDate" class="form-input">
                </div>
            </div>

            <button onclick="generateReport()" class="btn-primary">Generate Report & Graphs</button>
        </div>

        <!-- Live Charts Section -->
        <div class="charts-container" id="printable-charts">
            <div class="chart-box">
                <h3 class="chart-title">Admissions by Course</h3>
                <div class="chart-wrapper">
                    <canvas id="coursePieChart"></canvas>
                </div>
            </div>
            <div class="chart-box">
                <h3 class="chart-title">Monthly Admission Trend</h3>
                <div class="chart-wrapper">
                    <canvas id="monthBarChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Detailed Data Table -->
        <div class="table-card">
            <div class="table-header-row no-print">
                <h3 class="table-title">Student Details <span id="totalCountBadge" class="metric-badge">0</span></h3>
                <div class="export-btns">
                    <button onclick="exportToExcel()" class="btn-export excel">
                        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        Export Excel
                    </button>
                    <button onclick="printReport()" class="btn-export pdf">
                        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
                        Print / PDF
                    </button>
                </div>
            </div>
            <div class="table-responsive" id="printable-table">
                <table id="reportTable">
                    <thead>
                        <tr>
                            <th>Adm. Date</th>
                            <th>Reg No</th>
                            <th>Student Name</th>
                            <th>Phone</th>
                            <th>Address</th>
                            <th>Course</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="6" style="text-align: center; padding: 20px; color: #94a3b8; font-weight: bold;">Loading data from database...</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- 🔥 NEW: SAAS WATERMARK FOR REPORT 🔥 -->
            <div class="vpk-watermark" style="text-align: right; padding: 10px 15px; font-size: 11px; color: #64748b; font-weight: 800; font-family: 'Segoe UI', Tahoma, sans-serif; display: none; opacity: 0.7;">
                ⚡ Powered by VPKTech Solutions
            </div>
        </div>
    </main>

    <script type="module">
        import { supabase } from './assets/js/supabase-config.js';

        // ==========================================
        // NEW MAGIC ALERT OVERRIDE FOR ALL WARNINGS AND ERRORS
        // ==========================================
        window.alert = function(msg) {
            const oldBox = document.getElementById('customPromptBox'); 
            if (oldBox) oldBox.remove();
            const box = document.createElement('div'); 
            box.id = 'customPromptBox';
            
            let iconHtml = `<div style="background:#dbeafe; color:#2563eb; width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 15px;"><svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" fill="none"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg></div>`;
            
            if(msg.includes('⚠️') || msg.includes('❌') || msg.includes('Error') || msg.includes('disabled') || msg.includes('failed') || msg.includes('Warning')) {
                iconHtml = `<div style="background:#fee2e2; color:#ef4444; width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 15px;"><svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" fill="none"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg></div>`;
            } else if (msg.includes('✅') || msg.includes('success') || msg.includes('Successfully')) {
                iconHtml = `<div style="background:#d1fae5; color:#10b981; width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 15px;"><svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" fill="none"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg></div>`;
            }

            box.style.cssText = `position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.85); z-index: 100000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px);`;
            box.innerHTML = `
                <div style="background: #ffffff; padding: 24px; border-radius: 16px; width: 90%; max-width: 320px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); text-align: center; animation: sheetUp 0.3s ease;">
                    ${iconHtml}
                    <div style="font-size: 15px; font-weight: 800; color: #0f172a; margin-bottom: 20px; white-space: pre-wrap; line-height: 1.5;">${msg}</div>
                    <button id="cAlertOk" style="width: 100%; padding: 12px; background: #3b82f6; color: #fff; border: none; border-radius: 10px; font-weight: 800; font-size: 14px; cursor: pointer; transition: 0.2s;">OK, Got it</button>
                </div>
            `;
            if(!document.querySelector('style#sheetUpAnim')){ document.head.insertAdjacentHTML('beforeend', '<style id="sheetUpAnim">@keyframes sheetUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}</style>'); }
            document.body.appendChild(box);
            document.getElementById('cAlertOk').onclick = () => box.remove();
        };

        let allStudents = [];
        let allCourses = [];
        let pieChartInstance = null;
        let barChartInstance = null;

        // Custom Gradient Plugin for Bar Chart
        Chart.register({
            id: 'gradientBar',
            beforeDraw: function(chart, args, options) {
                const ctx = chart.ctx;
                const chartArea = chart.chartArea;
                if (!chartArea) return;
                
                chart.data.datasets.forEach((dataset, i) => {
                    const meta = chart.getDatasetMeta(i);
                    if(meta.type === 'bar') {
                        meta.data.forEach((bar, index) => {
                            const gradient = ctx.createLinearGradient(0, bar.y, 0, bar.base);
                            gradient.addColorStop(0, '#3b82f6'); // Light blue top
                            gradient.addColorStop(1, '#1e3a8a'); // Dark blue bottom
                            bar.options.backgroundColor = gradient;
                        });
                    }
                });
            }
        });

        // 🔥 NEW: APPLY SAAS CONTROLS FOR WATERMARK 🔥
        async function applySaaSControls() {
            try {
                const microFeaturesStr = localStorage.getItem('saas_micro_features');
                if (microFeaturesStr) {
                    const microFeatures = JSON.parse(microFeaturesStr);
                    if (microFeatures.remove_watermark === false) {
                        document.querySelectorAll('.vpk-watermark').forEach(el => el.style.display = 'block');
                    } else {
                        document.querySelectorAll('.vpk-watermark').forEach(el => el.style.display = 'none');
                    }
                }
            } catch(e) { console.log("SaaS Control Error:", e); }
        }

        async function initPage() {
            try {
                const userRole = localStorage.getItem('userRole') || 'Admin';
                const { data: { session } } = await supabase.auth.getSession();
                if (!session && userRole !== 'Guest') { window.location.href = 'login.html'; return; }

                await applySaaSControls(); // 🔥 Check SaaS controls

                // Fetch Courses
                const { data: cData } = await supabase.from('courses').select('id, course_name');
                if (cData) {
                    allCourses = cData;
                    const cSelect = document.getElementById('courseFilter');
                    cData.forEach(c => cSelect.add(new Option(c.course_name, c.id)));
                }

                // Fetch Students
                const { data: sData } = await supabase.from('students').select('*').order('admission_date', { ascending: false });
                if (sData) {
                    allStudents = sData;
                    allStudents.forEach(s => {
                        const c = allCourses.find(xc => xc.id == s.course_id);
                        s.course_name_display = c ? c.course_name : (s.course_name || 'N/A');
                    });
                }
                
                window.generateReport();

            } catch(e) { 
                console.error("Error", e); 
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="6" style="text-align: center; color: red;">Error connecting to database. Please check connection.</td></tr>';
            }
        }

        window.applyQuickFilter = function() {
            const val = document.getElementById('quickFilter').value;
            const customRow = document.getElementById('customDateRow');
            const fromInp = document.getElementById('fromDate');
            const toInp = document.getElementById('toDate');
            
            const today = new Date();
            let fromDate = new Date();
            let toDate = new Date();

            if (val === 'custom') {
                customRow.style.display = 'flex';
                return;
            } else {
                customRow.style.display = 'none';
            }

            if (val === 'all') { fromInp.value = ''; toInp.value = ''; return; }
            
            if (val === '1m') { fromDate.setMonth(today.getMonth() - 1); }
            else if (val === '2m') { fromDate.setMonth(today.getMonth() - 2); }
            else if (val === '6m') { fromDate.setMonth(today.getMonth() - 6); }
            else if (val === 'thisYear') { fromDate = new Date(today.getFullYear(), 0, 1); }
            else if (val === 'lastYear') { 
                fromDate = new Date(today.getFullYear() - 1, 0, 1);
                toDate = new Date(today.getFullYear() - 1, 11, 31);
            }

            fromInp.value = fromDate.toISOString().split('T')[0];
            toInp.value = toDate.toISOString().split('T')[0];
        };

        window.generateReport = function() {
            const quickVal = document.getElementById('quickFilter').value;
            const courseVal = document.getElementById('courseFilter').value;
            const fromVal = document.getElementById('fromDate').value;
            const toVal = document.getElementById('toDate').value;

            let filtered = allStudents.filter(s => {
                let matchCourse = (courseVal === 'all' || s.course_id == courseVal);
                let matchDate = true;
                
                if (quickVal !== 'all' && s.admission_date) {
                    if (fromVal && s.admission_date < fromVal) matchDate = false;
                    if (toVal && s.admission_date > toVal) matchDate = false;
                }
                return matchCourse && matchDate;
            });

            document.getElementById('totalCountBadge').innerText = filtered.length;
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #ef4444; font-weight:bold; padding: 20px;">No admissions found for the selected criteria.</td></tr>';
            } else {
                filtered.forEach(s => {
                    tbody.innerHTML += `
                        <tr>
                            <td style="color:#0284c7;">${s.admission_date || '-'}</td>
                            <td>${s.register_number || '-'}</td>
                            <td style="font-weight:800; color:#0f172a;">${s.full_name}</td>
                            <td>${s.phone_number || '-'}</td>
                            <td style="color:#64748b; font-size: 12px; max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="${s.address || ''}">${s.address || '-'}</td>
                            <td style="color:#10b981; font-weight: 800;">${s.course_name_display}</td>
                        </tr>
                    `;
                });
            }

            // --- DATA FOR CHARTS ---
            const courseCounts = {};
            filtered.forEach(s => { courseCounts[s.course_name_display] = (courseCounts[s.course_name_display] || 0) + 1; });
            const pieLabels = Object.keys(courseCounts);
            const pieData = Object.values(courseCounts);

            const monthCounts = {};
            filtered.forEach(s => {
                if (s.admission_date) {
                    const d = new Date(s.admission_date);
                    const monthYear = d.toLocaleString('default', { month: 'short', year: 'numeric' });
                    monthCounts[monthYear] = (monthCounts[monthYear] || 0) + 1;
                }
            });
            const sortedMonths = Object.keys(monthCounts).sort((a, b) => new Date('01 ' + a) - new Date('01 ' + b));
            const barData = sortedMonths.map(m => monthCounts[m]);

            rendERPieChart(pieLabels, pieData);
            renderBarChart(sortedMonths, barData);
        };

        function rendERPieChart(labels, data) {
            const ctx = document.getElementById('coursePieChart').getContext('2d');
            if (pieChartInstance) pieChartInstance.destroy();
            
            if(data.length === 0) return;

            const isMobile = window.innerWidth <= 768;

            pieChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ef4444', '#14b8a6', '#f43f5e'],
                        borderWidth: 3, 
                        borderColor: '#ffffff',
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true, 
                    maintainAspectRatio: false,
                    cutout: '65%', // Thinner ring for premium look
                    layout: { padding: isMobile ? 5 : 15 },
                    plugins: { 
                        legend: { 
                            position: isMobile ? 'bottom' : 'right',
                            labels: {
                                boxWidth: 15,
                                usePointStyle: true,
                                padding: 15,
                                font: { size: 11, family: "'Segoe UI', sans-serif", weight: 'bold' },
                                color: '#475569'
                            } 
                        },
                        tooltip: {
                            backgroundColor: 'rgba(15, 23, 42, 0.9)',
                            titleFont: { size: 13, family: "'Segoe UI', sans-serif" },
                            bodyFont: { size: 14, weight: 'bold' },
                            padding: 10,
                            cornerRadius: 8,
                            displayColors: false
                        }
                    }
                }
            });
        }

        function renderBarChart(labels, data) {
            const ctx = document.getElementById('monthBarChart').getContext('2d');
            if (barChartInstance) barChartInstance.destroy();
            
            if(data.length === 0) return;

            barChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Admissions',
                        data: data,
                        // Background is handled by gradient plugin
                        borderRadius: { topLeft: 6, topRight: 6 },
                        barPercentage: 0.6,
                        categoryPercentage: 0.8
                    }]
                },
                options: {
                    responsive: true, 
                    maintainAspectRatio: false,
                    scales: { 
                        y: { 
                            beginAtZero: true, 
                            ticks: { stepSize: 1, font: { size: 11, weight: 'bold'}, color: '#94a3b8' },
                            grid: { color: '#f1f5f9', drawBorder: false }
                        },
                        x: {
                            ticks: { font: { size: 11, weight: 'bold'}, color: '#64748b' },
                            grid: { display: false, drawBorder: false }
                        }
                    },
                    plugins: { 
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(30, 58, 138, 0.9)',
                            titleFont: { size: 12 },
                            bodyFont: { size: 14, weight: 'bold' },
                            padding: 10,
                            cornerRadius: 8,
                            displayColors: false,
                            callbacks: {
                                label: function(context) {
                                    return context.parsed.y + ' Students';
                                }
                            }
                        }
                    },
                    interaction: { mode: 'index', intersect: false }
                }
            });
        }

        // Handle resize dynamically
        window.addEventListener('resize', function() {
            if(pieChartInstance || barChartInstance) {
                clearTimeout(window.resizeTimer);
                window.resizeTimer = setTimeout(window.generateReport, 250);
            }
        });

        window.exportToExcel = function() {
            let csv = [];
            let rows = document.querySelectorAll("#reportTable tr");
            for (let i = 0; i < rows.length; i++) {
                let row = [], cols = rows[i].querySelectorAll("td, th");
                for (let j = 0; j < cols.length; j++) { 
                    let text = cols[j].innerText.replace(/(\r\n|\n|\r)/gm, " ").replace(/"/g, '""');
                    row.push('"' + text + '"'); 
                }
                csv.push(row.join(","));
            }
            let csvFile = new Blob([csv.join("\n")], {type: "text/csv;charset=utf-8;"});
            let link = document.createElement("a");
            link.download = "ERP_Admissions_Report.csv";
            link.href = window.URL.createObjectURL(csvFile);
            link.style.display = "none";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        window.printReport = function() {
            window.print();
        };

        document.addEventListener('DOMContentLoaded', initPage);
    </script>
    
    <!-- THE NEW DYNAMIC SECURITY SYSTEM -->
    <script type="module">
        import './assets/js/auth-check.js';
        window.checkDynamicAccess('AdmReport');
    </script>
</body>

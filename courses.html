<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Courses Management - ERP Technical Academy</title>
    <link rel="stylesheet" href="assets/css/style.css">
    
    <style>
        /* DISABLE SCROLLING ON NUMBER INPUTS */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        /* Premium 3D Back to Dashboard Button */
        .btn-back-dashboard { display: inline-flex; align-items: center; gap: 8px; background: #ffffff; border: 1px solid #cbd5e1; padding: 8px 16px; border-radius: 10px; color: #1e293b; font-weight: 800; font-size: 14px; text-decoration: none; box-shadow: 0 4px 6px rgba(0,0,0,0.05), inset 0 -2px 0 rgba(226,232,240,0.8); transition: all 0.2s ease; cursor: pointer; }
        .btn-back-dashboard:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.08), inset 0 -2px 0 rgba(226,232,240,0.8); border-color: #94a3b8; }
        .btn-back-dashboard:active { transform: translateY(1px); box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .btn-back-dashboard svg { width: 22px; height: 22px; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; filter: drop-shadow(0px 2px 2px rgba(37,99,235,0.3)); }

        @media (max-width: 600px) {
            .btn-back-dashboard span { display: none; } /* Hide text on small screens */
        }

        /* Save Course Button (Light Blue Professional) */
        .btn-save-course { background: linear-gradient(135deg, #3b82f6, #2563eb); color: #ffffff; border: none; padding: 14px 20px; border-radius: 8px; font-size: 16px; font-weight: bold; width: 100%; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 6px rgba(59, 130, 246, 0.3); margin-top: 10px; }
        .btn-save-course:hover { background: linear-gradient(135deg, #2563eb, #1d4ed8); transform: translateY(-2px); box-shadow: 0 6px 12px rgba(59, 130, 246, 0.4); }
        .btn-save-course:active { transform: scale(0.98); box-shadow: 0 2px 4px rgba(59, 130, 246, 0.2); }
        .btn-save-course:disabled { background: #94a3b8; cursor: not-allowed; transform: none; box-shadow: none; }

        /* Status Dropdown Colors */
        select.status-select { font-weight: bold; }
        select.status-select option[value="Active"] { background-color: #dcfce7; color: #166534; }
        select.status-select option[value="Inactive"] { background-color: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
    
    <nav class="app-header" style="position: relative; display: flex; align-items: center; justify-content: center; padding: 12px 15px; min-height: 60px;">
        <a href="dashboard.html" class="btn-back-dashboard" style="position: absolute; left: 15px; padding: 8px 12px;">
            <svg viewBox="0 0 24 24" style="stroke:url(#grad-return);">
                <defs>
                    <linearGradient id="grad-return" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#2563eb" />
                        <stop offset="100%" stop-color="#9333ea" />
                    </linearGradient>
                </defs>
                <path d="M9 14L4 9l5-5" />
                <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11" />
            </svg>
        </a>
        <h1 style="font-size: 16px; font-weight: 900; color: #1e3a8a; text-transform: uppercase; margin: 0; letter-spacing: 0.5px;">COURSES</h1>
    </nav>

    <main class="main-content">
        <!-- 1. നിലവിലുള്ള കോഴ്‌സുകളുടെ ലിസ്റ്റ് (MOVED TO TOP) -->
        <div class="form-card" style="margin-bottom: 25px;">
            <h2 style="font-size: 18px; margin-bottom: 15px; color: var(--primary-dark);">Available Courses</h2>
            <div id="coursesList"><div style="text-align:center; padding:15px; color:#6B7280;">Loading courses...</div></div>
        </div>

        <!-- 2. പുതിയ കോഴ്‌സ് ചേർക്കാനുള്ള ഫോം (MOVED TO BOTTOM) -->
        <div class="form-card" style="margin-bottom: 25px;">
            <h2 style="font-size: 18px; margin-bottom: 15px; color: var(--primary-dark);">Add New Course</h2>
            <form id="courseForm">
                <div class="form-group">
                    <label class="form-label">Course Name</label>
                    <input type="text" id="courseName" class="form-control" required placeholder="Enter course name">
                </div>
                
                <div class="form-group">
                    <label class="form-label">Course Modules</label>
                    <div id="moduleInputsContainer">
                        <div class="module-input-row" style="display:flex; gap:10px; margin-bottom:10px;">
                            <input type="text" class="form-control add-module-input" placeholder="e.g. Basic Electronics" required>
                            <button type="button" onclick="addModuleInput('moduleInputsContainer', 'add-module-input')" style="background:#10B981; color:#fff; border:none; padding:0 15px; border-radius:6px; font-weight:bold; cursor:pointer; font-size:18px;">+</button>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Duration (e.g., 3 Months, 6 Months)</label>
                    <input type="text" id="courseDuration" class="form-control" required placeholder="Enter duration">
                </div>
                <div class="form-group">
                    <label class="form-label">Course Fee (₹)</label>
                    <input type="number" id="courseFee" class="form-control" required min="0" placeholder="Enter total fee">
                </div>
                <div class="form-group">
                    <label class="form-label">Capacity (Max Students)</label>
                    <input type="number" id="courseCapacity" class="form-control" required min="1" placeholder="Enter capacity">
                </div>
                <div class="form-group">
                    <label class="form-label">Status</label>
                    <select id="courseStatus" class="form-control status-select" required onchange="updateSelectColor(this)">
                        <option value="Active" style="background-color: #dcfce7; color: #166534;" selected>Active</option>
                        <option value="Inactive" style="background-color: #fee2e2; color: #991b1b;">Inactive</option>
                    </select>
                </div>
                <button type="submit" class="btn-save-course" id="saveCourseBtn">Save Course</button>
            </form>
        </div>

        <div style="display: flex; justify-content: center; margin-top: 25px; margin-bottom: 25px;">
            <!-- 3D RETURN TO DASHBOARD BUTTON (FOOTER) -->
            <a href="dashboard.html" class="btn-back-dashboard">
                <svg viewBox="0 0 24 24" style="stroke:url(#grad-return-footer);">
                    <defs>
                        <linearGradient id="grad-return-footer" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#2563eb" />
                            <stop offset="100%" stop-color="#9333ea" />
                        </linearGradient>
                    </defs>
                    <path d="M9 14L4 9l5-5" />
                    <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11" />
                </svg>
                <span>Dashboard</span>
            </a>
        </div>
    </main>

    <!-- Course Details / Edit Modal Popup -->
    <div id="courseModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:100; justify-content:center; align-items:flex-start; padding:30px 15px; overflow-y:auto; backdrop-filter: blur(4px);">
        <div style="background:#fff; width:100%; max-width:500px; border-radius:12px; padding:20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); margin: auto;">
            <h3 id="modalTitle" style="margin-bottom:15px; font-size:18px; color:var(--primary-dark);">Course Details</h3>
            <div id="modalContent"></div>
            <div style="margin-top:20px; text-align:right;">
                <button type="button" onclick="closeModal()" style="padding:8px 16px; background:#6B7280; color:#fff; border:none; border-radius:6px; font-weight:600; cursor:pointer;">Close</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase } from './assets/js/supabase-config.js';

        // ==========================================
        // NEW MAGIC ALERT OVERRIDE FOR ALL WARNINGS AND ERRORS
        // ==========================================
        window.alert = function(msg) {
            const oldBox = document.getElementById('customPromptBox'); 
            if (oldBox) oldBox.remove();
            const box = document.createElement('div'); 
            box.id = 'customPromptBox';
            
            let iconHtml = `<div style="background:#dbeafe; color:#2563eb; width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 15px;"><svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" fill="none"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg></div>`;
            
            if(msg.includes('⚠️') || msg.includes('❌') || msg.includes('Error') || msg.includes('disabled') || msg.includes('failed') || msg.includes('cancelled') || msg.includes('does not match')) {
                iconHtml = `<div style="background:#fee2e2; color:#ef4444; width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 15px;"><svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" fill="none"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg></div>`;
            } else if (msg.includes('✅') || msg.includes('success') || msg.includes('successfully') || msg.includes('added')) {
                iconHtml = `<div style="background:#d1fae5; color:#10b981; width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 15px;"><svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" fill="none"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg></div>`;
            }

            box.style.cssText = `position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.85); z-index: 100000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px);`;
            box.innerHTML = `
                <div style="background: #ffffff; padding: 24px; border-radius: 16px; width: 90%; max-width: 320px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); text-align: center; animation: sheetUp 0.3s ease;">
                    ${iconHtml}
                    <div style="font-size: 15px; font-weight: 800; color: #0f172a; margin-bottom: 20px; white-space: pre-wrap; line-height: 1.5;">${msg}</div>
                    <button id="cAlertOk" style="width: 100%; padding: 12px; background: #3b82f6; color: #fff; border: none; border-radius: 10px; font-weight: 800; font-size: 14px; cursor: pointer; transition: 0.2s;">OK, Got it</button>
                </div>
            `;
            if(!document.querySelector('style#sheetUpAnim')){ document.head.insertAdjacentHTML('beforeend', '<style id="sheetUpAnim">@keyframes sheetUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}</style>'); }
            document.body.appendChild(box);
            document.getElementById('cAlertOk').onclick = () => box.remove();
        };

        // ==========================================
        // NEW MAGIC PROMPT FOR VERIFICATIONS (Math / Text)
        // ==========================================
        window.magicPrompt = function(msg, isText = false) {
            return new Promise((resolve) => {
                const oldBox = document.getElementById('customPromptBox');
                if (oldBox) oldBox.remove();
                
                const box = document.createElement('div');
                box.id = 'customPromptBox';
                box.style.cssText = `position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.85); z-index: 100000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px);`;
                
                let inputType = isText ? "text" : "number";
                let btnColor = isText ? "#dc2626" : "#3b82f6";
                let btnText = isText ? "Delete" : "Verify";
                let iconHtml = isText ? `<div style="background:#fee2e2; color:#dc2626; width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 15px;"><svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" fill="none"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></div>` : ``;

                box.innerHTML = `
                    <div style="background: #ffffff; padding: 24px; border-radius: 16px; width: 90%; max-width: 320px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); text-align: center; animation: sheetUp 0.3s ease;">
                        ${iconHtml}
                        <div style="font-size: 15px; font-weight: 800; color: #0f172a; margin-bottom: 16px; white-space: pre-wrap; line-height: 1.5;">${msg}</div>
                        <input type="${inputType}" id="cPromptInput" style="width: 100%; padding: 12px; border: 2px solid #cbd5e1; border-radius: 10px; font-size: ${isText ? '16px' : '20px'}; font-weight: 900; text-align: center; margin-bottom: 20px; outline: none; color: #1e293b;" autocomplete="off">
                        <div style="display: flex; gap: 12px;">
                            <button id="cPromptCancel" style="flex: 1; padding: 12px; background: #f1f5f9; color: #475569; border: none; border-radius: 10px; font-weight: 800; font-size: 14px; cursor: pointer;">Cancel</button>
                            <button id="cPromptOk" style="flex: 1; padding: 12px; background: ${btnColor}; color: #fff; border: none; border-radius: 10px; font-weight: 800; font-size: 14px; cursor: pointer;">${btnText}</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(box);
                
                const input = document.getElementById('cPromptInput');
                input.focus();
                
                document.getElementById('cPromptCancel').onclick = () => { box.remove(); resolve(null); };
                document.getElementById('cPromptOk').onclick = () => { box.remove(); resolve(input.value); };
                input.addEventListener('keypress', (e) => { if (e.key === 'Enter') document.getElementById('cPromptOk').click(); });
            });
        };

        let allCourses = [];

        // PREVENT SCROLL WHEEL ON NUMBER INPUTS (Global Listener)
        document.addEventListener('wheel', function(event) {
            if (document.activeElement.type === 'number') { document.activeElement.blur(); }
        });

        // Function to update the background color of the select element based on chosen option
        window.updateSelectColor = function(selectElement) {
            if (selectElement.value === 'Active') {
                selectElement.style.backgroundColor = '#dcfce7';
                selectElement.style.color = '#166534';
            } else {
                selectElement.style.backgroundColor = '#fee2e2';
                selectElement.style.color = '#991b1b';
            }
        };

        // Initialize status color on load
        document.addEventListener('DOMContentLoaded', () => {
            const statusSelect = document.getElementById('courseStatus');
            if(statusSelect) updateSelectColor(statusSelect);
        });

        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return; }
            fetchCourses();
        }

        async function fetchCourses() {
            const { data, error } = await supabase.from('courses').select('*').order('created_at', { ascending: false });
            if (error) {
                console.error("Error fetching courses:", error);
                return;
            }
            allCourses = data || [];
            renderCourses(allCourses);
        }

        function renderCourses(courses) {
            const container = document.getElementById('coursesList');
            container.innerHTML = '';

            if (courses.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:15px; color:#ef4444; font-weight:bold;">No courses found.</div>';
                return;
            }

            courses.forEach(c => {
                const mods = Array.isArray(c.modules) ? c.modules.length : 0;
                
                const card = document.createElement('div');
                card.style.cssText = "background: #F9FAFB; border: 1px solid #E5E7EB; border-radius: 8px; padding: 12px; margin-bottom: 10px;";
                card.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <div>
                            <strong style="font-size: 15px; color: #111827;">${c.course_name}</strong>
                            <div style="font-size: 13px; color: #4B5563; margin-top: 2px;">Duration: ${c.duration || 'N/A'} | Modules: ${mods} | Fee: ₹ ${c.total_fee || 0}</div>
                            <div style="font-size: 12px; color: #6B7280; margin-top: 2px;">Capacity: ${c.capacity || 'N/A'} | Status: <span style="font-weight:600; color:${c.status === 'Active' ? '#10B981' : '#EF4444'};">${c.status || 'Active'}</span></div>
                        </div>
                    </div>
                    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px;">
                        <button onclick="viewCourse('${c.id}')" style="background: #3B82F6; color: #fff; border: none; padding: 6px; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 12px;">View</button>
                        <button onclick="editCourse('${c.id}')" style="background: #F59E0B; color: #fff; border: none; padding: 6px; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 12px;">Edit</button>
                        <button onclick="deleteCourse('${c.id}', '${c.course_name}')" style="background: #EF4444; color: #fff; border: none; padding: 6px; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 12px;">Delete</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.addModuleInput = function(containerId, inputClass) {
            const container = document.getElementById(containerId);
            const row = document.createElement('div');
            row.className = 'module-input-row';
            row.style.cssText = 'display:flex; gap:10px; margin-bottom:10px;';
            row.innerHTML = `
                <input type="text" class="form-control ${inputClass}" placeholder="Enter module name" required>
                <button type="button" onclick="this.parentElement.remove()" style="background:#EF4444; color:#fff; border:none; padding:0 15px; border-radius:6px; font-weight:bold; cursor:pointer; font-size:16px;">X</button>
            `;
            container.appendChild(row);
        };

        document.getElementById('courseForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (localStorage.getItem('userRole') === 'Guest') { alert("⚠️ This action is disabled in Guest/Demo mode. You cannot add new courses."); return; }

            const name = document.getElementById('courseName').value.trim();
            const duration = document.getElementById('courseDuration').value.trim();
            const fee = Number(document.getElementById('courseFee').value);
            const capacity = Number(document.getElementById('courseCapacity').value);
            const status = document.getElementById('courseStatus').value;

            const moduleInputs = document.querySelectorAll('.add-module-input');
            const modulesArray = Array.from(moduleInputs).map(inp => inp.value.trim()).filter(val => val !== '');

            const btn = document.getElementById('saveCourseBtn');
            btn.textContent = 'Saving...'; btn.disabled = true;

            const { error } = await supabase.from('courses').insert([{
                course_name: name,
                modules: modulesArray,
                duration: duration,
                total_fee: fee,
                capacity: capacity,
                status: status
            }]);

            if (error) {
                alert('❌ Error: ' + error.message);
            } else {
                alert('✅ Course added successfully!');
                document.getElementById('courseForm').reset();
                updateSelectColor(document.getElementById('courseStatus')); // Reset color
                
                document.getElementById('moduleInputsContainer').innerHTML = `
                    <div class="module-input-row" style="display:flex; gap:10px; margin-bottom:10px;">
                        <input type="text" class="form-control add-module-input" placeholder="e.g. Basic Electronics" required>
                        <button type="button" onclick="addModuleInput('moduleInputsContainer', 'add-module-input')" style="background:#10B981; color:#fff; border:none; padding:0 15px; border-radius:6px; font-weight:bold; cursor:pointer; font-size:18px;">+</button>
                    </div>
                `;
                fetchCourses();
            }
            btn.textContent = 'Save Course'; btn.disabled = false;
        });

        window.viewCourse = function(id) {
            const c = allCourses.find(x => x.id === id);
            if (!c) return;
            
            let modulesHtml = '<li>No modules added</li>';
            if (Array.isArray(c.modules) && c.modules.length > 0) {
                modulesHtml = c.modules.map(m => `<li style="margin-bottom:4px;">${m}</li>`).join('');
            }

            document.getElementById('modalTitle').textContent = "Course Details";
            document.getElementById('modalContent').innerHTML = `
                <div style="background:#f8fafc; padding:15px; border-radius:8px; font-size:14px; line-height:1.6;">
                    <p><b>Course Name:</b> <span style="color:#1e40af; font-weight:700;">${c.course_name}</span></p>
                    <p><b>Duration:</b> ${c.duration || 'N/A'}</p>
                    <p><b>Total Fee:</b> ₹ ${c.total_fee || 0}</p>
                    <p><b>Capacity:</b> ${c.capacity || 'N/A'}</p>
                    <p><b>Status:</b> ${c.status || 'Active'}</p>
                    <hr style="border:0; border-top:1px solid #e2e8f0; margin:12px 0;">
                    <p><b>Modules Covered:</b></p>
                    <ul style="padding-left:20px; color:#374151;">${modulesHtml}</ul>
                </div>
            `;
            document.getElementById('courseModal').style.display = 'flex';
        };

        window.editCourse = function(id) {
            const c = allCourses.find(x => x.id === id);
            if (!c) return;

            const mods = Array.isArray(c.modules) ? c.modules : [];
            if(mods.length === 0) mods.push(''); 

            let editModulesHtml = '';
            mods.forEach((mod, index) => {
                const btn = index === 0 
                    ? `<button type="button" onclick="addModuleInput('editModuleInputsContainer', 'edit-module-input')" style="background:#10B981; color:#fff; border:none; padding:0 15px; border-radius:6px; font-weight:bold; cursor:pointer; font-size:18px;">+</button>`
                    : `<button type="button" onclick="this.parentElement.remove()" style="background:#EF4444; color:#fff; border:none; padding:0 15px; border-radius:6px; font-weight:bold; cursor:pointer; font-size:16px;">X</button>`;
                
                editModulesHtml += `
                    <div class="module-input-row" style="display:flex; gap:10px; margin-bottom:10px;">
                        <input type="text" class="form-control edit-module-input" value="${mod}" placeholder="Module Name" required>
                        ${btn}
                    </div>
                `;
            });

            const statusBg = c.status === 'Active' ? '#dcfce7' : '#fee2e2';
            const statusCol = c.status === 'Active' ? '#166534' : '#991b1b';

            document.getElementById('modalTitle').textContent = "Edit Course";
            document.getElementById('modalContent').innerHTML = `
                <form id="editCourseForm" onsubmit="saveCourseEdit(event, '${c.id}')">
                    <div style="margin-bottom:12px;">
                        <label style="font-size:13px; font-weight:600;">Course Name</label>
                        <input type="text" id="editCourseName" value="${c.course_name}" class="form-control" required>
                    </div>
                    
                    <div style="margin-bottom:12px; background:#f8fafc; padding:10px; border-radius:8px; border:1px solid #e2e8f0;">
                        <label style="font-size:13px; font-weight:600; display:block; margin-bottom:8px;">Edit Modules</label>
                        <div id="editModuleInputsContainer">
                            ${editModulesHtml}
                        </div>
                    </div>

                    <div style="margin-bottom:12px;">
                        <label style="font-size:13px; font-weight:600;">Duration</label>
                        <input type="text" id="editCourseDuration" value="${c.duration || ''}" class="form-control" required>
                    </div>
                    <div style="margin-bottom:12px;">
                        <label style="font-size:13px; font-weight:600;">Course Fee (₹)</label>
                        <input type="number" id="editCourseFee" value="${c.total_fee || 0}" class="form-control" required min="0">
                    </div>
                    <div style="margin-bottom:12px;">
                        <label style="font-size:13px; font-weight:600;">Capacity</label>
                        <input type="number" id="editCourseCapacity" value="${c.capacity || 1}" class="form-control" required min="1">
                    </div>
                    <div style="margin-bottom:15px;">
                        <label style="font-size:13px; font-weight:600;">Status</label>
                        <select id="editCourseStatus" class="form-control status-select" required onchange="updateSelectColor(this)" style="background-color: ${statusBg}; color: ${statusCol};">
                            <option value="Active" style="background-color: #dcfce7; color: #166534;" ${c.status === 'Active' ? 'selected' : ''}>Active</option>
                            <option value="Inactive" style="background-color: #fee2e2; color: #991b1b;" ${c.status === 'Inactive' ? 'selected' : ''}>Inactive</option>
                        </select>
                    </div>
                    <button type="submit" style="width:100%; background:#10B981; color:#fff; border:none; padding:12px; border-radius:6px; font-weight:700; cursor:pointer;">Update Course</button>
                </form>
            `;
            document.getElementById('courseModal').style.display = 'flex';
        };

        window.saveCourseEdit = async function(e, id) {
            e.preventDefault();
            if (localStorage.getItem('userRole') === 'Guest') { alert("⚠️ This action is disabled in Guest/Demo mode."); return; }
            
            // MATH CAPTCHA SECURITY
            let n1 = Math.floor(Math.random() * 10) + 1;
            let n2 = Math.floor(Math.random() * 10) + 1;
            let ans = await window.magicPrompt(`🔒 Security Verification \nTo update course details, please solve:\n\n${n1} + ${n2} = ?`);
            
            if (ans === null) {
                return;
            } else if (parseInt(ans) !== (n1 + n2)) {
                alert('❌ Incorrect answer! Update aborted.');
                return;
            }

            const name = document.getElementById('editCourseName').value.trim();
            const duration = document.getElementById('editCourseDuration').value.trim();
            const fee = Number(document.getElementById('editCourseFee').value);
            const capacity = Number(document.getElementById('editCourseCapacity').value);
            const status = document.getElementById('editCourseStatus').value;

            const editModuleInputs = document.querySelectorAll('.edit-module-input');
            const modulesArray = Array.from(editModuleInputs).map(inp => inp.value.trim()).filter(val => val !== '');

            const { error } = await supabase.from('courses').update({
                course_name: name,
                modules: modulesArray,
                duration: duration,
                total_fee: fee,
                capacity: capacity,
                status: status
            }).eq('id', id);

            if (error) {
                alert('❌ Error updating: ' + error.message);
            } else {
                alert('✅ Course updated successfully!');
                closeModal();
                fetchCourses();
            }
        };

        window.deleteCourse = async function(id, courseName) {
            if (localStorage.getItem('userRole') === 'Guest') { alert("⚠️ This action is disabled in Guest/Demo mode."); return; }
            
            let confirmName = await window.magicPrompt(`⚠️ Are you sure you want to delete this course?\n\nType the course name exactly as shown below to confirm:\n\n"${courseName}"`, true);
            
            if (confirmName !== null && confirmName.trim() === courseName) {
                const { error } = await supabase.from('courses').delete().eq('id', id);
                if (error) {
                    alert('❌ Error deleting course (It might be linked to students): ' + error.message);
                } else {
                    alert('✅ Course deleted successfully!');
                    fetchCourses();
                }
            } else if (confirmName !== null) {
                alert('❌ Course name does not match. Deletion cancelled.');
            }
        };

        window.closeModal = function() {
            document.getElementById('courseModal').style.display = 'none';
        };

        checkAuth();
    </script>

    <!-- THE NEW DYNAMIC SECURITY SYSTEM -->
    <script type="module">
        import './assets/js/auth-check.js';
        window.checkDynamicAccess('Courses');
    </script>
</body>
</html>

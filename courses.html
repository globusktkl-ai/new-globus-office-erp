<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Courses Management - Globus Technical Academy</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    
    <nav class="app-header">
        <div class="header-left" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px;">
            <img src="assets/images/logo.png" class="logo-small" alt="Logo" onerror="this.style.display='none'">
            <div style="display: flex; flex-direction: column; overflow: hidden;">
                <span class="brand-top" style="font-size: 16px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Globus</span>
                <span class="brand-bottom" style="text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Technical Academy</span>
            </div>
        </div>
        
        <div class="header-right" style="flex-shrink: 0; margin-left: 10px;">
            <button class="btn-logout-custom" id="logoutBtn">Logout</button>
        </div>
    </nav>

    <main class="main-content">
        <div style="text-align: center; margin-bottom: 20px;">
            <a href="dashboard.html" style="color: var(--primary-light); text-decoration: none; font-weight: 600;">← Return to Dashboard</a>
        </div>

        <!-- പുതിയ കോഴ്‌സ് ചേർക്കാനുള്ള ഫോം -->
        <div class="form-card" style="margin-bottom: 25px;">
            <h2 style="font-size: 18px; margin-bottom: 15px; color: var(--primary-dark);">Add New Course</h2>
            <form id="courseForm">
                <div class="form-group">
                    <label class="form-label">Course Name</label>
                    <input type="text" id="courseName" class="form-control" required placeholder="Enter course name">
                </div>
                <div class="form-group">
                    <label class="form-label">Duration (e.g., 3 Months, 6 Months)</label>
                    <input type="text" id="courseDuration" class="form-control" required placeholder="Enter duration">
                </div>
                <div class="form-group">
                    <label class="form-label">Course Fee (₹)</label>
                    <input type="number" id="courseFee" class="form-control" required min="0" placeholder="Enter total fee">
                </div>
                <button type="submit" class="btn btn-primary" id="saveCourseBtn">Save Course</button>
            </form>
        </div>

        <!-- നിലവിലുള്ള കോഴ്‌സുകളുടെ ലിസ്റ്റ് -->
        <div class="form-card">
            <h2 style="font-size: 18px; margin-bottom: 15px; color: var(--primary-dark);">Available Courses</h2>
            <div id="coursesList"><div style="text-align:center; padding:15px; color:#6B7280;">Loading courses...</div></div>
        </div>
    </main>

    <!-- Course Details / Edit Modal Popup -->
    <div id="courseModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:100; justify-content:center; align-items:center; padding:15px;">
        <div style="background:#fff; width:100%; max-width:450px; border-radius:12px; padding:20px; max-height:90vh; overflow-y:auto;">
            <h3 id="modalTitle" style="margin-bottom:15px; font-size:18px; color:var(--primary-dark);">Course Details</h3>
            <div id="modalContent"></div>
            <div style="margin-top:20px; text-align:right;">
                <button type="button" onclick="closeModal()" style="padding:8px 16px; background:#6B7280; color:#fff; border:none; border-radius:6px; cursor:pointer;">Close</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase } from './assets/js/supabase-config.js';
        let allCourses = [];

        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return; }
            fetchCourses();
        }

        async function fetchCourses() {
            const { data, error } = await supabase.from('courses').select('*').order('created_at', { ascending: false });
            if (error) {
                console.error("Error fetching courses:", error);
                return;
            }
            allCourses = data || [];
            renderCourses(allCourses);
        }

        function renderCourses(courses) {
            const container = document.getElementById('coursesList');
            container.innerHTML = '';

            if (courses.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:15px; color:#ef4444;">No courses found.</div>';
                return;
            }

            courses.forEach(c => {
                const card = document.createElement('div');
                card.style.cssText = "background: #F9FAFB; border: 1px solid #E5E7EB; border-radius: 8px; padding: 12px; margin-bottom: 10px;";
                card.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <div>
                            <strong style="font-size: 15px; color: #111827;">${c.course_name}</strong>
                            <div style="font-size: 13px; color: #4B5563; margin-top: 2px;">Duration: ${c.duration || 'N/A'} | Fee: ₹ ${c.total_fee || 0}</div>
                        </div>
                    </div>
                    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px;">
                        <button onclick="viewCourse('${c.id}')" style="background: #3B82F6; color: #fff; border: none; padding: 6px; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 12px;">View</button>
                        <button onclick="editCourse('${c.id}')" style="background: #F59E0B; color: #fff; border: none; padding: 6px; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 12px;">Edit</button>
                        <button onclick="deleteCourse('${c.id}', '${c.course_name}')" style="background: #EF4444; color: #fff; border: none; padding: 6px; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 12px;">Delete</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // പുതിയ കോഴ്‌സ് സേവ് ചെയ്യാൻ
        document.getElementById('courseForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('courseName').value.trim();
            const duration = document.getElementById('courseDuration').value.trim();
            const fee = Number(document.getElementById('courseFee').value);

            const btn = document.getElementById('saveCourseBtn');
            btn.textContent = 'Saving...'; btn.disabled = true;

            const { error } = await supabase.from('courses').insert([{
                course_name: name,
                duration: duration,
                total_fee: fee
            }]);

            if (error) {
                alert('Error: ' + error.message);
            } else {
                alert('Course added successfully!');
                document.getElementById('courseForm').reset();
                fetchCourses();
            }
            btn.textContent = 'Save Course'; btn.disabled = false;
        });

        // കോഴ്‌സ് വിവരങ്ങൾ കാണാൻ (View)
        window.viewCourse = function(id) {
            const c = allCourses.find(x => x.id === id);
            if (!c) return;
            document.getElementById('modalTitle').textContent = "Course Details";
            document.getElementById('modalContent').innerHTML = `
                <p><b>Course Name:</b> ${c.course_name}</p>
                <p><b>Duration:</b> ${c.duration || 'N/A'}</p>
                <p><b>Total Fee:</b> ₹ ${c.total_fee || 0}</p>
                <p><b>Created At:</b> ${c.created_at ? new Date(c.created_at).toLocaleDateString() : 'N/A'}</p>
            `;
            document.getElementById('courseModal').style.display = 'flex';
        };

        // കോഴ്‌സ് എഡിറ്റ് ചെയ്യാൻ (Edit)
        window.editCourse = function(id) {
            const c = allCourses.find(x => x.id === id);
            if (!c) return;
            document.getElementById('modalTitle').textContent = "Edit Course";
            document.getElementById('modalContent').innerHTML = `
                <form id="editCourseForm" onsubmit="saveCourseEdit(event, '${c.id}')">
                    <div style="margin-bottom:12px;">
                        <label style="font-size:13px; font-weight:600;">Course Name</label>
                        <input type="text" id="editCourseName" value="${c.course_name}" class="form-control" required>
                    </div>
                    <div style="margin-bottom:12px;">
                        <label style="font-size:13px; font-weight:600;">Duration</label>
                        <input type="text" id="editCourseDuration" value="${c.duration || ''}" class="form-control" required>
                    </div>
                    <div style="margin-bottom:12px;">
                        <label style="font-size:13px; font-weight:600;">Course Fee (₹)</label>
                        <input type="number" id="editCourseFee" value="${c.total_fee || 0}" class="form-control" required min="0">
                    </div>
                    <button type="submit" style="width:100%; background:#10B981; color:#fff; border:none; padding:10px; border-radius:6px; font-weight:600; cursor:pointer;">Update Course</button>
                </form>
            `;
            document.getElementById('courseModal').style.display = 'flex';
        };

        window.saveCourseEdit = async function(e, id) {
            e.preventDefault();
            const name = document.getElementById('editCourseName').value.trim();
            const duration = document.getElementById('editCourseDuration').value.trim();
            const fee = Number(document.getElementById('editCourseFee').value);

            const { error } = await supabase.from('courses').update({
                course_name: name,
                duration: duration,
                total_fee: fee
            }).eq('id', id);

            if (error) {
                alert('Error updating: ' + error.message);
            } else {
                alert('Course updated successfully!');
                closeModal();
                fetchCourses();
            }
        };

        // കോഴ്‌സ് ഡിലീറ്റ് ചെയ്യാൻ (Delete)
        window.deleteCourse = async function(id, courseName) {
            const confirmName = prompt(`⚠️ Are you sure you want to delete this course?\nType the course name "${courseName}" to confirm:`);
            if (confirmName === courseName) {
                const { error } = await supabase.from('courses').delete().eq('id', id);
                if (error) {
                    alert('Error deleting course (It might be linked to students): ' + error.message);
                } else {
                    alert('Course deleted successfully!');
                    fetchCourses();
                }
            } else if (confirmName !== null) {
                alert('Course name does not match. Deletion cancelled.');
            }
        };

        window.closeModal = function() {
            document.getElementById('courseModal').style.display = 'none';
        };

        document.getElementById('logoutBtn').addEventListener('click', async () => { 
            await supabase.auth.signOut(); localStorage.clear(); sessionStorage.clear();
            window.history.replaceState(null, '', 'login.html'); window.location.replace('login.html'); 
        });

        checkAuth();
    </script>
</body>
</html>

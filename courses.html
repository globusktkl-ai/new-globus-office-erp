<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Management - Globus Technical Academy</title>
    <!-- പ്രധാന സ്റ്റൈൽ -->
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        /* ഈ പേജിന് മാത്രമുള്ള പ്രത്യേക ഡിസൈനുകൾ */
        .course-container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
        .dashboard-card { background: #fff; border-radius: 12px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; font-size: 14px; color: #374151; margin-bottom: 8px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; }
        .form-group textarea { resize: vertical; min-height: 80px; }
        
        .course-list-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .course-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; position: relative; transition: transform 0.2s; }
        .course-card:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .course-title { font-size: 18px; color: #1e293b; margin: 0 0 15px 0; padding-right: 70px; }
        .course-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 13px; color: #475569; margin-bottom: 15px; }
        .sub-modules-box { background: #fff; border: 1px dashed #cbd5e1; padding: 10px; border-radius: 6px; font-size: 12px; color: #64748b; margin-bottom: 15px; }
        
        .btn-primary { background: #2563eb; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: 600; width: 100%; }
        .btn-delete { background: #fee2e2; color: #dc2626; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: bold; position: absolute; bottom: 20px; right: 20px; transition: 0.2s; }
        .btn-delete:hover { background: #ef4444; color: white; }
        .status-badge { position: absolute; top: 20px; right: 20px; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .status-active { background: #dcfce7; color: #166534; }
        .status-draft { background: #fef9c3; color: #854d0e; }
    </style>
</head>
<body>
    <nav class="app-header">
        <div class="header-left">
            <a href="dashboard.html" class="back-btn" style="color: white; text-decoration: none;">⬅️ Back to Dashboard</a>
        </div>
        <h1 style="color: white; font-size: 18px; margin: 0 auto;">Academic Courses</h1>
        <div class="header-right" style="width: 150px;"></div>
    </nav>

    <main class="course-container">
        <!-- Add Course Section -->
        <section class="dashboard-card">
            <h2 style="font-size: 18px; margin-bottom: 20px; color: #1e293b;">📝 Create New Curriculum</h2>
            <form id="addCourseForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Course Name</label>
                        <input type="text" id="courseName" placeholder="e.g., Advanced Smartphone Repair" required>
                    </div>
                    <div class="form-group">
                        <label>Certification Type</label>
                        <select id="certType">
                            <option value="Certificate">Certificate</option>
                            <option value="Diploma">Diploma</option>
                            <option value="Advanced Diploma">Advanced Diploma</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Total Duration</label>
                        <input type="text" id="duration" placeholder="e.g., 6 Months" required>
                    </div>
                    <div class="form-group">
                        <label>Total Hours (Theory + Practical)</label>
                        <input type="number" id="totalHours" placeholder="e.g., 120" required>
                    </div>
                    <div class="form-group">
                        <label>Total Fee (₹)</label>
                        <input type="number" id="totalFee" placeholder="25000" required>
                    </div>
                    <div class="form-group">
                        <label>Lead Instructor / Faculty</label>
                        <input type="text" id="instructorName" placeholder="Faculty Name" required>
                    </div>
                    <div class="form-group">
                        <label>Batch Capacity</label>
                        <input type="number" id="capacity" placeholder="30" required>
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select id="courseStatus">
                            <option value="Active">🟢 Active (Open for Admission)</option>
                            <option value="Draft">🟠 Draft (Planning)</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group" style="margin-bottom: 20px;">
                    <label>Sub-modules / Syllabus (Comma separated)</label>
                    <textarea id="subModules" placeholder="e.g., Basic Electronics, SMD Rework, Schematic Reading, Software Flashing"></textarea>
                </div>

                <button type="submit" class="btn-primary">Save Course Curriculum</button>
            </form>
        </section>

        <!-- Course List Section -->
        <section class="dashboard-card" style="background: transparent; box-shadow: none; padding: 0;">
            <h2 style="font-size: 18px; margin-bottom: 20px; color: #1e293b;">📚 Available Courses</h2>
            <div id="courseContainer" class="course-list-grid">
                <p style="text-align: center; color: #64748b; width: 100%;">Loading courses...</p>
            </div>
        </section>
    </main>

    <script type="module" src="assets/js/courses.js"></script>
</body>
</html>

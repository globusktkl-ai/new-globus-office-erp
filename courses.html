<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Management - Globus Technical Academy</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- Header (Hub and Spoke Connection) -->
    <header class="app-header">
        <a href="dashboard.html" class="back-btn">⬅️ Back to Dashboard</a>
        <h1>Course Management</h1>
    </header>

    <main class="container">
        <!-- പുതിയ കോഴ്‌സ് ചേർക്കാനുള്ള ഫോം -->
        <section class="form-card">
            <h2>Add New Course</h2>
            <form id="addCourseForm">
                <div class="input-group">
                    <label>Course Name</label>
                    <input type="text" id="courseName" placeholder="e.g., Advanced Smartphone Hardware Repair" required>
                </div>
                
                <div class="input-row">
                    <div class="input-group">
                        <label>Duration</label>
                        <input type="text" id="duration" placeholder="e.g., 3 Months" required>
                    </div>
                    <div class="input-group">
                        <label>Total Fee (₹)</label>
                        <input type="number" id="totalFee" placeholder="25000" required>
                    </div>
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label>Instructor / Faculty Name</label>
                        <input type="text" id="instructorName" placeholder="e.g., Academic Faculty" required>
                    </div>
                    <div class="input-group">
                        <label>Seat Capacity</label>
                        <input type="number" id="capacity" placeholder="30" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>Course Status</label>
                    <select id="courseStatus">
                        <option value="Active">🟢 Active (Open for Admission)</option>
                        <option value="Draft">🟠 Draft (On Hold)</option>
                    </select>
                </div>

                <button type="submit" class="primary-btn">Save Course</button>
            </form>
        </section>

        <!-- നിലവിലുള്ള കോഴ്‌സുകൾ കാണിക്കാനുള്ള ഭാഗം -->
        <section class="course-list">
            <h2>Available Courses</h2>
            <div id="courseContainer" class="grid-container">
                <p class="loading-text">Loading courses...</p>
            </div>
        </section>
    </main>

    <script src="courses.js"></script>
</body>
</html>

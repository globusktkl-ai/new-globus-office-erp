<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard - Globus Technical Academy</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        /* COMPACT & PREMIUM LAYOUT OVERRIDES */
        
        body { background-color: #f8fafc; } /* Lighter, premium background */
        
        .main-content { padding: 15px; }
        
        h2 { 
            font-size: 18px !important; 
            font-weight: 800 !important; 
            margin-bottom: 15px !important; 
            color: #0f172a; 
            letter-spacing: -0.5px;
        }

        /* Stat Grid - Compact 2x2 Layout */
        .stat-grid {
            display: grid !important;
            grid-template-columns: repeat(2, 1fr) !important;
            gap: 12px !important;
            margin-bottom: 25px !important;
        }
        .stat-box {
            background: #ffffff;
            padding: 15px 12px !important;
            border-radius: 12px !important;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03) !important;
            border: 1px solid rgba(226, 232, 240, 0.8) !important;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: transform 0.2s ease;
        }
        .stat-box:active { transform: scale(0.98); }
        .stat-label { 
            font-size: 11px !important; 
            color: #64748b !important; 
            margin-bottom: 6px !important;
            font-weight: 700 !important;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .stat-value { 
            font-size: 18px !important; 
            font-weight: 900 !important; 
            color: #1e293b;
        }

        /* Module Sections - Premium styling */
        .module-section {
            background: #ffffff;
            border-radius: 14px !important;
            padding: 20px 15px !important;
            margin-bottom: 20px !important;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03) !important;
            border: 1px solid #f1f5f9;
        }
        
        /* SMART & PREMIUM TITLES */
        .module-title {
            font-size: 14px !important;
            color: #1e293b;
            margin-top: 0;
            margin-bottom: 20px !important;
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
            padding-bottom: 10px !important;
            border-bottom: none !important; /* Removed old full-width border */
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 900;
        }
        
        /* Modern Gradient Underlines */
        .module-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            height: 4px;
            border-radius: 4px;
            width: 45px; /* Short, elegant pill shape */
        }
        .module-title.academic { color: #1e3a8a; }
        .module-title.academic::after { background: linear-gradient(90deg, #3b82f6, #93c5fd); }
        
        .module-title.finance { color: #064e3b; }
        .module-title.finance::after { background: linear-gradient(90deg, #10b981, #6ee7b7); }
        
        /* Nav Grid - Changed to 2 columns for a more symmetrical premium look */
        .module-section .nav-grid {
            display: grid !important;
            grid-template-columns: repeat(2, 1fr) !important;
            gap: 12px !important;
            margin-top: 0;
        }
        
        /* Modern, App-like Buttons */
        .nav-btn {
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: center !important;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px !important;
            padding: 15px 5px !important;
            text-decoration: none;
            color: #475569 !important;
            font-size: 12px !important;
            font-weight: 700 !important;
            text-align: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02) !important;
            transition: all 0.2s;
            min-height: 75px !important;
        }
        .nav-btn:active { 
            transform: scale(0.95); 
            background: #f8fafc;
        }
        .nav-icon { 
            font-size: 24px !important; 
            margin-bottom: 8px !important; 
        }

        /* Specific Nav Button Highlights (Subtle) */
        .nav-btn.expense-btn { background-color: #fef2f2 !important; border-color: #fecaca !important; color: #b91c1c !important; }
        .nav-btn.report-btn { background-color: #f0fdf4 !important; border-color: #bbf7d0 !important; color: #15803d !important; }

    </style>
</head>
<body>
    
    <nav class="app-header">
        <div class="header-left" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px;">
            <img src="assets/images/logo.png" class="logo-small" alt="Logo" onerror="this.style.display='none'">
            <div style="display: flex; flex-direction: column; overflow: hidden;">
                <span class="brand-top" style="font-size: 15px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 900; letter-spacing: 0.5px;">GLOBUS</span>
                <span class="brand-bottom" style="text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 11px; color: #64748b; font-weight: 600;">Technical Academy</span>
            </div>
        </div>
        
        <div class="header-right" style="flex-shrink: 0; margin-left: 10px;">
            <button class="btn-logout-custom" id="logoutBtn" style="padding: 6px 14px; font-size: 12px; border-radius: 8px; background: #ef4444; color: white; border: none; font-weight: bold; box-shadow: 0 2px 4px rgba(239, 68, 68, 0.3);">Logout</button>
        </div>
    </nav>

    <main class="main-content">
        <h2>Institute Overview</h2>
        
        <div class="stat-grid">
            <div class="stat-box">
                <div class="stat-label">Total Students</div>
                <div class="stat-value" id="statStudents">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Active Courses</div>
                <div class="stat-value" id="statCourses">0</div>
            </div>
            <div class="stat-box" style="border-left: 4px solid #10B981 !important;">
                <div class="stat-label">Today's Collection</div>
                <div class="stat-value" id="statTodayCollection" style="color: #10B981;">₹ 0</div>
            </div>
            <div class="stat-box" style="border-left: 4px solid #EF4444 !important;">
                <div class="stat-label">Pending Fees</div>
                <div class="stat-value" id="statPendingFees" style="color: #EF4444;">₹ 0</div>
            </div>
        </div>

        <!-- ACADEMIC MODULE -->
        <div class="module-section">
            <h3 class="module-title academic"><span>🎓</span> Academic & Admin</h3>
            <div class="nav-grid">
                <a href="admission.html" class="nav-btn"><span class="nav-icon">📝</span>New Admission</a>
                <a href="students.html" class="nav-btn"><span class="nav-icon">👥</span>Directory</a>
                <a href="courses.html" class="nav-btn"><span class="nav-icon">📚</span>Courses</a>
                <a href="exams.html" class="nav-btn"><span class="nav-icon">🏆</span>Exams & Certs</a>
            </div>
        </div>

        <!-- FINANCE MODULE -->
        <div class="module-section">
            <h3 class="module-title finance"><span>💰</span> Finance & Accounts</h3>
            <div class="nav-grid">
                <a href="fees.html" class="nav-btn"><span class="nav-icon">💵</span>Collect Fee</a>
                <a href="expense.html" class="nav-btn expense-btn"><span class="nav-icon">📓</span>Day Book</a>
                <a href="report.html" class="nav-btn report-btn"><span class="nav-icon">📊</span>Reports</a>
            </div>
        </div>
    </main>

    <script type="module">
        import { supabase } from './assets/js/supabase-config.js';
        
        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return; }
            loadDashboardData();
        }

        async function loadDashboardData() {
            try {
                // 1. Total Students
                const { count: studentCount } = await supabase.from('students').select('*', { count: 'exact', head: true });
                document.getElementById('statStudents').textContent = studentCount || 0;

                // 2. Active Courses
                const { count: courseCount } = await supabase.from('courses').select('*', { count: 'exact', head: true }).eq('status', 'Active');
                document.getElementById('statCourses').textContent = courseCount || 0;

                // 3. Today's Collection
                const today = new Date();
                const todayDate = today.getFullYear() + "-" + String(today.getMonth() + 1).padStart(2, '0') + "-" + String(today.getDate()).padStart(2, '0');
                
                const { data: collections } = await supabase.from('fee_payments').select('amount_paid').gte('payment_date', `${todayDate}T00:00:00Z`);
                let paymentsToday = collections ? collections.reduce((sum, record) => sum + Number(record.amount_paid), 0) : 0;
                
                const { data: admissionsToday } = await supabase.from('students').select('admission_fee').gte('created_at', `${todayDate}T00:00:00Z`);
                let admissionsTotal = admissionsToday ? admissionsToday.reduce((sum, record) => sum + Number(record.admission_fee), 0) : 0;

                let todayTotal = paymentsToday + admissionsTotal;
                document.getElementById('statTodayCollection').textContent = '₹ ' + todayTotal;

                // 4. Pending Fees
                const { data: studentsData } = await supabase.from('students').select('id, total_fee, admission_fee');
                const { data: paymentsData } = await supabase.from('fee_payments').select('student_id, amount_paid');
                
                let pendingFeesSum = 0;
                if (studentsData) {
                    studentsData.forEach(s => {
                        let total = Number(s.total_fee) || 0;
                        let admission = Number(s.admission_fee) || 0;
                        
                        let otherPayments = 0;
                        if (paymentsData) {
                            const studentPayments = paymentsData.filter(p => p.student_id === s.id);
                            otherPayments = studentPayments.reduce((sum, p) => sum + Number(p.amount_paid), 0);
                        }
                        
                        const balance = total - admission - otherPayments;
                        if (balance > 0) pendingFeesSum += balance;
                    });
                }
                document.getElementById('statPendingFees').textContent = '₹ ' + pendingFeesSum;

            } catch (err) { 
                console.error("Dashboard Loading Error:", err); 
            }
        }

        document.getElementById('logoutBtn').addEventListener('click', async () => { 
            const btn = document.getElementById('logoutBtn');
            btn.textContent = 'Wait...'; btn.disabled = true;
            await supabase.auth.signOut(); 
            localStorage.clear(); sessionStorage.clear();
            window.location.replace('login.html'); 
        });
        
        checkAuth();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Institute Settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen p-4">

    <div class="bg-white rounded-xl shadow-lg w-full max-w-md p-6 relative">
        <button class="absolute top-4 right-4 text-gray-400 hover:text-red-500"><i class="fas fa-times text-xl"></i></button>
        
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-blue-900"><i class="fas fa-cog"></i> Institute Settings</h2>
        </div>

        <form id="settingsForm" class="space-y-4">
            <!-- No placeholders for Main and Sub Name as requested -->
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Institute Main Name (Brand)</label>
                <input type="text" id="mainName" class="w-full border-2 border-gray-200 rounded-lg p-2 focus:border-blue-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Sub Name / Tagline</label>
                <input type="text" id="subName" class="w-full border-2 border-gray-200 rounded-lg p-2 focus:border-blue-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Full Address</label>
                <input type="text" id="address" placeholder="City, State, PIN" class="w-full border-2 border-gray-200 rounded-lg p-2 focus:border-blue-500 outline-none">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Phone</label>
                    <!-- Exact 10 digit validation -->
                    <input type="number" id="phone" placeholder="10 Digits" class="w-full border-2 border-gray-200 rounded-lg p-2 focus:border-blue-500 outline-none" 
                           oninput="if(this.value.length > 10) this.value = this.value.slice(0, 10);">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Email</label>
                    <input type="email" id="email" class="w-full border-2 border-gray-200 rounded-lg p-2 focus:border-blue-500 outline-none">
                </div>
            </div>

            <div class="flex gap-3 pt-4">
                <button type="button" onclick="saveSettings()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-md transition-all">
                    <i class="fas fa-save"></i> Save Settings
                </button>
                <button type="button" onclick="confirmReset()" class="flex-1 bg-red-500 hover:bg-red-600 text-white font-bold py-3 rounded-lg shadow-md transition-all">
                    <i class="fas fa-trash-alt"></i> Reset
                </button>
            </div>
        </form>
    </div>

    <script>
        function saveSettings() {
            let phone = document.getElementById('phone').value;
            if (phone.length !== 10) {
                Swal.fire('Error', 'Phone number must be exactly 10 digits.', 'error');
                return;
            }
            Swal.fire('Success', 'Settings Saved Successfully!', 'success');
        }

        // CAPTCHA functionality for Reset
        function confirmReset() {
            let num1 = Math.floor(Math.random() * 10) + 1;
            let num2 = Math.floor(Math.random() * 10) + 1;
            let answer = num1 + num2;

            Swal.fire({
                title: 'Security Verification',
                text: `To reset settings, please solve: ${num1} + ${num2} = ?`,
                input: 'number',
                inputAttributes: { autocapitalize: 'off' },
                showCancelButton: true,
                confirmButtonText: 'Verify & Reset',
                confirmButtonColor: '#d33',
                preConfirm: (inputVal) => {
                    if (parseInt(inputVal) !== answer) {
                        Swal.showValidationMessage('Incorrect answer! Reset cancelled.');
                    }
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    document.getElementById('settingsForm').reset();
                    Swal.fire('Reset!', 'All settings have been cleared.', 'success');
                }
            });
        }
    </script>
</body>
</html>

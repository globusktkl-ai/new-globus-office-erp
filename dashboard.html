<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Institute Settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%); }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,0.08); border: 1px solid rgba(255,255,255,0.5); }
        .input-premium { transition: all 0.3s ease; }
        .input-premium:focus { box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); transform: translateY(-1px); }
        .btn-hover { transition: all 0.2s ease; }
        .btn-hover:active { transform: scale(0.97); }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen p-4">

    <div class="glass-card rounded-2xl w-full max-w-md p-8 relative">
        <button class="absolute top-5 right-5 text-gray-400 hover:text-red-500 transition-colors"><i class="fas fa-times text-xl"></i></button>
        
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-3 shadow-inner">
                <i class="fas fa-building text-2xl"></i>
            </div>
            <h2 class="text-2xl font-black text-slate-800 tracking-tight">Institute Settings</h2>
            <p class="text-sm text-slate-500 font-medium mt-1">Manage your brand identity</p>
        </div>

        <form id="settingsForm" class="space-y-5">
            <!-- No placeholders -->
            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">Institute Main Name (Brand)</label>
                <input type="text" id="mainName" class="input-premium w-full border-2 border-slate-200 rounded-xl p-3 text-slate-800 font-semibold focus:border-blue-500 outline-none">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">Sub Name / Tagline</label>
                <input type="text" id="subName" class="input-premium w-full border-2 border-slate-200 rounded-xl p-3 text-slate-800 font-semibold focus:border-blue-500 outline-none">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">Full Address</label>
                <input type="text" id="address" placeholder="City, State, PIN" class="input-premium w-full border-2 border-slate-200 rounded-xl p-3 text-slate-800 font-semibold focus:border-blue-500 outline-none">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">Phone (10 Digits)</label>
                    <input type="number" id="phone" class="input-premium w-full border-2 border-slate-200 rounded-xl p-3 text-slate-800 font-bold focus:border-blue-500 outline-none" 
                           oninput="if(this.value.length > 10) this.value = this.value.slice(0, 10);">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">Email Address</label>
                    <input type="email" id="email" class="input-premium w-full border-2 border-slate-200 rounded-xl p-3 text-slate-800 font-semibold focus:border-blue-500 outline-none">
                </div>
            </div>

            <div class="flex gap-4 pt-4 mt-2 border-t border-slate-100">
                <button type="button" onclick="saveSettings()" class="btn-hover flex-1 bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-blue-500/30">
                    <i class="fas fa-save mr-1"></i> Save
                </button>
                <button type="button" onclick="confirmReset()" class="btn-hover flex-1 bg-white border-2 border-red-100 text-red-500 hover:bg-red-50 hover:border-red-200 font-bold py-3.5 rounded-xl shadow-sm">
                    <i class="fas fa-trash-alt mr-1"></i> Reset
                </button>
            </div>
        </form>
    </div>

    <script>
        function saveSettings() {
            let phone = document.getElementById('phone').value;
            if (phone && phone.length !== 10) {
                Swal.fire({ icon: 'error', title: 'Invalid Phone', text: 'Phone number must be exactly 10 digits!', confirmButtonColor: '#3b82f6' });
                return;
            }
            Swal.fire({ icon: 'success', title: 'Saved!', text: 'Institute settings updated successfully.', confirmButtonColor: '#10b981' });
        }

        function confirmReset() {
            let num1 = Math.floor(Math.random() * 10) + 1;
            let num2 = Math.floor(Math.random() * 10) + 1;
            let answer = num1 + num2;

            Swal.fire({
                title: 'Security Verification',
                html: `<p class="text-sm text-gray-500 mb-4">To prevent accidental resets, please prove you are human.</p><h3 class="text-2xl font-black text-blue-900">${num1} + ${num2} = ?</h3>`,
                input: 'number',
                inputAttributes: { autocapitalize: 'off', class: 'text-center text-xl font-bold p-3 rounded-lg border-2 border-blue-200' },
                showCancelButton: true,
                confirmButtonText: 'Verify & Clear',
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#94a3b8',
                preConfirm: (inputVal) => {
                    if (parseInt(inputVal) !== answer) {
                        Swal.showValidationMessage('Incorrect mathematical answer!');
                    }
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    document.getElementById('settingsForm').reset();
                    Swal.fire({ icon: 'success', title: 'Reset Complete', text: 'All form fields have been cleared.', confirmButtonColor: '#10b981', timer: 1500 });
                }
            });
        }
    </script>
</body>
</html>

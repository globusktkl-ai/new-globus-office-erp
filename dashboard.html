<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Student Directory - Globus Technical Academy</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        /* പ്രിന്റ് ചെയ്യുമ്പോൾ കാർഡ് മാത്രം കാണിക്കാനുള്ള സ്റ്റെെൽ */
        @media print {
            body * {
                visibility: hidden;
            }
            #studentModal, #studentModal * {
                visibility: visible;
            }
            #studentModal {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                background: white !important;
                display: flex !important;
                justify-content: center;
                align-items: center;
            }
            .no-print {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    
    <nav class="app-header">
        <div class="header-left" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px;">
            <img src="assets/images/logo.png" class="logo-small" alt="Logo" onerror="this.style.display='none'">
            <div style="display: flex; flex-direction: column; overflow: hidden;">
                <span class="brand-top" style="font-size: 16px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Globus</span>
                <span class="brand-bottom" style="text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Technical Academy</span>
            </div>
        </div>
        
        <div class="header-right" style="flex-shrink: 0; margin-left: 10px;">
            <button class="btn-logout-custom" id="logoutBtn">Logout</button>
        </div>
    </nav>

    <main class="main-content">
        <div style="text-align: center; margin-bottom: 20px;">
            <a href="dashboard.html" style="color: var(--primary-light); text-decoration: none; font-weight: 600;">← Return to Dashboard</a>
        </div>

        <!-- സ്റ്റുഡന്റ്സ് ലിസ്റ്റ് കാർഡ് -->
        <div class="form-card">
            <h2 style="font-size: 18px; margin-bottom: 15px; color: var(--primary-dark);">Student Directory</h2>
            <div id="studentsList">
                <div style="text-align:center; padding:15px; color:#6B7280;">Loading students...</div>
            </div>
        </div>
    </main>

    <!-- Smart ID Card / Student Profile Modal Popup -->
    <div id="studentModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:100; justify-content:center; align-items:center; padding:15px;">
        <div style="background:#fff; width:100%; max-width:400px; border-radius:16px; padding:20px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); overflow:hidden; position:relative;">
            
            <!-- സ്മാർട്ട് ഐഡി കാർഡ് ഡിസൈൻ -->
            <div id="smartCardContent" style="background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); border: 2px solid #3B82F6; border-radius: 12px; padding: 20px; text-align: center; position: relative;">
                
                <!-- അക്കാദമി ഹെഡർ -->
                <div style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 12px; border-bottom: 2px solid #cbd5e1; padding-bottom: 10px;">
                    <span style="font-size: 14px; font-weight: 800; color: #1e3a8a; letter-spacing: 0.5px;">GLOBUS TECHNICAL ACADEMY</span>
                </div>

                <!-- കുട്ടിയുടെ ഫോട്ടോ / അവതാർ -->
                <div style="width: 80px; height: 80px; background: #3B82F6; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; margin: 0 auto 12px auto; border: 3px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.1);" id="cardAvatar">
                    G
                </div>

                <!-- കുട്ടിയുടെ വിവരങ്ങൾ -->
                <h3 id="cardStudentName" style="font-size: 20px; color: #111827; margin-bottom: 4px; font-weight: 700;">Student Name</h3>
                <p id="cardCourseName" style="font-size: 14px; color: #2563eb; font-weight: 600; margin-bottom: 15px;">Course Name</p>

                <div style="text-align: left; background: #ffffff; padding: 12px; border-radius: 8px; font-size: 13px; color: #374151; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);">
                    <p style="margin-bottom: 6px;"><b>Admission No:</b> <span id="cardAdmNo">-</span></p>
                    <p style="margin-bottom: 6px;"><b>Phone:</b> <span id="cardPhone">-</span></p>
                    <p style="margin-bottom: 6px;"><b>Email:</b> <span id="cardEmail">-</span></p>
                    <p style="margin-bottom: 0;"><b>Joined Date:</b> <span id="cardDate">-</span></p>
                </div>

                <div style="margin-top: 15px; font-size: 10px; color: #64748b; font-weight: 500;">
                    Official Student Smart ID Card
                </div>
            </div>

            <!-- ആക്ഷൻ ബട്ടണുകൾ (Print, Share, Close) -->
            <div style="margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;" class="no-print">
                <button type="button" onclick="printCard()" style="background: #2563eb; color: #fff; border: none; padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;">🖨️ Print / PDF</button>
                <button type="button" onclick="shareCard()" style="background: #10b981; color: #fff; border: none; padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;">🔗 Share</button>
            </div>
            
            <div style="margin-top: 10px; text-align: center;" class="no-print">
                <button type="button" onclick="closeModal()" style="width: 100%; background: #6b7280; color: #fff; border: none; padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer;">Close</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase } from './assets/js/supabase-config.js';
        let allStudents = [];
        let currentStudentData = null;

        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return; }
            fetchStudents();
        }

        async function fetchStudents() {
            const { data, error } = await supabase.from('students').select('*').order('created_at', { ascending: false });
            if (error) {
                console.error("Error fetching students:", error);
                document.getElementById('studentsList').innerHTML = '<div style="text-align:center; padding:15px; color:#ef4444;">Error loading students.</div>';
                return;
            }
            allStudents = data || [];
            renderStudents(allStudents);
        }

        function renderStudents(students) {
            const container = document.getElementById('studentsList');
            container.innerHTML = '';

            if (students.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:15px; color:#ef4444;">No students found.</div>';
                return;
            }

            students.forEach(s => {
                const card = document.createElement('div');
                card.style.cssText = "background: #F9FAFB; border: 1px solid #E5E7EB; border-radius: 8px; padding: 12px; margin-bottom: 10px;";
                card.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <div>
                            <strong style="font-size: 15px; color: #111827;">${s.full_name || s.name || 'N/A'}</strong>
                            <div style="font-size: 13px; color: #4B5563; margin-top: 2px;">Course: ${s.course_name || s.course || 'N/A'}</div>
                            <div style="font-size: 12px; color: #6B7280; margin-top: 2px;">Phone: ${s.phone || 'N/A'}</div>
                        </div>
                    </div>
                    <div style="display: flex; gap: 8px; margin-top: 10px;">
                        <button onclick="viewStudent('${s.id}')" style="flex: 1; background: #3B82F6; color: #fff; border: none; padding: 8px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px;">View Smart Card</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // വ്യൂ ബട്ടൺ ക്ലിക്ക് ചെയ്യുമ്പോൾ സ്മാർട്ട് കാർഡ് മോഡൽ തുറക്കാൻ
        window.viewStudent = function(id) {
            const s = allStudents.find(x => x.id === id);
            if (!s) return;
            currentStudentData = s;

            const name = s.full_name || s.name || 'N/A';
            document.getElementById('cardStudentName').textContent = name;
            document.getElementById('cardAvatar').textContent = name.charAt(0).toUpperCase();
            document.getElementById('cardCourseName').textContent = s.course_name || s.course || 'N/A';
            document.getElementById('cardAdmNo').textContent = s.admission_no || s.id.slice(0, 8);
            document.getElementById('cardPhone').textContent = s.phone || 'N/A';
            document.getElementById('cardEmail').textContent = s.email || 'N/A';
            document.getElementById('cardDate').textContent = s.created_at ? new Date(s.created_at).toLocaleDateString() : 'N/A';

            document.getElementById('studentModal').style.display = 'flex';
        };

        // പ്രിന്റ് / പിഡിഎഫ് ഡൗൺലോഡ് ചെയ്യാൻ
        window.printCard = function() {
            window.print();
        };

        // കാർഡ് ഷെയർ ചെയ്യാൻ
        window.shareCard = async function() {
            if (!currentStudentData) return;
            const text = `Globus Technical Academy Student Card\nName: ${currentStudentData.full_name || currentStudentData.name}\nCourse: ${currentStudentData.course_name || currentStudentData.course}\nPhone: ${currentStudentData.phone}`;
            
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'Student Smart Card',
                        text: text,
                    });
                } catch (err) {
                    console.log('Error sharing:', err);
                }
            } else {
                navigator.clipboard.writeText(text);
                alert('Student details copied to clipboard!');
            }
        };

        window.closeModal = function() {
            document.getElementById('studentModal').style.display = 'none';
        };

        document.getElementById('logoutBtn').addEventListener('click', async () => { 
            await supabase.auth.signOut(); localStorage.clear(); sessionStorage.clear();
            window.history.replaceState(null, '', 'login.html'); window.location.replace('login.html'); 
        });

        checkAuth();
    </script>
</body>
</html>

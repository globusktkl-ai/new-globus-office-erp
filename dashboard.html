<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard - Globus ERP</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <!-- App Header with Logo -->
    <nav class="app-navbar">
        <div class="navbar-brand">
            <!-- LOGO: പ്രൊജക്റ്റിലെ assets/images ഫോൾഡറിൽ logo.png എന്ന പേരിൽ ചിത്രം സേവ് ചെയ്യുക -->
            <img src="assets/images/logo.png" alt="Logo" class="app-logo" onerror="this.style.display='none'"> 
            <span>Globus ERP</span>
        </div>
        <div class="navbar-user">
            <span id="userName" style="font-size: 12px; font-weight:600;">Loading...</span>
            <button id="logoutBtn" class="btn-logout">Logout</button>
        </div>
    </nav>

    <main class="main-content">
        <h2 class="page-title">Hello, Admin! 👋</h2>
        <p class="page-subtitle">Here is your institute's summary.</p>

        <!-- Compact Stats Grid for Mobile -->
        <div class="stat-grid">
            <div class="stat-box">
                <div class="stat-label">Total Students</div>
                <div class="stat-value" id="statStudents">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Active Courses</div>
                <div class="stat-value" id="statCourses">0</div>
            </div>
            <div class="stat-box" style="border-bottom: 3px solid #22c55e;">
                <div class="stat-label">Today's Collection</div>
                <div class="stat-value" id="statTodayCollection" style="color: #16a34a;">₹ 0</div>
            </div>
            <div class="stat-box" style="border-bottom: 3px solid #ef4444;">
                <div class="stat-label">Pending Fees</div>
                <div class="stat-value" id="statPendingFees" style="color: #dc2626;">₹ 0</div>
            </div>
        </div>

        <!-- Beautiful Quick Links for Navigation -->
        <h3 style="margin-top: 32px; font-size: 16px; color: var(--text-muted);">Quick Actions</h3>
        <div class="nav-grid">
            <a href="admission.html" class="nav-btn">
                <span class="nav-icon">🎓</span>
                New Admission
            </a>
            <a href="fees.html" class="nav-btn">
                <span class="nav-icon">💰</span>
                Collect Fee
            </a>
            <a href="students.html" class="nav-btn">
                <span class="nav-icon">👥</span>
                Student Directory
            </a>
            <!-- നിങ്ങൾക്ക് ഭാവിയിൽ ചേർക്കാൻ പാകത്തിൽ ഒരു ഡമ്മി ബട്ടൺ -->
            <a href="#" class="nav-btn" style="opacity: 0.6;">
                <span class="nav-icon">📊</span>
                Reports
            </a>
        </div>
    </main>

    <script type="module">
        import { supabase } from './assets/js/supabase-config.js';

        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return; }
            document.getElementById('userName').textContent = session.user.user_metadata.full_name || 'Admin';
            loadDashboardData();
        }

        async function loadDashboardData() {
            try {
                const { count: studentCount } = await supabase.from('students').select('*', { count: 'exact', head: true }).eq('status', 'active');
                document.getElementById('statStudents').textContent = studentCount || 0;

                const { count: courseCount } = await supabase.from('courses').select('*', { count: 'exact', head: true }).eq('status', 'active');
                document.getElementById('statCourses').textContent = courseCount || 0;

                const todayDate = new Date().toISOString().split('T')[0];
                const { data: collections } = await supabase.from('fee_payments').select('amount_paid').gte('payment_date', `${todayDate}T00:00:00Z`);
                let todayTotal = collections ? collections.reduce((sum, record) => sum + Number(record.amount_paid), 0) : 0;
                document.getElementById('statTodayCollection').textContent = '₹ ' + todayTotal;

                const { data: studentsWithFees } = await supabase.from('students').select('total_fee, admission_fee, fee_payments(amount_paid)').eq('status', 'active');
                let pendingFeesSum = 0;
                if (studentsWithFees) {
                    studentsWithFees.forEach(s => {
                        const balance = (Number(s.total_fee) || 0) - (Number(s.admission_fee) || 0) - (s.fee_payments ? s.fee_payments.reduce((sum, p) => sum + Number(p.amount_paid), 0) : 0);
                        if (balance > 0) pendingFeesSum += balance;
                    });
                }
                document.getElementById('statPendingFees').textContent = '₹ ' + pendingFeesSum;
            } catch (err) {
                console.error(err);
            }
        }

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabase.auth.signOut();
            window.location.href = 'login.html';
        });

        checkAuth();
    </script>
</body>
</html>

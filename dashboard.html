<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard - Globus Technical Academy</title>
    <!-- CSS ഫയൽ ലിങ്ക് ചെയ്തിരിക്കുന്നു -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    
    <!-- പുതിയ ഹെഡർ ഡിസൈൻ (Overlap ഫിക്സ് ചെയ്തത്) -->
    <nav class="app-header">
        <div class="header-left">
            <img src="assets/images/logo.png" class="logo-small" alt="Logo" onerror="this.style.display='none'">
        </div>
        
        <div class="header-center">
            <span class="brand-top">Globus</span>
            <span class="brand-bottom">Technical Academy</span>
        </div>
        
        <div class="header-right">
            <button class="btn-logout-custom" id="logoutBtn">Logout</button>
        </div>
    </nav>

    <main class="main-content">
        <h2 style="font-size: 18px; margin-bottom: 16px;">Institute Overview</h2>
        
        <div class="stat-grid">
            <div class="stat-box">
                <div class="stat-label">Total Students</div>
                <div class="stat-value" id="statStudents">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Active Courses</div>
                <div class="stat-value" id="statCourses">0</div>
            </div>
            <div class="stat-box" style="border-left: 4px solid #10B981;">
                <div class="stat-label">Today's Collection</div>
                <div class="stat-value" id="statTodayCollection" style="color: #10B981;">₹ 0</div>
            </div>
            <div class="stat-box" style="border-left: 4px solid #EF4444;">
                <div class="stat-label">Pending Fees</div>
                <div class="stat-value" id="statPendingFees" style="color: #EF4444;">₹ 0</div>
            </div>
        </div>

        <!-- ലിങ്കുകൾ ശരിയാക്കിയ നാവിഗേഷൻ മെനു -->
        <div class="nav-grid">
            <a href="admission.html" class="nav-btn">
                <span class="nav-icon">🎓</span>New Admission
            </a>
            
            <a href="fees.html" class="nav-btn">
                <span class="nav-icon">💰</span>Collect Fee
            </a>
            
            <a href="students.html" class="nav-btn">
                <span class="nav-icon">👥</span>Student Directory
            </a>
            
            <a href="#" class="nav-btn" style="opacity: 0.6;">
                <span class="nav-icon">📊</span>Reports
            </a>
        </div>
    </main>

    <script type="module">
        import { supabase } from './assets/js/supabase-config.js';
        
        // 1. Check if user is logged in
        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { 
                window.location.href = 'login.html'; 
                return; 
            }
            loadDashboardData();
        }

        // 2. Load Dashboard Statistics
        async function loadDashboardData() {
            try {
                // Get Total Students
                const { count: studentCount } = await supabase
                    .from('students')
                    .select('*', { count: 'exact', head: true })
                    .eq('status', 'active');
                document.getElementById('statStudents').textContent = studentCount || 0;

                // Get Active Courses
                const { count: courseCount } = await supabase
                    .from('courses')
                    .select('*', { count: 'exact', head: true })
                    .eq('status', 'active');
                document.getElementById('statCourses').textContent = courseCount || 0;

                // Get Today's Collection
                const todayDate = new Date().toISOString().split('T')[0];
                const { data: collections } = await supabase
                    .from('fee_payments')
                    .select('amount_paid')
                    .gte('payment_date', `${todayDate}T00:00:00Z`);
                
                let todayTotal = collections ? collections.reduce((sum, record) => sum + Number(record.amount_paid), 0) : 0;
                document.getElementById('statTodayCollection').textContent = '₹ ' + todayTotal;

                // Get Pending Fees
                const { data: studentsWithFees } = await supabase
                    .from('students')
                    .select('total_fee, admission_fee, fee_payments(amount_paid)')
                    .eq('status', 'active');
                
                let pendingFeesSum = 0;
                if (studentsWithFees) {
                    studentsWithFees.forEach(s => {
                        const totalFee = Number(s.total_fee) || 0;
                        const admissionFee = Number(s.admission_fee) || 0;
                        const paidFees = s.fee_payments ? s.fee_payments.reduce((sum, p) => sum + Number(p.amount_paid), 0) : 0;
                        
                        const balance = totalFee - admissionFee - paidFees;
                        if (balance > 0) pendingFeesSum += balance;
                    });
                }
                document.getElementById('statPendingFees').textContent = '₹ ' + pendingFeesSum;
            } catch (err) { 
                console.error('Error loading dashboard data:', err); 
            }
        }

        // 3. Secure Logout Function
        document.getElementById('logoutBtn').addEventListener('click', async () => { 
            const btn = document.getElementById('logoutBtn');
            btn.textContent = 'Logging out...';
            btn.disabled = true;

            await supabase.auth.signOut(); 
            localStorage.clear();
            sessionStorage.clear();
            
            // Prevent back button from returning to dashboard after logout
            window.history.replaceState(null, '', 'login.html');
            window.location.replace('login.html'); 
        });
        
        checkAuth();
    </script>
</body>
</html>

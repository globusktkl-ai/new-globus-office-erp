<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exams & Certification - Globus</title>
    <link rel="stylesheet" href="assets/css/style.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body { background-color: #f8fafc; }
        .main-content { padding: 15px; max-width: 900px; margin: 0 auto; }
        .page-title { text-align: center; font-size: 20px; font-weight: 900; color: #1e3a8a; margin-bottom: 20px; text-transform: uppercase; }
        .search-box { width: 100%; padding: 14px 20px; border: 2px solid #e2e8f0; border-radius: 30px; font-size: 14px; outline: none; margin-bottom: 20px; }

        .exam-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .exam-header { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; border-bottom: 1px dashed #cbd5e1; padding-bottom: 10px; }
        .exam-avatar { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid #e2e8f0; }
        .exam-info h4 { margin: 0; font-size: 16px; color: #0f172a; font-weight: 800; }
        .exam-info p { margin: 2px 0 0; font-size: 12px; color: #64748b; font-weight: 600; }
        .current-status { background: #f0f9ff; border: 1px solid #bae6fd; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 13px; color: #0369a1; font-weight: 700; }
        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .input-group label { display: block; font-size: 12px; font-weight: 700; color: #475569; margin-bottom: 5px; }
        .input-group input, .input-group select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; }
        .action-btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 14px; font-weight: 800; cursor: pointer; transition: 0.2s; color: white; margin-top: 10px; }
        .btn-promote { background: #3b82f6; } .btn-complete { background: #10b981; } .btn-cert { background: #f59e0b; color: #fff; }
        .action-btn:active { transform: scale(0.98); }
        .empty-state { text-align: center; padding: 30px; color: #64748b; font-weight: 600; }

        /* CERTIFICATE MODAL STYLES (UPDATED FOR ZOOM) */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: flex-start; padding: 20px 10px; overflow-y: auto; }
        .modal-container { background: #fff; width: 100%; max-width: 950px; border-radius: 12px; display: flex; gap: 20px; padding: 20px; margin: auto; flex-wrap: wrap; }
        .cert-form-col { flex: 1; min-width: 300px; background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .cert-preview-col { flex: 1.5; min-width: 350px; display: flex; flex-direction: column; background: #e2e8f0; padding: 15px; border-radius: 8px; }
        
        /* Zoom & Viewport Setup */
        .zoom-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-weight: bold; color: #1e3a8a; }
        .zoom-btn { background: #fff; border: 1px solid #cbd5e1; padding: 4px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; margin-left: 5px; }
        .zoom-btn:active { background: #e2e8f0; }
        
        .cert-scroll-area { width: 100%; height: 500px; overflow: auto; background: #cbd5e1; border-radius: 6px; display: flex; justify-content: center; align-items: flex-start; padding: 10px; }
        .cert-viewport { transition: all 0.2s; /* Dimensions set by JS based on zoom */ }
        
        .cert-wrapper {
            position: relative; width: 700px; height: 990px;
            background-color: white; background-image: url('assets/images/Cirtificate.jpg'); 
            background-size: 100% 100%; background-repeat: no-repeat;
            transform-origin: top left; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .cert-text { position: absolute; font-family: 'Times New Roman', Times, serif; color: #000; font-weight: bold; white-space: nowrap; }
        #c-serial { top: 9.5%; left: 16%; font-size: 18px; color: #d32f2f; }
        #c-reg { top: 9.5%; right: 16%; font-size: 18px; color: #d32f2f; }
        #c-name { top: 40.5%; left: 50%; transform: translateX(-50%); font-size: 26px; }
        #c-course { top: 45.5%; left: 50%; transform: translateX(-50%); font-size: 20px; text-transform: uppercase; }
        #c-grade { top: 51.5%; left: 63%; font-size: 22px; }
        #c-date-from { top: 54.3%; left: 35%; font-size: 18px; }
        #c-date-to { top: 54.3%; left: 58%; font-size: 18px; }
        #c-exam-date { top: 57.5%; left: 32%; font-size: 18px; }
        #c-issue-date { top: 57.5%; left: 65%; font-size: 18px; }

        .modal-action-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }

        @media print {
            body * { visibility: hidden; }
            #certModal, #certModal * { visibility: visible; }
            #certModal { position: absolute; left: 0; top: 0; width: 100%; margin: 0; padding: 0; background: white; }
            .modal-container { box-shadow: none; padding: 0; max-width: 100%; display: block; }
            .cert-form-col, .zoom-controls { display: none !important; }
            .cert-preview-col { background: white; padding: 0; display: block; overflow: visible; }
            .cert-scroll-area { height: auto; overflow: visible; background: white; padding: 0; }
            #certViewport { width: 700px !important; height: 990px !important; margin: 0 auto; }
            .cert-wrapper { transform: scale(1) !important; margin: 0 auto; box-shadow: none; }
            @page { size: A4 portrait; margin: 0; }
        }
    </style>
</head>
<body>
    <nav class="app-header no-print">
        <div class="header-left" style="flex: 1; display: flex; align-items: center; gap: 10px;">
            <img src="assets/images/logo.png" class="logo-small" alt="Logo" onerror="this.style.display='none'">
            <div style="display: flex; flex-direction: column;">
                <span style="font-size: 15px; font-weight: 900; letter-spacing: 0.5px;">GLOBUS</span>
            </div>
        </div>
        <div class="header-right"><a href="dashboard.html" style="color: #3b82f6; text-decoration: none; font-weight: 700;">← Back</a></div>
    </nav>

    <main class="main-content no-print">
        <h2 class="page-title">🏆 Exams & Progression</h2>
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 Search active students...">
        <div id="studentsList"><div class="empty-state">Loading active students...</div></div>
    </main>

    <div id="certModal" class="modal-overlay">
        <div class="modal-container">
            <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; margin-bottom: 15px;">
                <h3 style="margin:0; color:#1e3a8a; font-size: 18px;">🎓 Generate Certificate</h3>
                <button onclick="closeModal()" class="no-print" style="background:#ef4444; color:#fff; border:none; padding:5px 12px; border-radius:6px; cursor:pointer; font-weight:bold;">X Close</button>
            </div>
            
            <div class="cert-form-col no-print">
                <div class="input-grid">
                    <div class="input-group"><label>Serial #</label><input type="text" id="f-serial" oninput="updateCert()"></div>
                    <div class="input-group"><label>Reg #</label><input type="text" id="f-reg" oninput="updateCert()"></div>
                </div>
                <div class="input-group" style="margin-bottom:15px;"><label>Student Name</label><input type="text" id="f-name" oninput="updateCert()"></div>
                <div class="input-group" style="margin-bottom:15px;"><label>Course Name</label><input type="text" id="f-course" oninput="updateCert()"></div>
                <div class="input-grid">
                    <div class="input-group"><label>Grade (e.g. A+)</label><input type="text" id="f-grade" value="A+" oninput="updateCert()"></div>
                    <div class="input-group"><label>Issue Date</label><input type="text" id="f-issue-date" oninput="updateCert()"></div>
                </div>
                <div class="input-grid">
                    <div class="input-group"><label>Duration From</label><input type="text" id="f-date-from" oninput="updateCert()"></div>
                    <div class="input-group"><label>Duration To</label><input type="text" id="f-date-to" oninput="updateCert()"></div>
                </div>
                <div class="input-group" style="margin-bottom:15px;"><label>Exam Conducted On</label><input type="text" id="f-exam-date" oninput="updateCert()"></div>
                
                <hr style="border:1px dashed #cbd5e1; margin: 20px 0;">
                
                <div class="modal-action-btns">
                    <button class="action-btn btn-promote" onclick="printCertificate()" style="margin:0; background: #4f46e5;">🖨️ Print / PDF</button>
                    <button class="action-btn btn-complete" id="shareBtn" onclick="shareCertificate()" style="margin:0; background: #059669;">📲 Send (PNG)</button>
                </div>
                <button class="action-btn" onclick="saveDataAndClose()" style="background: #1e293b; margin-top: 10px;">💾 Save Details & Close</button>
            </div>
            
            <div class="cert-preview-col">
                <div class="zoom-controls no-print">
                    <span>🔍 Live Preview</span>
                    <div>
                        <button class="zoom-btn" onclick="zoomCert(0.1)">+</button>
                        <button class="zoom-btn" onclick="zoomCert(-0.1)">-</button>
                    </div>
                </div>
                <div class="cert-scroll-area">
                    <div id="certViewport">
                        <div class="cert-wrapper" id="certificateRenderArea">
                            <div class="cert-text" id="c-serial">GM 0000000</div>
                            <div class="cert-text" id="c-reg">MP 000000</div>
                            <div class="cert-text" id="c-name">STUDENT NAME</div>
                            <div class="cert-text" id="c-course">COURSE NAME</div>
                            <div class="cert-text" id="c-grade">A+</div>
                            <div class="cert-text" id="c-date-from">DD-MM-YYYY</div>
                            <div class="cert-text" id="c-date-to">DD-MM-YYYY</div>
                            <div class="cert-text" id="c-exam-date">DD-MM-YYYY</div>
                            <div class="cert-text" id="c-issue-date">DD-MM-YYYY</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase } from './assets/js/supabase-config.js';
        let allStudents = [], allCourses = [], activeStudentData = null, currentZoom = 0.5;

        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return; }
            fetchData();
        }

        async function fetchData() {
            try {
                const { data: students } = await supabase.from('students').select('*').eq('status', 'active').order('created_at', { ascending: false });
                const { data: courses } = await supabase.from('courses').select('*');
                allStudents = students || []; allCourses = courses || [];
                renderStudents(allStudents);
            } catch (err) { console.error(err); alert("Error loading data!"); }
        }

        function renderStudents(studentsToRender) {
            const container = document.getElementById('studentsList'); container.innerHTML = '';
            if (studentsToRender.length === 0) { container.innerHTML = '<div class="empty-state">No active students found.</div>'; return; }

            studentsToRender.forEach(student => {
                const course = allCourses.find(c => c.id === student.course_id);
                if (!course || !course.modules) return; 

                let currentModule = student.module || course.modules[0];
                let moduleIndex = course.modules.indexOf(currentModule);
                if(moduleIndex === -1) { moduleIndex = 0; currentModule = course.modules[0]; }
                
                const avatar = student.photo_url || (student.gender === 'Female' ? 'https://avatar.iran.liara.run/public/girl' : 'https://avatar.iran.liara.run/public/boy');

                let actionOptions = `<option value="">-- Select Next Step --</option>`;
                course.modules.forEach(m => { actionOptions += `<option value="${m}">Promote to: ${m}</option>`; });
                actionOptions += `<option value="COMPLETED" style="color: green; font-weight: bold;">🎓 Mark as Course Completed</option>`;

                const card = document.createElement('div');
                card.className = 'exam-card';
                card.innerHTML = `
                    <div class="exam-header">
                        <img src="${avatar}" class="exam-avatar">
                        <div class="exam-info">
                            <h4>${student.full_name}</h4><p>Reg: ${student.register_number || 'N/A'} | Course: ${course.course_name}</p>
                        </div>
                    </div>
                    <div class="current-status">📖 Current Module: <b>${currentModule}</b> (Module ${moduleIndex + 1} of ${course.modules.length})</div>
                    <div class="input-grid">
                        <div class="input-group"><label>Marks Obtained</label><input type="number" id="marks_${student.id}"></div>
                        <div class="input-group"><label>Attendance (%)</label><input type="number" id="att_${student.id}"></div>
                    </div>
                    <div class="input-group" style="margin-bottom: 10px;">
                        <label>Next Step / Action</label>
                        <select id="action_${student.id}" onchange="handleActionChange('${student.id}')">${actionOptions}</select>
                    </div>
                    <div id="btn_area_${student.id}">
                        <button class="action-btn btn-promote" onclick="saveAction('${student.id}', '${course.id}', '${currentModule}')">💾 Save & Update Status</button>
                    </div>
                    <button id="cert_btn_${student.id}" class="action-btn btn-cert" style="display:none;" onclick="openCertModal('${student.id}', '${course.id}')">🎓 Generate Certificate</button>
                `;
                container.appendChild(card);
            });
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            renderStudents(allStudents.filter(s => s.full_name?.toLowerCase().includes(term) || s.register_number?.toLowerCase().includes(term)));
        });

        window.handleActionChange = function(studentId) {
            const actionVal = document.getElementById(`action_${studentId}`).value;
            document.getElementById(`cert_btn_${studentId}`).style.display = actionVal === 'COMPLETED' ? 'block' : 'none';
        };

        window.saveAction = async function(studentId, courseId, currentModule) {
            const marks = document.getElementById(`marks_${studentId}`).value, att = document.getElementById(`att_${studentId}`).value, actionVal = document.getElementById(`action_${studentId}`).value;
            if(!marks || !att) { alert("Enter Marks and Attendance."); return; }
            if(!actionVal) { alert("Select a Next Step."); return; }

            if(confirm(`Update this student's status?`)) {
                await supabase.from('exam_results').insert([{ student_id: studentId, course_id: courseId, module_name: currentModule, marks: Number(marks), attendance: Number(att) }]);
                if (actionVal === 'COMPLETED') {
                    await supabase.from('students').update({ status: 'completed' }).eq('id', studentId);
                    alert("Course Completed! Move to Directory to view.");
                } else {
                    await supabase.from('students').update({ module: actionVal }).eq('id', studentId);
                    alert("Promoted!");
                }
                fetchData();
            }
        };

        window.zoomCert = function(amount) {
            currentZoom += amount;
            if(currentZoom < 0.3) currentZoom = 0.3; if(currentZoom > 1.5) currentZoom = 1.5;
            document.getElementById('certificateRenderArea').style.transform = `scale(${currentZoom})`;
            document.getElementById('certViewport').style.width = `${700 * currentZoom}px`;
            document.getElementById('certViewport').style.height = `${990 * currentZoom}px`;
        };

        window.openCertModal = function(studentId, courseId) {
            const student = allStudents.find(s => s.id === studentId), course = allCourses.find(c => c.id === courseId);
            if(!student || !course) return; activeStudentData = { studentId, courseId };
            
            const today = new Date(), dateStr = today.getDate().toString().padStart(2, '0') + '-' + (today.getMonth()+1).toString().padStart(2, '0') + '-' + today.getFullYear();
            let fromDate = student.admission_date ? new Date(student.admission_date) : today;

            document.getElementById('f-serial').value = 'GM ' + Date.now().toString().slice(-7);
            document.getElementById('f-reg').value = student.register_number || 'REG N/A';
            document.getElementById('f-name').value = (student.full_name || '').toUpperCase();
            document.getElementById('f-course').value = (course.course_name || '').toUpperCase();
            document.getElementById('f-issue-date').value = dateStr; document.getElementById('f-exam-date').value = dateStr;
            document.getElementById('f-date-from').value = fromDate.getDate().toString().padStart(2, '0') + '-' + (fromDate.getMonth()+1).toString().padStart(2, '0') + '-' + fromDate.getFullYear();
            document.getElementById('f-date-to').value = dateStr;

            updateCert(); zoomCert(0); // Reset zoom layout
            document.getElementById('certModal').style.display = 'flex';
        };

        window.updateCert = function() {
            ['serial', 'reg', 'name', 'course', 'grade', 'issue-date', 'exam-date', 'date-from', 'date-to'].forEach(id => {
                document.getElementById(`c-${id}`).innerText = document.getElementById(`f-${id}`).value;
            });
        };

        window.closeModal = function() { document.getElementById('certModal').style.display = 'none'; };
        window.printCertificate = function() { window.print(); };

        window.shareCertificate = async function() {
            const btn = document.getElementById('shareBtn'), originalText = btn.innerHTML;
            btn.innerHTML = '⏳ Generating...'; btn.disabled = true;
            try {
                const wrapper = document.getElementById('certificateRenderArea'), oldTransform = wrapper.style.transform;
                wrapper.style.transform = 'scale(1)'; // Fix scale for render
                const canvas = await html2canvas(wrapper, { scale: 2, useCORS: true, backgroundColor: '#ffffff' });
                wrapper.style.transform = oldTransform; 

                canvas.toBlob(async (blob) => {
                    const name = document.getElementById('f-name').value.trim() || 'Student';
                    const file = new File([blob], `Certificate_${name}.png`, { type: 'image/png' });
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        try { await navigator.share({ files: [file], title: 'Certificate', text: `Certificate for ${name}` }); } catch (err) {}
                    } else {
                        const link = document.createElement('a'); link.download = `Certificate_${name}.png`; link.href = canvas.toDataURL('image/png'); link.click();
                    }
                    btn.innerHTML = originalText; btn.disabled = false;
                }, 'image/png');
            } catch (error) { alert("Error generating image."); btn.innerHTML = originalText; btn.disabled = false; }
        };

        window.saveDataAndClose = async function() {
            if(!activeStudentData) return;
            const marks = document.getElementById(`marks_${activeStudentData.studentId}`).value, att = document.getElementById(`att_${activeStudentData.studentId}`).value;
            if(marks && att) { await supabase.from('exam_results').insert([{ student_id: activeStudentData.studentId, course_id: activeStudentData.courseId, module_name: 'FINAL EXAM', marks: Number(marks), attendance: Number(att) }]); }
            await supabase.from('students').update({ status: 'completed' }).eq('id', activeStudentData.studentId);
            alert("Certificate Generated & Student Completed!"); closeModal(); fetchData();
        };

        checkAuth();
    </script>
</body>
</html>

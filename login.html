<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Your Firm</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        /* Fixed scrolling issue */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* Prevents scrolling */
        }
        body { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background-color: var(--primary-dark, #1e293b); 
        }
        .login-card { 
            background: var(--card-bg, #ffffff); 
            width: 90%; 
            max-width: 400px; 
            padding: 40px 24px; 
            border-radius: 24px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
            text-align: center; 
            box-sizing: border-box; /* Keeps padding inside width */
            max-height: 95vh; /* Ensures it doesn't overflow small screens */
            overflow-y: auto; /* Adds internal scroll ONLY if screen is very tiny */
        }
        .login-logo { 
            height: 100px; 
            margin-bottom: 16px; 
            border-radius: 8px; 
            object-fit: contain; 
        }
        .login-title { 
            font-size: 24px; 
            font-weight: 800; 
            color: var(--primary-dark, #1e293b); 
            margin-bottom: 8px; 
            line-height: 1.2;
        }
        .login-subtitle { 
            font-size: 14px; 
            color: var(--text-muted, #64748b); 
            margin-bottom: 30px; 
        }
        /* Custom Button Styling */
        .btn-custom {
            background-color: #3B82F6; /* Attractive Blue */
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn-custom:hover {
            background-color: #2563eb;
        }
        .btn-custom:active {
            transform: scale(0.98);
        }
        .btn-custom:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="assets/images/logo.png" alt="Globus Technical Academy Logo" class="login-logo" onerror="this.style.display='none'">
        
        <h1 class="login-title">Your institution</h1>
        <p class="login-subtitle">Sign in to access your dashboard</p>

        <form id="loginForm">
            <div class="form-group" style="text-align: left;">
                <label class="form-label">Email Address</label>
                <input type="email" id="email" class="form-control" required placeholder="admin@example.com">
            </div>
            <div class="form-group" style="text-align: left; margin-bottom: 24px;">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-control" required placeholder="••••••••">
            </div>
            
            <!-- Changed Text and Styling -->
            <button type="submit" class="btn-custom" id="loginBtn">Sign In</button>
        </form>
    </div>

    <script type="module">
        import { supabase } from './assets/js/supabase-config.js';

        supabase.auth.getSession().then(({ data: { session } }) => {
            if (session) window.location.href = 'dashboard.html';
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.textContent = 'Validating...'; btn.disabled = true;

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                alert('Login Failed: ' + error.message);
                btn.textContent = 'Sign In'; btn.disabled = false;
            } else {
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>

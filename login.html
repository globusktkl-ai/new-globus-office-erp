<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Dashboard</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        /* Fixed scrolling issue */
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        body { display: flex; justify-content: center; align-items: center; background-color: var(--primary-dark, #1e293b); }
        .login-card { background: var(--card-bg, #ffffff); width: 90%; max-width: 400px; padding: 40px 24px; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center; box-sizing: border-box; max-height: 95vh; overflow-y: auto; }
        .login-logo { height: 100px; margin-bottom: 16px; border-radius: 8px; object-fit: contain; }
        .login-subtitle { font-size: 14px; color: var(--text-muted, #64748b); margin-bottom: 30px; font-weight: 600; }
        
        .btn-custom { background-color: #3B82F6; color: white; border: none; padding: 14px 20px; border-radius: 8px; font-size: 15px; font-weight: 800; width: 100%; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 6px rgba(59, 130, 246, 0.3); }
        .btn-custom:hover { background-color: #2563eb; transform: translateY(-2px); }
        .btn-custom:active { transform: scale(0.98); }
        .btn-custom:disabled { background-color: #94a3b8; cursor: not-allowed; transform: none; box-shadow: none; }

        .btn-guest { background-color: transparent; color: #475569; border: 2px solid #cbd5e1; padding: 12px 20px; border-radius: 8px; font-size: 14px; font-weight: 800; width: 100%; cursor: pointer; transition: all 0.2s; margin-top: 15px; }
        .btn-guest:hover { background-color: #f8fafc; border-color: #94a3b8; color: #1e293b; }
        .btn-guest:active { transform: scale(0.98); }
        
        .divider { display: flex; align-items: center; text-align: center; margin: 20px 0 5px 0; color: #94a3b8; font-size: 12px; font-weight: 700; text-transform: uppercase; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #e2e8f0; }
        .divider:not(:empty)::before { margin-right: .5em; }
        .divider:not(:empty)::after { margin-left: .5em; }

        /* 🔥 NEW: Forgot Password Modal Styles 🔥 */
        #forgotModal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(15,23,42,0.9); z-index:100001; align-items:center; justify-content:center; backdrop-filter: blur(5px); }
        .modal-content { background: #ffffff; width: 90%; max-width: 400px; padding: 30px 24px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); text-align:center; animation: sheetUp 0.3s ease; }
        @keyframes sheetUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>

    <!-- 🔥 NEW: Forgot Password Modal 🔥 -->
    <div id="forgotModal">
        <div class="modal-content">
            <div style="background:#eff6ff; color:#3b82f6; width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 15px;">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" fill="none"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            </div>
            <h3 style="color:#1e293b; margin-top:0; font-weight:900;">Reset Password</h3>
            <p style="color:#64748b; font-size:13px; margin-bottom:20px; line-height:1.5;">Enter the email address associated with your account, and we'll send you a secure link to reset your password.</p>
            
            <input type="email" id="resetEmail" style="width: 100%; padding: 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; background: #f8fafc; box-sizing: border-box; margin-bottom: 20px; outline:none;" placeholder="Enter your email address">
            
            <div style="display:flex; gap:10px;">
                <button class="btn-custom" style="flex:1;" onclick="sendResetLink(event)">Send Recovery Link</button>
                <button class="btn-guest" style="flex:1; margin-top:0;" onclick="closeForgotModal()">Cancel</button>
            </div>
        </div>
    </div>

    <div class="login-card">
        <img src="assets/images/logo.png" alt="Institution Logo" class="login-logo" onerror="this.src='https://via.placeholder.com/150x100?text=LOGO'">
        <p class="login-subtitle" style="margin-top: 10px;">Sign in to access your dashboard</p>

        <form id="loginForm">
            <div class="form-group" style="text-align: left; margin-bottom: 15px;">
                <label class="form-label" style="font-size: 12px; font-weight: 700; color: #475569; margin-bottom: 5px; display: block;">Email Address</label>
                <input type="email" id="email" class="form-control" style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; background: #f8fafc; box-sizing: border-box; outline:none;" required placeholder="admin@example.com">
            </div>
            <div class="form-group" style="text-align: left; margin-bottom: 15px;">
                <label class="form-label" style="font-size: 12px; font-weight: 700; color: #475569; margin-bottom: 5px; display: block;">Password</label>
                <input type="password" id="password" class="form-control" style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; background: #f8fafc; box-sizing: border-box; outline:none;" required placeholder="••••••••">
            </div>
            
            <!-- 🔥 NEW: Forgot Password Link 🔥 -->
            <div style="text-align: right; margin-bottom: 20px; margin-top: -5px;">
                <a href="#" onclick="openForgotModal(event)" style="color: #3b82f6; font-size: 12px; font-weight: 800; text-decoration: none; transition: 0.2s;">Forgot Password?</a>
            </div>
            
            <button type="submit" class="btn-custom" id="loginBtn">Secure Sign In</button>
        </form>

        <div class="divider">OR</div>
        
        <button type="button" class="btn-guest" onclick="window.guestLogin()">👀 Explore as Guest (Demo)</button>
    </div>

    <!-- Global Theme & Guest Toggle Logic -->
    <script type="module" src="assets/js/theme-manager.js"></script>

    <script type="module">
        import { supabase } from './assets/js/supabase-config.js';

        // MAGIC ALERT OVERRIDE FOR LOGIN ERRORS
        window.alert = function(msg) {
            const oldBox = document.getElementById('customPromptBox'); 
            if (oldBox) oldBox.remove();
            const box = document.createElement('div'); 
            box.id = 'customPromptBox';
            
            let iconHtml = `<div style="background:#fee2e2; color:#ef4444; width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 15px;"><svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" fill="none"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg></div>`;
            
            if (msg.includes('✅') || msg.includes('sent')) {
                iconHtml = `<div style="background:#d1fae5; color:#10b981; width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 15px;"><svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" fill="none"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg></div>`;
            }

            box.style.cssText = `position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.85); z-index: 100000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px);`;
            box.innerHTML = `
                <div style="background: #ffffff; padding: 24px; border-radius: 16px; width: 90%; max-width: 320px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); text-align: center; animation: sheetUp 0.3s ease;">
                    ${iconHtml}
                    <div style="font-size: 15px; font-weight: 800; color: #0f172a; margin-bottom: 20px; white-space: pre-wrap; line-height: 1.5;">${msg}</div>
                    <button id="cAlertOk" style="width: 100%; padding: 12px; background: #3b82f6; color: #fff; border: none; border-radius: 10px; font-weight: 800; font-size: 14px; cursor: pointer; transition: 0.2s;">OK</button>
                </div>
            `;
            if(!document.querySelector('style#sheetUpAnim')){ document.head.insertAdjacentHTML('beforeend', '<style id="sheetUpAnim">@keyframes sheetUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}</style>'); }
            document.body.appendChild(box);
            document.getElementById('cAlertOk').onclick = () => box.remove();
        };

        // 🔥 NEW: PASSWORD RECOVERY LOGIC 🔥
        window.openForgotModal = function(e) {
            e.preventDefault();
            document.getElementById('resetEmail').value = document.getElementById('email').value; // Auto-fill if already typed
            document.getElementById('forgotModal').style.display = 'flex';
        };

        window.closeForgotModal = function() {
            document.getElementById('forgotModal').style.display = 'none';
        };

        window.sendResetLink = async function(e) {
            const emailInput = document.getElementById('resetEmail').value.trim();
            if(!emailInput) return alert('⚠️ Please enter your registered email address.');

            const btn = e.target;
            const originalText = btn.innerText;
            btn.innerText = 'Sending...'; btn.disabled = true;

            try {
                // Request Supabase to send the recovery email
                const { data, error } = await supabase.auth.resetPasswordForEmail(emailInput, {
                    redirectTo: window.location.origin + window.location.pathname.replace('login.html', 'settings.html'),
                });

                if (error) throw error;
                
                alert('✅ Password reset link has been sent! Please check your email inbox.');
                closeForgotModal();
            } catch (err) {
                alert('❌ Error: ' + err.message);
            } finally {
                btn.innerText = originalText; btn.disabled = false;
            }
        };

        // Check if already logged in
        const checkExistingSession = async () => {
            const { data: { session } } = await supabase.auth.getSession();
            const userRole = localStorage.getItem('userRole');
            if ((session && userRole) || userRole === 'Guest') {
                window.location.replace('dashboard.html');
            } else if (session && !userRole) {
                await supabase.auth.signOut();
                localStorage.clear();
            }
        };
        checkExistingSession();

        // 1. NORMAL LOGIN (Super Admin, Admin & Staff)
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.textContent = 'Validating...'; btn.disabled = true;

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            // Supabase Authentication
            const { data: authData, error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                alert('⚠️ Login Failed: Invalid Email or Password.');
                btn.textContent = 'Secure Sign In'; btn.disabled = false;
            } else {
                const superAdminEmail = 'vpk@vpk.com'; 
                let userRole = 'Office Staff'; // Default fallback
                
                // A. സൂപ്പർ അഡ്മിൻ ചെക്ക്
                if (email.toLowerCase() === superAdminEmail.toLowerCase()) {
                    userRole = 'Super Admin'; 
                } else {
                    // B. ഡാറ്റാബേസിൽ പോയി യഥാർത്ഥ റോൾ എടുക്കുന്നു
                    const { data: staffData } = await supabase.from('staff').select('role, status').eq('email', email).single();
                    
                    if (staffData) {
                        const currentStatus = (staffData.status || '').toLowerCase();
                        if (currentStatus !== 'active') {
                            alert('❌ Account Disabled: Your access has been revoked by the Administrator.');
                            await supabase.auth.signOut();
                            btn.textContent = 'Secure Sign In'; btn.disabled = false;
                            return;
                        }
                        if (staffData.role) { userRole = staffData.role; }
                    } else {
                        // Check if it is SaaS Client Admin (SaaS ടേബിളിൽ ഉണ്ടോ എന്ന് നോക്കുന്നു)
                        const { data: saasClient } = await supabase.from('saas_clients').select('id, is_active').ilike('admin_email', email).single();
                        
                        if (saasClient) {
                            if (!saasClient.is_active) {
                                alert('❌ Account Suspended: Your ERP subscription is currently inactive.');
                                await supabase.auth.signOut();
                                btn.textContent = 'Secure Sign In'; btn.disabled = false;
                                return;
                            }
                            userRole = 'Admin'; // Allocate Admin role to SaaS client
                        } else {
                            alert('❌ Account Error: Profile not found in the directory.');
                            await supabase.auth.signOut();
                            btn.textContent = 'Secure Sign In'; btn.disabled = false;
                            return;
                        }
                    }
                }

                // C. വിവരങ്ങൾ ബ്രൗസറിൽ സേവ് ചെയ്യുന്നു
                localStorage.setItem('userRole', userRole);
                localStorage.setItem('userEmail', email);
                localStorage.setItem('loginTime', Date.now());

                // ലോഗ് സേവ് ചെയ്യുന്നു
                if(window.ThemeManager) {
                    await window.ThemeManager.logAction('System', 'LOGIN', `User Logged In successfully`);
                }
                
                window.location.replace('dashboard.html');
            }
        });

        // 2. GUEST LOGIN (Read-Only Demo)
        window.guestLogin = function() {
            localStorage.setItem('userRole', 'Guest');
            localStorage.setItem('userEmail', 'guest@demo.com');
            localStorage.setItem('guestLoginTime', Date.now()); 
            
            window.location.replace('dashboard.html');
        };

        // ഡാറ്റാബേസിൽ നിന്ന് സെറ്റിംഗ്സ് വായിച്ച് ഗസ്റ്റ് ബട്ടൺ നിയന്ത്രിക്കുന്നു
        async function applySystemSettings() {
            try {
                const { data } = await supabase.from('institute_settings').select('theme_color, guest_login_enabled').eq('id', 1).single();
                if (data) {
                    if (data.theme_color) {
                        document.documentElement.style.setProperty('--primary-dark', data.theme_color);
                    }
                    const guestBtn = document.querySelector('.btn-guest');
                    const divider = document.querySelector('.divider');
                    if (guestBtn && divider) {
                        if (data.guest_login_enabled === false) {
                            guestBtn.style.display = 'none'; divider.style.display = 'none';
                        } else {
                            guestBtn.style.display = 'block'; divider.style.display = 'flex';
                        }
                    }
                }
            } catch (err) { console.error("Could not load settings", err); }
        }
        applySystemSettings();
    </script>
</body>
</html>

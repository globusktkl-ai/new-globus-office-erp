<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | New Globus Office ERP</title>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        /* ===== LOGIN CARD ===== */
        .login-container {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(26, 58, 92, 0.15);
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            transition: all 0.2s ease;
        }
        .login-container h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1A3A5C;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }
        .login-container .subtitle {
            color: #6b7a8d;
            font-size: 14px;
            margin-bottom: 32px;
            border-left: 3px solid #1A3A5C;
            padding-left: 12px;
        }
        /* ===== FORM ===== */
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #1A3A5C;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            transition: border-color 0.2s;
            background: #fafcff;
            color: #1e293b;
        }
        .form-group input:focus {
            outline: none;
            border-color: #1A3A5C;
            box-shadow: 0 0 0 3px rgba(26, 58, 92, 0.1);
            background: #ffffff;
        }
        /* ===== BUTTON ===== */
        .btn-login {
            width: 100%;
            padding: 14px;
            background: #1A3A5C;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 8px;
            letter-spacing: 0.3px;
        }
        .btn-login:hover {
            background: #0f2a44;
        }
        .btn-login:active {
            transform: scale(0.98);
        }
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        /* ===== MESSAGES ===== */
        #message {
            margin-top: 16px;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            display: none;
        }
        #message.error {
            display: block;
            background: #fee9e7;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }
        #message.success {
            display: block;
            background: #e6f7e6;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }
        /* ===== FOOTER ===== */
        .login-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
            border-top: 1px solid #f1f5f9;
            padding-top: 20px;
        }
        .login-footer a {
            color: #1A3A5C;
            text-decoration: none;
            font-weight: 500;
        }
        .login-footer a:hover {
            text-decoration: underline;
        }
        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .login-container {
                padding: 32px 20px;
            }
            .login-container h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h1>🔐 New Globus</h1>
        <div class="subtitle">Office ERP · Sign in to continue</div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="admin@newglobus.com" value="admin@newglobus.com" required />
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" value="admin123" required />
            </div>
            <button type="submit" class="btn-login" id="loginBtn">Sign In</button>
        </form>

        <div id="message"></div>

        <div class="login-footer">
            <p>🔒 Secure · Powered by Supabase</p>
        </div>
    </div>

    <script>
        // ============================================================
        // SUPABASE CONFIGURATION (REPLACE WITH YOUR OWN VALUES!)
        // ============================================================
        const SUPABASE_URL = 'https://YOUR_PROJECT_ID.supabase.co';
        const SUPABASE_ANON_KEY = 'YOUR_ANON_KEY';

        // Initialize Supabase Client
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ============================================================
        // DOM ELEMENTS
        // ============================================================
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const messageDiv = document.getElementById('message');

        // ============================================================
        // HELPER: Show message
        // ============================================================
        function showMessage(text, type = 'error') {
            messageDiv.textContent = text;
            messageDiv.className = type; // 'error' or 'success'
        }

        function clearMessage() {
            messageDiv.className = '';
            messageDiv.textContent = '';
            messageDiv.style.display = 'none';
        }

        // ============================================================
        // LOGIN HANDLER
        // ============================================================
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearMessage();

            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if (!email || !password) {
                showMessage('⚠️ Please fill in both email and password.', 'error');
                return;
            }

            // Disable button and show loading state
            loginBtn.disabled = true;
            loginBtn.textContent = 'Signing in...';

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (error) {
                    // Handle specific Supabase errors
                    if (error.message.includes('Invalid login credentials')) {
                        showMessage('❌ Invalid email or password. Please try again.', 'error');
                    } else if (error.message.includes('Email not confirmed')) {
                        showMessage('📧 Please confirm your email address first.', 'error');
                    } else {
                        showMessage('❌ ' + error.message, 'error');
                    }
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Sign In';
                    return;
                }

                // SUCCESS!
                if (data && data.session) {
                    showMessage('✅ Login successful! Redirecting...', 'success');
                    
                    // Save session info to localStorage (optional, but useful)
                    localStorage.setItem('supabaseSession', JSON.stringify(data.session));
                    
                    // Redirect to dashboard after a short delay
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    showMessage('⚠️ Unexpected response. Please try again.', 'error');
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Sign In';
                }

            } catch (err) {
                console.error('Login error:', err);
                showMessage('⚠️ Network error. Please check your connection.', 'error');
                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign In';
            }
        });

        // ============================================================
        // AUTO-REDIRECT if already logged in
        // ============================================================
        (async function checkSession() {
            try {
                const { data, error } = await supabase.auth.getSession();
                if (data && data.session) {
                    // User is already logged in, send them to dashboard
                    window.location.href = 'dashboard.html';
                }
            } catch (e) {
                // Silently ignore (no session)
                console.log('No active session.');
            }
        })();

        // Also check localStorage session backup
        // (This helps if the page reloads quickly)
        // ============================================================
    </script>
</body>
</html>

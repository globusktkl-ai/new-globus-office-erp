<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
        font-family:Arial,Helvetica,sans-serif;
        background:#f4f6f9;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
    }
    .card{
        width:100%;
        max-width:420px;
        background:#fff;
        border-radius:16px;
        padding:32px;
        box-shadow:0 8px 24px rgba(0,0,0,.12);
    }
    h1{
        color:#1a3a5c;
        margin-bottom:8px;
    }
    p{
        color:#666;
        margin-bottom:24px;
    }
    label{
        display:block;
        margin-bottom:6px;
        font-weight:600;
    }
    input{
        width:100%;
        padding:12px;
        border:1px solid #ddd;
        border-radius:10px;
        margin-bottom:16px;
    }
    button{
        width:100%;
        padding:12px;
        background:#1a3a5c;
        color:#fff;
        border:none;
        border-radius:10px;
        font-size:16px;
        cursor:pointer;
    }
    button:hover{
        background:#15304d;
    }
    #login-error{
        color:#c62828;
        margin-bottom:16px;
        min-height:20px;
    }
</style>
```

</head>
<body>

<div class="card">
    <h1>Office Login</h1>
    <p>Sign in to continue</p>

```
<div id="login-error"></div>

<form id="login-form">
    <label>Email</label>
    <input type="email" id="email" required>

    <label>Password</label>
    <input type="password" id="password" required>

    <button type="submit">Sign In</button>
</form>
```

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

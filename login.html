<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Globus Technical Academy</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body { 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; background-color: var(--primary-dark); margin: 0;
        }
        .login-card { 
            background: var(--card-bg); width: 90%; max-width: 400px; 
            padding: 40px 24px; border-radius: 24px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center; 
        }
        /* ലോഗോയുടെ വലിപ്പം കൂട്ടിയിട്ടുണ്ട് */
        .login-logo { 
            height: 100px; margin-bottom: 16px; border-radius: 8px; object-fit: contain; 
        }
        /* സ്ഥാപനത്തിന്റെ പേര് വ്യക്തമായി കാണാൻ */
        .login-title { 
            font-size: 24px; font-weight: 800; color: var(--primary-dark); 
            margin-bottom: 8px; line-height: 1.2;
        }
        /* പുതിയ ഉപയോക്താക്കൾക്കും യോജിച്ച വാചകം */
        .login-subtitle { 
            font-size: 14px; color: var(--text-muted); margin-bottom: 30px; 
        }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="assets/images/logo.png" alt="Globus Technical Academy Logo" class="login-logo" onerror="this.style.display='none'">
        
        <h1 class="login-title">Globus Technical Academy</h1>
        <p class="login-subtitle">Sign in to access your dashboard</p>

        <form id="loginForm">
            <div class="form-group" style="text-align: left;">
                <label class="form-label">Email Address</label>
                <input type="email" id="email" class="form-control" required placeholder="admin@example.com">
            </div>
            <div class="form-group" style="text-align: left; margin-bottom: 24px;">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-control" required placeholder="••••••••">
            </div>
            
            <button type="submit" class="btn btn-primary" id="loginBtn">Sign In securely</button>
        </form>
    </div>

    <script type="module">
        import { supabase } from './assets/js/supabase-config.js';

        supabase.auth.getSession().then(({ data: { session } }) => {
            if (session) window.location.href = 'dashboard.html';
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.textContent = 'Authenticating...'; btn.disabled = true;

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                alert('Login Failed: ' + error.message);
                btn.textContent = 'Sign In securely'; btn.disabled = false;
            } else {
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>

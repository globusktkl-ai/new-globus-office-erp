<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Enquiry & Leads - ERP</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
        body{background:#f1f5f9;min-height:100vh;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;overflow-x:hidden;padding-bottom:80px}
        .main-content{padding:12px;max-width:800px;margin:0 auto;width:100%}

        /* Top Nav - Flex Layout */
        .top-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;border-bottom:2px solid #e2e8f0;padding-bottom:14px;min-height:45px}
        .btn-back-3d { display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 38px; background: linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%); border: 1px solid #cbd5e1; border-bottom: 3px solid #94a3b8; border-radius: 10px; transition: all 0.1s; flex-shrink: 0; }
        .btn-back-3d:active { transform: translateY(2px); border-bottom: 1px solid #94a3b8; }
        .btn-back-3d svg { width: 22px; height: 22px; stroke: #4c1d95; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .page-title{font-size:16px;font-weight:900;color:#0f172a;text-transform:uppercase;letter-spacing:-.3px;text-align:right;margin:0;flex:1;}

        /* Bottom Tab Bar */
        .bottom-tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e2e8f0;display:flex;z-index:90;box-shadow:0 -4px 16px rgba(15,23,42,.06);padding:6px 8px 10px}
        .btab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border:none;background:none;cursor:pointer;border-radius:10px;transition:.2s;font-size:10px;font-weight:700;color:#94a3b8}
        .btab svg{width:22px;height:22px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:.2s}
        .btab.active{color:#d97706;background:rgba(245,158,11,.08)}
        .btab.active svg{stroke:#d97706;stroke-width:2.5}
        .btab:active{transform:scale(.92)}

        /* Tab Panels */
        .tab-panel{display:none;animation:fadeUp .25s ease}
        .tab-panel.active{display:block}
        @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

        /* Form Elements */
        .card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 4px 14px rgba(15,23,42,.04)}
        .card-title{font-size:15px;font-weight:900;color:#0f172a;margin-bottom:14px;display:flex;align-items:center;gap:8px}
        .card-title svg{width:20px;height:20px;stroke:currentColor;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

        .frm-label{font-size:10px;font-weight:800;color:#475569;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;display:block}
        .frm-select,.frm-input{width:100%;padding:11px 12px;border:1.5px solid #cbd5e1;border-radius:10px;font-size:14px;font-weight:600;outline:none;background:#f8fafc;transition:.2s;margin-bottom:12px;-webkit-appearance:none;appearance:none}
        .frm-select:focus,.frm-input:focus{border-color:#d97706;box-shadow:0 0 0 3px rgba(245,158,11,.1);background:#fff}
        .frm-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-bottom:12px}
        
        .btn-primary{width:100%;padding:13px;border:none;border-radius:10px;font-size:14px;font-weight:800;cursor:pointer;color:#fff;background:linear-gradient(135deg,#f59e0b,#d97706);box-shadow:0 4px 12px rgba(245,158,11,.25);transition:.2s;display:flex;align-items:center;justify-content:center;gap:6px;}
        .btn-primary:active{transform:scale(.97)}

        /* Enquiry Cards */
        .enq-card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(15,23,42,.03); position:relative;}
        .enq-header{display:flex;justify-content:space-between;align-items:flex-start; margin-bottom: 10px;}
        .enq-name{font-size:15px;font-weight:900;color:#0f172a;}
        .enq-course{font-size:11px;font-weight:700;color:#475569;margin-top:2px;}
        
        /* Status Badges */
        .status-badge{font-size:9px;font-weight:800;padding:4px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:0.5px;}
        .st-pending{background:#fef3c7;color:#b45309;border:1px solid #fde68a;}
        .st-followup{background:#dbeafe;color:#1d4ed8;border:1px solid #bfdbfe;}
        .st-converted{background:#dcfce7;color:#15803d;border:1px solid #86efac;}
        .st-dropped{background:#fee2e2;color:#dc2626;border:1px solid #fca5a5;}
        
        .enq-meta{font-size:11px;color:#64748b;font-weight:600;margin-bottom:12px;background:#f8fafc;padding:6px;border-radius:6px;}
        
        /* Action Buttons Row */
        .action-row{display:flex;gap:8px;}
        .act-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;padding:8px;border-radius:8px;font-size:12px;font-weight:800;cursor:pointer;border:none;transition:.2s;text-decoration:none;}
        .act-btn:active{transform:scale(.95);}
        .act-whatsapp{background:#ecfccb;color:#166534;}
        .act-call{background:#e0f2fe;color:#0369a1;}
        .act-edit{background:#f1f5f9;color:#334155;border:1px solid #cbd5e1;}

        /* Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.85); z-index: 1000; justify-content: center; align-items: center; padding: 15px; backdrop-filter: blur(4px); }
        .modal-container { background: #fff; width: 100%; max-width: 400px; border-radius: 14px; padding: 20px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        
        .empty-state{text-align:center;padding:40px 20px;color:#94a3b8;font-weight:700;font-size:13px;background:#fff;border-radius:12px;border:1px dashed #cbd5e1;}

        .summary-banner { display:flex; justify-content:space-between; background:linear-gradient(135deg, #fef3c7, #fde68a); padding:12px 15px; border-radius:10px; margin-bottom:12px; border:1px solid #fcd34d; }
        .sb-item { display:flex; flex-direction:column; align-items:center; }
        .sb-val { font-size:18px; font-weight:900; color:#b45309; }
        .sb-label { font-size:9px; font-weight:800; color:#92400e; text-transform:uppercase; letter-spacing:0.5px; }

    </style>
</head>
<body>

    <main class="main-content">
        <!-- TOP NAV -->
        <div class="top-nav" style="position: relative; justify-content: center;">
            <a href="dashboard.html" class="btn-back-3d" style="position: absolute; left: 0;">
                <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>
            </a>
            <h1 class="page-title" style="text-align: center; flex: none;">ENQUIRY & LEADS</h1>
        </div>

        <!-- TAB 1: ENQUIRY LIST -->
        <div id="panel-list" class="tab-panel active">
            
            <div class="summary-banner">
                <div class="sb-item"><span class="sb-val" id="sumTotal">0</span><span class="sb-label">Total Leads</span></div>
                <div class="sb-item"><span class="sb-val" style="color:#1d4ed8" id="sumFollow">0</span><span class="sb-label" style="color:#1e3a8a">Follow-Ups</span></div>
                <div class="sb-item"><span class="sb-val" style="color:#15803d" id="sumConverted">0</span><span class="sb-label" style="color:#166534">Admissions</span></div>
            </div>

            <div style="display:flex;gap:8px;margin-bottom:12px;">
                <input type="text" id="searchLead" class="frm-input" placeholder="Search name or phone..." style="margin-bottom:0;" oninput="renderLeads()">
                <select id="filterStatus" class="frm-select" style="margin-bottom:0;width:120px;flex-shrink:0;" onchange="renderLeads()">
                    <option value="All">All Leads</option>
                    <option value="Pending">Pending</option>
                    <option value="Follow-up">Follow-up</option>
                    <option value="Converted">Converted</option>
                    <option value="Dropped">Dropped</option>
                </select>
            </div>
            
            <div id="leadsContainer">
                <div style="text-align:center;padding:20px;">Loading leads...</div>
            </div>
        </div>

        <!-- TAB 2: NEW ENQUIRY -->
        <div id="panel-add" class="tab-panel">
            <div class="card">
                <div class="card-title" style="color:#d97706">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
                    New Enquiry Registration
                </div>
                
                <form onsubmit="handleAddLead(event)">
                    <label class="frm-label">Full Name</label>
                    <input type="text" id="leadName" class="frm-input" placeholder="Enter student name" required>
                    
                    <label class="frm-label">Phone Number (WhatsApp)</label>
                    <input type="tel" id="leadPhone" class="frm-input" placeholder="10 Digit Mobile Number" maxlength="10" oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,10)" required>
                    
                    <label class="frm-label">Interested Course</label>
                    <select id="leadCourse" class="frm-select" required>
                        <option value="">-- Select Course --</option>
                        <!-- Populated dynamically -->
                    </select>

                    <div class="frm-row">
                        <div>
                            <label class="frm-label">Status</label>
                            <select id="leadStatus" class="frm-select" onchange="toggleFollowUpDate('add')">
                                <option value="Pending">Pending</option>
                                <option value="Follow-up">Follow-up Needed</option>
                                <option value="Converted">Converted to Admission</option>
                                <option value="Dropped">Dropped / Not Interested</option>
                            </select>
                        </div>
                        <div id="addDateWrap" style="display:none;">
                            <label class="frm-label">Follow-up Date</label>
                            <input type="date" id="leadDate" class="frm-input">
                        </div>
                    </div>

                    <label class="frm-label">Remarks / Notes</label>
                    <input type="text" id="leadRemarks" class="frm-input" placeholder="Any specific requirements or notes...">

                    <button type="submit" class="btn-primary" id="addBtn">💾 Save Enquiry</button>
                </form>
            </div>
        </div>

        <!-- TAB 3: TODAY'S FOLLOW-UPS -->
        <div id="panel-followups" class="tab-panel">
            <h3 style="font-size:13px;font-weight:900;color:#1d4ed8;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:6px;">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                Today's Calls & Follow-ups
            </h3>
            <div id="followupsContainer">
                <div style="text-align:center;padding:20px;">Loading...</div>
            </div>
        </div>

    </main>

    <!-- UPDATE STATUS MODAL -->
    <div id="statusModal" class="modal-overlay">
        <div class="modal-container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 style="margin: 0; color: #1e3a8a; font-size:16px;">Update Lead Status</h3>
                <button onclick="closeModal()" style="background: red; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-weight:bold;">X</button>
            </div>
            
            <p id="modalLeadName" style="font-size:14px;font-weight:900;color:#0f172a;margin-bottom:15px;"></p>
            
            <form onsubmit="handleStatusUpdate(event)">
                <input type="hidden" id="modalLeadId">
                
                <label class="frm-label">New Status</label>
                <select id="modalStatus" class="frm-select" onchange="toggleFollowUpDate('modal')">
                    <option value="Pending">Pending</option>
                    <option value="Follow-up">Follow-up Needed</option>
                    <option value="Converted">Converted to Admission</option>
                    <option value="Dropped">Dropped / Not Interested</option>
                </select>
                
                <div id="modalDateWrap" style="display:none;">
                    <label class="frm-label">Next Follow-up Date</label>
                    <input type="date" id="modalDate" class="frm-input">
                </div>
                
                <label class="frm-label">Remarks / Notes</label>
                <input type="text" id="modalRemarks" class="frm-input" placeholder="Add latest update...">
                
                <button type="submit" class="btn-primary" id="modalBtn" style="margin-top:10px;">Update Lead</button>
            </form>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-tabs">
        <button class="btab active" onclick="switchTab('list')">
            <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            All Leads
        </button>
        <button class="btab" onclick="switchTab('add')">
            <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
            New Enquiry
        </button>
        <button class="btab" onclick="switchTab('followups')">
            <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            Follow-ups
        </button>
    </nav>

    <script type="module">
        import { supabase } from './assets/js/supabase-config.js';

        // ==========================================
        // NEW MAGIC ALERT OVERRIDE FOR ALL WARNINGS AND ERRORS
        // ==========================================
        window.alert = function(msg) {
            const oldBox = document.getElementById('customPromptBox'); 
            if (oldBox) oldBox.remove();
            const box = document.createElement('div'); 
            box.id = 'customPromptBox';
            
            let iconHtml = `<div style="background:#dbeafe; color:#2563eb; width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 15px;"><svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" fill="none"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg></div>`;
            
            if(msg.includes('⚠️') || msg.includes('❌') || msg.includes('Error') || msg.includes('disabled') || msg.includes('failed')) {
                iconHtml = `<div style="background:#fee2e2; color:#ef4444; width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 15px;"><svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" fill="none"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg></div>`;
            } else if (msg.includes('✅') || msg.includes('success') || msg.includes('Successfully') || msg.includes('Added') || msg.includes('deleted')) {
                iconHtml = `<div style="background:#d1fae5; color:#10b981; width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 15px;"><svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" fill="none"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg></div>`;
            }

            box.style.cssText = `position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.85); z-index: 100000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px);`;
            box.innerHTML = `
                <div style="background: #ffffff; padding: 24px; border-radius: 16px; width: 90%; max-width: 320px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); text-align: center; animation: sheetUp 0.3s ease;">
                    ${iconHtml}
                    <div style="font-size: 15px; font-weight: 800; color: #0f172a; margin-bottom: 20px; white-space: pre-wrap; line-height: 1.5;">${msg}</div>
                    <button id="cAlertOk" style="width: 100%; padding: 12px; background: #3b82f6; color: #fff; border: none; border-radius: 10px; font-weight: 800; font-size: 14px; cursor: pointer; transition: 0.2s;">OK, Got it</button>
                </div>
            `;
            if(!document.querySelector('style#sheetUpAnim')){ document.head.insertAdjacentHTML('beforeend', '<style id="sheetUpAnim">@keyframes sheetUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}</style>'); }
            document.body.appendChild(box);
            document.getElementById('cAlertOk').onclick = () => box.remove();
        };

        // ==========================================
        // NEW MAGIC PROMPT FOR VERIFICATIONS
        // ==========================================
        window.magicPrompt = function(msg) {
            return new Promise((resolve) => {
                const oldBox = document.getElementById('customPromptBox');
                if (oldBox) oldBox.remove();
                
                const box = document.createElement('div');
                box.id = 'customPromptBox';
                box.style.cssText = `position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.85); z-index: 100000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px);`;
                
                box.innerHTML = `
                    <div style="background: #ffffff; padding: 24px; border-radius: 16px; width: 90%; max-width: 320px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); text-align: center; animation: sheetUp 0.3s ease;">
                        <div style="font-size: 15px; font-weight: 800; color: #0f172a; margin-bottom: 16px; white-space: pre-wrap; line-height: 1.5;">${msg}</div>
                        <input type="number" id="cPromptInput" style="width: 100%; padding: 12px; border: 2px solid #cbd5e1; border-radius: 10px; font-size: 20px; font-weight: 900; text-align: center; margin-bottom: 20px; outline: none; color: #1e293b;" autocomplete="off">
                        <div style="display: flex; gap: 12px;">
                            <button id="cPromptCancel" style="flex: 1; padding: 12px; background: #f1f5f9; color: #475569; border: none; border-radius: 10px; font-weight: 800; font-size: 14px; cursor: pointer;">Cancel</button>
                            <button id="cPromptOk" style="flex: 1; padding: 12px; background: #dc2626; color: #fff; border: none; border-radius: 10px; font-weight: 800; font-size: 14px; cursor: pointer;">Verify</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(box);
                
                const input = document.getElementById('cPromptInput');
                input.focus();
                
                document.getElementById('cPromptCancel').onclick = () => { box.remove(); resolve(null); };
                document.getElementById('cPromptOk').onclick = () => { box.remove(); resolve(input.value); };
                input.addEventListener('keypress', (e) => { if (e.key === 'Enter') document.getElementById('cPromptOk').click(); });
            });
        };

        let leadsData = [];
        let coursesData = [];

        async function init() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return; }
            
            await fetchData();
        }

        async function fetchData() {
            try {
                const [lRes, cRes] = await Promise.all([
                    supabase.from('enquiries').select('*').order('created_at', { ascending: false }),
                    supabase.from('courses').select('course_name').eq('status', 'Active')
                ]);
                
                leadsData = lRes.data || [];
                coursesData = cRes.data || [];
                
                // Populate Courses Dropdown
                const cSelect = document.getElementById('leadCourse');
                cSelect.innerHTML = '<option value="">-- Select Course --</option>';
                coursesData.forEach(c => {
                    cSelect.add(new Option(c.course_name, c.course_name));
                });
                
                updateSummary();
                renderLeads();
                renderFollowups();
            } catch(e) {
                console.error("Fetch Error:", e);
                alert("❌ Error loading data");
            }
        }

        window.switchTab = function(tab) {
            document.querySelectorAll('.btab').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            
            const activeBtn = document.querySelector(`.btab[onclick="switchTab('${tab}')"]`);
            if(activeBtn) activeBtn.classList.add('active');
            
            const panel = document.getElementById('panel-' + tab);
            if(panel) panel.classList.add('active');
        };

        function updateSummary() {
            document.getElementById('sumTotal').innerText = leadsData.length;
            document.getElementById('sumFollow').innerText = leadsData.filter(l => l.status === 'Follow-up').length;
            document.getElementById('sumConverted').innerText = leadsData.filter(l => l.status === 'Converted').length;
        }

        window.toggleFollowUpDate = function(context) {
            const status = document.getElementById(context === 'add' ? 'leadStatus' : 'modalStatus').value;
            const wrap = document.getElementById(context === 'add' ? 'addDateWrap' : 'modalDateWrap');
            const dateInput = document.getElementById(context === 'add' ? 'leadDate' : 'modalDate');
            
            if(status === 'Follow-up') {
                wrap.style.display = 'block';
                if(!dateInput.value) {
                    let tomorrow = new Date();
                    tomorrow.setDate(tomorrow.getDate() + 1);
                    dateInput.value = tomorrow.toISOString().split('T')[0];
                }
                dateInput.required = true;
            } else {
                wrap.style.display = 'none';
                dateInput.required = false;
            }
        };

        function getStatusBadge(status) {
            let cls = '';
            if(status === 'Pending') cls = 'st-pending';
            else if(status === 'Follow-up') cls = 'st-followup';
            else if(status === 'Converted') cls = 'st-converted';
            else if(status === 'Dropped') cls = 'st-dropped';
            return `<span class="status-badge ${cls}">${status}</span>`;
        }

        function renderLeadCard(lead) {
            let followText = lead.status === 'Follow-up' && lead.follow_up_date ? ` • Follow-up: ${new Date(lead.follow_up_date).toLocaleDateString('en-IN')}` : '';
            let dateStr = new Date(lead.created_at).toLocaleDateString('en-IN', {day:'numeric', month:'short'});
            
            return `
            <div class="enq-card">
                <div class="enq-header">
                    <div>
                        <div class="enq-name">${lead.full_name}</div>
                        <div class="enq-course">📘 ${lead.course_name}</div>
                    </div>
                    <div>${getStatusBadge(lead.status)}</div>
                </div>
                
                <div class="enq-meta">
                    📅 Enquired: ${dateStr}${followText}<br>
                    📝 Notes: ${lead.remarks || 'None'}
                </div>
                
                <div class="action-row">
                    <a href="https://wa.me/91${lead.phone}" target="_blank" class="act-btn act-whatsapp">
                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg Chat
                    </a>
                    <a href="tel:${lead.phone}" class="act-btn act-call">
                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg> Call
                    </a>
                    <button onclick="openModal('${lead.id}')" class="act-btn act-edit">
                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg> Edit
                    </button>
                    <button onclick="deleteLead('${lead.id}')" class="act-btn" style="background:#fee2e2; color:#dc2626; border:1px solid #fca5a5; max-width: 40px;" title="Delete">
                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                    </button>
                </div>
            </div>`;
        }

        window.renderLeads = function() {
            const search = document.getElementById('searchLead').value.toLowerCase();
            const statusFilter = document.getElementById('filterStatus').value;
            const container = document.getElementById('leadsContainer');

            let filtered = leadsData.filter(l => {
                const matchSearch = l.full_name.toLowerCase().includes(search) || l.phone.includes(search);
                const matchStatus = statusFilter === 'All' || l.status === statusFilter;
                return matchSearch && matchStatus;
            });

            if(filtered.length === 0) {
                container.innerHTML = '<div class="empty-state">No leads found matching criteria.</div>';
                return;
            }

            container.innerHTML = filtered.map(lead => renderLeadCard(lead)).join('');
        };

        window.renderFollowups = function() {
            const container = document.getElementById('followupsContainer');
            const todayStr = new Date().toISOString().split('T')[0];
            
            // Filter leads that need follow up today or are overdue
            let followups = leadsData.filter(l => 
                l.status === 'Follow-up' && l.follow_up_date && l.follow_up_date <= todayStr
            );

            if(followups.length === 0) {
                container.innerHTML = '<div class="empty-state">🎉 Great! No pending follow-ups for today.</div>';
                return;
            }

            container.innerHTML = followups.map(lead => renderLeadCard(lead)).join('');
        };

        window.handleAddLead = async function(e) {
            e.preventDefault();
            if (localStorage.getItem('userRole') === 'Guest') { alert("⚠️ This action is disabled in Guest/Demo mode. You cannot add new enquiries."); return; }

            const btn = document.getElementById('addBtn');
            btn.innerHTML = '⏳ Saving...'; btn.disabled = true;

            const status = document.getElementById('leadStatus').value;
            const newLead = {
                full_name: document.getElementById('leadName').value,
                student_name: document.getElementById('leadName').value, /* പഴയ ഡാറ്റാബേസ് എറർ ഒഴിവാക്കാൻ */
                phone: document.getElementById('leadPhone').value,
                course_name: document.getElementById('leadCourse').value,
                status: status,
                follow_up_date: status === 'Follow-up' ? document.getElementById('leadDate').value : null,
                remarks: document.getElementById('leadRemarks').value
            };

            try {
                const { error } = await supabase.from('enquiries').insert([newLead]);
                if(error) throw error;
                
                alert("✅ Lead Added Successfully!");
                e.target.reset();
                document.getElementById('addDateWrap').style.display = 'none';
                await fetchData();
                switchTab('list');
            } catch(err) {
                alert("❌ Error: " + err.message);
            } finally {
                btn.innerHTML = '💾 Save Enquiry'; btn.disabled = false;
            }
        };

        window.deleteLead = async function(id) {
            if (localStorage.getItem('userRole') === 'Guest') { alert("⚠️ This action is disabled in Guest/Demo mode."); return; }
            
            let n1 = Math.floor(Math.random() * 10) + 1;
            let n2 = Math.floor(Math.random() * 10) + 1;
            let ans = await window.magicPrompt(`⚠️ Security Verification\nTo delete this lead, solve:\n\n${n1} + ${n2} = ?`);
            
            if (ans !== null && parseInt(ans) === (n1+n2)) {
                try {
                    const { error } = await supabase.from('enquiries').delete().eq('id', id);
                    if(error) throw error;
                    alert("✅ Lead deleted successfully!");
                    await fetchData();
                } catch(err) {
                    alert("❌ Error deleting lead.");
                    console.error(err);
                }
            } else if (ans !== null) {
                alert('❌ Verification failed! Action aborted.');
            }
        };

        window.openModal = function(id) {
            const lead = leadsData.find(l => l.id === id);
            if(!lead) return;

            document.getElementById('modalLeadId').value = id;
            document.getElementById('modalLeadName').innerText = `👤 ${lead.full_name} (${lead.phone})`;
            document.getElementById('modalStatus').value = lead.status;
            document.getElementById('modalRemarks').value = lead.remarks || '';
            
            const dateWrap = document.getElementById('modalDateWrap');
            const dateInput = document.getElementById('modalDate');
            if(lead.status === 'Follow-up') {
                dateWrap.style.display = 'block';
                dateInput.value = lead.follow_up_date || '';
                dateInput.required = true;
            } else {
                dateWrap.style.display = 'none';
                dateInput.value = '';
                dateInput.required = false;
            }
            
            document.getElementById('statusModal').style.display = 'flex';
        };

        window.closeModal = function() {
            document.getElementById('statusModal').style.display = 'none';
        };

        window.handleStatusUpdate = async function(e) {
            e.preventDefault();
            if (localStorage.getItem('userRole') === 'Guest') { alert("⚠️ This action is disabled in Guest/Demo mode."); return; }

            const id = document.getElementById('modalLeadId').value;
            const status = document.getElementById('modalStatus').value;
            const remarks = document.getElementById('modalRemarks').value;
            const fDate = document.getElementById('modalDate').value;

            const btn = document.getElementById('modalBtn');
            btn.innerHTML = '⏳ Updating...'; btn.disabled = true;

            const updates = {
                status: status,
                remarks: remarks,
                follow_up_date: status === 'Follow-up' ? fDate : null
            };

            try {
                const { error } = await supabase.from('enquiries').update(updates).eq('id', id);
                if(error) throw error;

                alert(`✅ Lead updated successfully!`);
                closeModal();
                await fetchData();
            } catch(err) {
                alert("❌ Error: " + err.message);
            } finally {
                btn.innerHTML = 'Update Lead'; btn.disabled = false;
            }
        };

        init();
   </script>

    <!-- THE NEW DYNAMIC SECURITY SYSTEM -->
    <script type="module">
        import './assets/js/auth-check.js';
        window.checkDynamicAccess('Enquiry');
    </script>

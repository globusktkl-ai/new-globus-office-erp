<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>New Admission - Globus Technical Academy</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    
    <nav class="app-header">
        <div class="header-left" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px;">
            <img src="assets/images/logo.png" class="logo-small" alt="Logo" onerror="this.style.display='none'">
            <div style="display: flex; flex-direction: column; overflow: hidden;">
                <span class="brand-top" style="font-size: 16px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Globus</span>
                <span class="brand-bottom" style="text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Technical Academy</span>
            </div>
        </div>
        
        <div class="header-right" style="flex-shrink: 0; margin-left: 10px;">
            <button class="btn-logout-custom" id="logoutBtn">Logout</button>
        </div>
    </nav>
    
    <main class="main-content">
        <div class="form-card">
            <h2 style="font-size: 18px; margin-bottom: 20px; color: var(--primary-dark);">New Student Admission</h2>
            
            <form id="admissionForm">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" id="fullName" class="form-control" required placeholder="Enter student name">
                </div>
                
                <div class="form-group">
                    <label class="form-label">Register Number</label>
                    <input type="text" id="regNo" class="form-control" required placeholder="e.g. GTA-001">
                </div>
                
                <div class="form-group">
                    <label class="form-label">Phone Number</label>
                    <input type="tel" id="phone" class="form-control" required placeholder="10-digit mobile number">
                </div>

                <!-- വിദ്യാഭ്യാസ യോഗ്യത ചേർക്കാനുള്ള ബോക്സ് (ഒരു വരിയിൽ മുഴുവനായി) -->
                <div class="form-group">
                    <label class="form-label">Educational Qualification</label>
                    <input type="text" id="qualification" class="form-control" required placeholder="e.g. Plus Two / Degree / Diploma">
                </div>
                
                <div class="form-group">
                    <label class="form-label">Gender</label>
                    <select id="gender" class="form-control" required>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>

                <!-- ഫോട്ടോ അപ്‌ലോഡ് ചെയ്യാനുള്ള ബോക്സ് (ഒരു വരിയിൽ മുഴുവനായി) -->
                <div class="form-group">
                    <label class="form-label">Student Photo</label>
                    <input type="file" id="photoFile" class="form-control" accept="image/*">
                </div>
                
                <div class="form-group">
                    <label class="form-label">Select Course</label>
                    <select id="courseSelect" class="form-control" required>
                        <option value="">-- Select Course --</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Total Course Fee (₹)</label>
                    <input type="number" id="totalFee" class="form-control" required placeholder="e.g. 15000">
                </div>
                
                <div class="form-group" style="margin-bottom: 24px;">
                    <label class="form-label">Admission Fee Paid (₹)</label>
                    <input type="number" id="admissionFee" class="form-control" required placeholder="Amount paid during admission">
                </div>
                
                <button type="submit" class="btn btn-primary" id="submitBtn">Submit Admission</button>
            </form>
            
            <div style="text-align: center; margin-top: 20px;">
                <a href="dashboard.html" style="color: var(--primary-light); text-decoration: none; font-weight: 600;">Return to Dashboard</a>
            </div>
        </div>
    </main>

    <script type="module">
        import { supabase } from './assets/js/supabase-config.js';

        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return; }
            fetchCourses();
        }

        async function fetchCourses() {
            const { data } = await supabase.from('courses').select('id, course_name').eq('status', 'active');
            if (data) {
                const select = document.getElementById('courseSelect');
                data.forEach(c => select.add(new Option(c.course_name, c.id)));
            }
        }

        document.getElementById('admissionForm').addEventListener('submit', async (e) => {
            e.preventDefault(); 
            const btn = document.getElementById('submitBtn');
            btn.textContent = 'Processing...'; btn.disabled = true;

            let photoUrl = '';
            const fileInput = document.getElementById('photoFile');
            
            try {
                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    const fileName = `${Date.now()}_${file.name}`;
                    const { data: uploadData, error: uploadError } = await supabase.storage.from('student-photos').upload(fileName, file);
                    if (uploadError) throw uploadError;
                    
                    const { data: publicUrlData } = supabase.storage.from('student-photos').getPublicUrl(fileName);
                    photoUrl = publicUrlData.publicUrl;
                }

                const { error } = await supabase.from('students').insert([{
                    full_name: document.getElementById('fullName').value,
                    register_number: document.getElementById('regNo').value,
                    phone_number: document.getElementById('phone').value,
                    qualification: document.getElementById('qualification').value,
                    gender: document.getElementById('gender').value,
                    photo_url: photoUrl,
                    course_id: document.getElementById('courseSelect').value,
                    total_fee: document.getElementById('totalFee').value,
                    admission_fee: document.getElementById('admissionFee').value,
                    status: 'active'
                }]);

                if (error) throw error;

                alert('Admission Successful!'); 
                window.location.href = 'dashboard.html'; 
            } catch (err) {
                alert('Error: ' + err.message);
                btn.textContent = 'Submit Admission'; 
                btn.disabled = false;
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => { 
            await supabase.auth.signOut(); localStorage.clear(); sessionStorage.clear();
            window.history.replaceState(null, '', 'login.html'); window.location.replace('login.html'); 
        });

        checkAuth();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>New Admission - Globus Technical Academy</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .app-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; }
        .header-left-group { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
        .btn-back-glass { display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; text-decoration: none; font-size: 24px; font-weight: bold; color: var(--primary-dark); background: rgba(220, 226, 235, 0.4); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.6); border-radius: 50%; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); flex-shrink: 0; transition: 0.3s; }
        .btn-back-glass:hover { transform: scale(1.05); }
        .logo-small { height: 32px; border-radius: 4px; flex-shrink: 0; }
        .header-brand-title { font-size: 15px; font-weight: 700; color: var(--primary-dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .header-right { flex-shrink: 0; margin-left: 10px; }
        .btn-logout-custom { padding: 8px 24px; font-size: 14px; font-weight: 600; color: #fff; background: #EF4444; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 2px 6px rgba(239, 68, 68, 0.3); }
    </style>
</head>
<body>
    <nav class="app-header">
        <div class="header-left-group">
            <a href="dashboard.html" class="btn-back-glass">←</a>
            <img src="assets/images/logo.png" class="logo-small" alt="Logo" onerror="this.style.display='none'">
            <span class="header-brand-title">Globus Technical Academy</span>
        </div>
        <div class="header-right">
            <button class="btn-logout-custom" id="logoutBtn">Logout</button>
        </div>
    </nav>
    
    <!-- നിങ്ങളുടെ പഴയ <main class="main-content"> ഉം ഫീൽഡുകളും ഇതിനു താഴെ നിലനിർത്തുക -->

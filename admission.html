<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>New Admission - Globus Technical Academy</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .btn-submit-custom {
            background-color: var(--app-theme-color, #3B82F6); color: white; border: none; padding: 14px 20px;
            border-radius: 8px; font-size: 16px; font-weight: bold; width: 100%;
            cursor: pointer; transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 6px rgba(var(--app-theme-rgb, 59, 130, 246), 0.3); margin-top: 10px;
        }
        .btn-submit-custom:hover { filter: brightness(0.9); }
        .btn-submit-custom:active { transform: scale(0.98); }
        .btn-submit-custom:disabled { background-color: #94a3b8; cursor: not-allowed; box-shadow: none; }

        /* Premium 3D Back to Dashboard Button */
        .btn-back-dashboard { display: inline-flex; align-items: center; gap: 8px; background: #ffffff; border: 1px solid #cbd5e1; padding: 8px 16px; border-radius: 10px; color: #1e293b; font-weight: 800; font-size: 14px; text-decoration: none; box-shadow: 0 4px 6px rgba(0,0,0,0.05), inset 0 -2px 0 rgba(226,232,240,0.8); transition: all 0.2s ease; cursor: pointer; }
        .btn-back-dashboard:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.08), inset 0 -2px 0 rgba(226,232,240,0.8); border-color: #94a3b8; }
        .btn-back-dashboard:active { transform: translateY(1px); box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .btn-back-dashboard svg { width: 22px; height: 22px; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; filter: drop-shadow(0px 2px 2px rgba(37,99,235,0.3)); stroke: var(--app-theme-color, #2563eb); }

        @media (max-width: 600px) {
            .btn-back-dashboard span { display: none; } 
            
            /* FIXED TOGGLE CONTAINER FOR MOBILE */
            .toggle-container { flex-direction: column !important; align-items: flex-start !important; gap: 12px !important; }
            .toggle-label { margin-left: 0 !important; }
        }

        /* DISABLE SCROLLING ON NUMBER INPUTS */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        /* Toggle Switch Styling */
        .toggle-container { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .toggle-label { font-size: 13px; font-weight: 700; color: #475569; }
        .switch { position: relative; display: inline-block; width: 120px; height: 34px; background-color: #cbd5e1; border-radius: 34px; cursor: pointer; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--app-theme-color, #3b82f6); border-radius: 34px; transition: .4s; }
        .slider:before { position: absolute; content: "Auto"; height: 26px; width: 54px; left: 4px; bottom: 4px; background-color: white; border-radius: 34px; transition: .4s; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; color: var(--app-theme-color, #1e3a8a); }
        input:checked + .slider { background-color: #64748b; }
        input:checked + .slider:before { transform: translateX(58px); content: "Manual"; color: #334155; }
        
        /* Auto Gen Highlight */
        .auto-highlight { background-color: #eff6ff !important; border-color: var(--app-theme-color, #3b82f6) !important; color: var(--app-theme-color, #1e3a8a) !important; font-weight: bold; }
    </style>
</head>
<body>
    <nav class="app-header" style="position: relative; display: flex; align-items: center; justify-content: center; padding: 12px 15px; min-height: 60px;">
        <!-- JS Error ഒഴിവാക്കാനുള്ള അദൃശ്യമായ IDs -->
        <div style="display: none;">
            <img id="navLogo">
            <span id="navInstName"></span>
            <span id="navSubName"></span>
        </div>
        
        <a href="dashboard.html" class="btn-back-dashboard" style="position: absolute; left: 15px; padding: 8px 12px;">
            <svg viewBox="0 0 24 24">
                <path d="M9 14L4 9l5-5" />
                <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11" />
            </svg>
        </a>
        <h1 style="font-size: 16px; font-weight: 900; color: var(--app-theme-color, #1e3a8a); text-transform: uppercase; margin: 0; letter-spacing: 0.5px;">New Admission</h1>
    </nav>
    
    <main class="main-content">
        <div class="form-card">
            
            <form id="admissionForm">
                <div class="form-group"><label class="form-label">Full Name</label><input type="text" id="fullName" class="form-control" required></div>
                
                <div class="form-group" style="background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 20px;">
                    <div class="toggle-container">
                        <label class="switch">
                            <input type="checkbox" id="regToggle" onchange="toggleRegMode()">
                            <span class="slider"></span>
                        </label>
                        <span class="toggle-label" style="margin-left: 10px;">Register Number Generation</span>
                    </div>
                    <label class="form-label" style="margin-top: 10px;">Register Number</label>
                    <input type="text" id="regNo" class="form-control auto-highlight" required placeholder="Generating..." readonly>
                </div>

                <div class="form-group"><label class="form-label">Phone Number</label><input type="tel" id="phone" class="form-control" required maxlength="10"></div>
                <div class="form-group"><label class="form-label">Admission Date</label><input type="date" id="admissionDate" class="form-control" required></div>
                <div class="form-group"><label class="form-label">Date of Birth</label><input type="date" id="dateOfBirth" class="form-control"></div>
                <div class="form-group"><label class="form-label">Address</label><textarea id="address" class="form-control" rows="3" required style="resize: none;"></textarea></div>
                
                <div class="form-group">
                    <label class="form-label">Qualification</label>
                    <select id="qualification" class="form-control" required onchange="checkQualification()">
                        <option value="">-- Select --</option>
                        <option value="SSLC">SSLC</option>
                        <option value="Plus Two">Plus Two</option>
                        <option value="Degree">Degree</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                
                <div class="form-group" id="otherQualGroup" style="display: none;">
                    <label class="form-label" style="color: var(--app-theme-color, #3b82f6);">Specify Qualification</label>
                    <input type="text" id="otherQualification" class="form-control" placeholder="Enter qualification...">
                </div>

                <div class="form-group">
                    <label class="form-label">Gender</label>
                    <select id="gender" class="form-control" required>
                        <option value="Male">Male</option><option value="Female">Female</option>
                    </select>
                </div>

                <div class="form-group"><label class="form-label">Student Photo</label><input type="file" id="photoFile" class="form-control" accept="image/*"></div>
                
                <div class="form-group"><label class="form-label">Select Course</label><select id="courseSelect" class="form-control" required><option value="">-- Select Course --</option></select></div>
                <div class="form-group"><label class="form-label">Select Module (Optional)</label><select id="moduleSelect" class="form-control"><option value="">-- Select Module --</option></select></div>
                
                <div class="form-group"><label class="form-label">Total Course Fee (₹)</label><input type="number" id="totalFee" class="form-control" required readonly style="background:#e2e8f0; color:#64748b; cursor:not-allowed;"></div>
                
                <div style="background: #F0FDF4; border: 1px solid #BBF7D0; padding: 15px; border-radius: 8px; margin-bottom: 24px;">
                    <h3 style="font-size: 14px; margin-bottom: 10px; color: #166534;">Admission Fee Details</h3>
                    <div class="form-group"><label class="form-label">Admission Fee Paid (₹)</label><input type="number" id="admissionFee" class="form-control" required></div>
                    <div class="form-group">
                        <label class="form-label">Payment Mode</label>
                        <select id="paymentMode" class="form-control" required><option value="Cash">Cash</option><option value="UPI">UPI</option><option value="Bank Transfer">Bank Transfer</option></select>
                    </div>
                    <div class="form-group" style="margin-bottom: 0;"><label class="form-label">Receipt / Transaction ID</label><input type="text" id="receiptNo" class="form-control"></div>
                </div>
                
                <button type="submit" class="btn-submit-custom" id="submitBtn">Submit Admission</button>
            </form>
            
            <div style="display: flex; justify-content: center; margin-top: 25px;">
                <!-- 3D RETURN TO DASHBOARD BUTTON (FOOTER) -->
                <a href="dashboard.html" class="btn-back-dashboard">
                    <svg viewBox="0 0 24 24" style="stroke:url(#grad-return-footer);">
                        <defs>
                            <linearGradient id="grad-return-footer" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#2563eb" />
                                <stop offset="100%" stop-color="#9333ea" />
                            </linearGradient>
                        </defs>
                        <path d="M9 14L4 9l5-5" />
                        <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11" />
                    </svg>
                    <span>Dashboard</span>
                </a>
            </div>
        </div>
    </main>

    <!-- NEW: Global Theme & Audit Engine -->
    <script type="module" src="assets/js/theme-manager.js"></script>

    <script type="module">
        import { supabase } from './assets/js/supabase-config.js';

        // --- MAGIC ALERT OVERRIDE ---
        window.alert = function(msg) {
            const oldBox = document.getElementById('customAlertBox'); if (oldBox) oldBox.remove();
            const box = document.createElement('div'); box.id = 'customAlertBox';
            let borderColor = '#3b82f6'; 
            if(msg.includes('⚠️') || msg.includes('❌') || msg.includes('Error')) borderColor = '#ef4444'; 
            else if (msg.includes('✅') || msg.includes('success') || msg.includes('Successful')) borderColor = '#10b981'; 
            box.style.cssText = `position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #ffffff; color: #1e293b; padding: 16px 24px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); border-left: 5px solid ${borderColor}; font-size: 14px; font-weight: 800; z-index: 10000; display: flex; align-items: center; justify-content: space-between; min-width: 300px; animation: slideDown 0.3s ease;`;
            box.innerHTML = `<span>${msg}</span><button onclick="this.parentElement.remove()" style="background:none;border:none;font-weight:900;cursor:pointer;color:#94a3b8;font-size:16px;">X</button>`;
            if(!document.querySelector('style#alertAnim')){ document.head.insertAdjacentHTML('beforeend', '<style id="alertAnim">@keyframes slideDown{from{top:-50px;opacity:0}to{top:20px;opacity:1}}</style>'); }
            document.body.appendChild(box); setTimeout(() => { if (box.parentElement) box.remove(); }, 4000);
        };
        // ----------------------------

        let studentsData = [], paymentsData = [], coursesData = [], globalUniqueModules = [];
        let globalCourses = [];
        let institutePrefix = "GLB"; 

        document.addEventListener('wheel', function(event) {
            if (document.activeElement.type === 'number') { document.activeElement.blur(); }
        });

        async function checkAuth() {
            const userRole = localStorage.getItem('userRole') || 'Admin';
            const { data: { session } } = await supabase.auth.getSession();

            if (!session && userRole !== 'Guest') { 
                window.location.href = 'login.html'; 
                return; 
            }

            if (userRole === 'Guest') {
                setTimeout(() => {
                    const actionButtons = document.querySelectorAll('button[type="submit"], button');
                    actionButtons.forEach(btn => {
                        const btnText = btn.innerText.toLowerCase();
                        if(btnText.includes('submit') || btnText.includes('save')) {
                            btn.onclick = function(e) {
                                e.preventDefault();
                                e.stopPropagation();
                                alert("⚠️ This action is disabled in Guest/Demo mode.");
                                return false;
                            };
                        }
                    });

                    const form = document.getElementById('admissionForm');
                    if(form) {
                        form.addEventListener('submit', function(e) {
                            e.preventDefault();
                            e.stopPropagation();
                            alert("⚠️ This action is disabled in Guest/Demo mode.");
                            e.stopImmediatePropagation();
                            return false;
                        }, true);
                    }
                }, 1000);
            }

            document.getElementById('admissionDate').value = new Date().toISOString().split('T')[0];
            await loadSettings();
            fetchCourses();
            generateAutoRegNumber();
        }

        async function loadSettings() {
            try {
                const { data } = await supabase.from('institute_settings').select('*').eq('id', 1).single();
                if (data) {
                    const instName = data.institute_name || 'GLOBUS';
                    document.getElementById('navInstName').innerText = instName;
                    document.getElementById('navSubName').innerText = data.sub_name || 'Technical Academy';
                    if(data.logo_url) document.getElementById('navLogo').src = data.logo_url;

                    institutePrefix = instName.substring(0, 3).toUpperCase();
                }
            } catch (e) {}
        }

        window.checkQualification = function() {
            const select = document.getElementById('qualification');
            const otherGroup = document.getElementById('otherQualGroup');
            const otherInput = document.getElementById('otherQualification');

            if (select.value === 'Other') {
                otherGroup.style.display = 'block';
                otherInput.required = true;
            } else {
                otherGroup.style.display = 'none';
                otherInput.required = false;
                otherInput.value = '';
            }
        }

        window.toggleRegMode = function() {
            const isManual = document.getElementById('regToggle').checked; 
            const regInput = document.getElementById('regNo');

            if (isManual) {
                regInput.readOnly = false;
                regInput.value = '';
                regInput.placeholder = "Enter custom register number...";
                regInput.classList.remove('auto-highlight');
            } else {
                regInput.readOnly = true;
                regInput.placeholder = "Generating...";
                regInput.classList.add('auto-highlight');
                generateAutoRegNumber();
            }
        }

        async function generateAutoRegNumber() {
            if (document.getElementById('regToggle').checked) return; 

            const regInput = document.getElementById('regNo');
            regInput.value = "Generating...";

            try {
                const { data, error } = await supabase.from('students').select('register_number');
                if (error) throw error;

                let maxNum = 0;
                const existingRegNos = new Set(); 

                if (data && data.length > 0) {
                    const prefixUpper = institutePrefix.toUpperCase();
                    data.forEach(student => {
                        if (student.register_number) {
                            const regStr = student.register_number.trim().toUpperCase();
                            existingRegNos.add(regStr); 

                            if (regStr.startsWith(prefixUpper)) {
                                const numericPartStr = regStr.replace(prefixUpper, '').replace('-', '');
                                const numMatch = numericPartStr.match(/^\d+/);

                                if (numMatch) {
                                    const numPart = parseInt(numMatch[0], 10);
                                    if (!isNaN(numPart) && numPart > maxNum) {
                                        maxNum = numPart;
                                    }
                                }
                            }
                        }
                    });
                }

                let nextNum = maxNum + 1;
                let proposedRegNo = `${institutePrefix}-${nextNum.toString().padStart(4, '0')}`;

                while (existingRegNos.has(proposedRegNo.toUpperCase()) || existingRegNos.has(proposedRegNo.replace('-','').toUpperCase())) {
                    nextNum++;
                    proposedRegNo = `${institutePrefix}-${nextNum.toString().padStart(4, '0')}`;
                }

                regInput.value = proposedRegNo;

            } catch (err) {
                console.error("Error generating reg number:", err);
                regInput.value = "";
                regInput.placeholder = "Error! Switch to Manual.";
            }
        }

        async function fetchCourses() {
            const { data } = await supabase.from('courses').select('id, course_name, modules, total_fee').eq('status', 'Active');
            if (data) {
                globalCourses = data;
                const select = document.getElementById('courseSelect');
                data.forEach(c => select.add(new Option(c.course_name, c.id)));
            }
        }

        document.getElementById('courseSelect').addEventListener('change', function() {
            const moduleSelect = document.getElementById('moduleSelect');
            const totalFeeInput = document.getElementById('totalFee');
            moduleSelect.innerHTML = '<option value="">-- Select Module --</option>';

            const courseInfo = globalCourses.find(c => c.id == this.value);

            if (courseInfo) {
                if (courseInfo.modules) {
                    courseInfo.modules.forEach(mod => moduleSelect.add(new Option(mod, mod)));
                }
                totalFeeInput.value = courseInfo.total_fee || 0;
            } else {
                totalFeeInput.value = '';
            }
        });

        document.getElementById('phone').addEventListener('input', function() {
            let val = this.value.trim();
            if (/^\d+$/.test(val) && val.length > 10) this.value = val.slice(0, 10);
        });

        // ==========================================
        // NEW: IMAGE COMPRESSION FUNCTION (Client-Side)
        // ==========================================
        function compressImage(file, maxWidth, maxHeight, quality) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > maxWidth) { height = Math.round((height *= maxWidth / width)); width = maxWidth; }
                        } else {
                            if (height > maxHeight) { width = Math.round((width *= maxHeight / height)); height = maxHeight; }
                        }

                        const canvas = document.createElement('canvas');
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        canvas.toBlob((blob) => {
                            const compressedFile = new File([blob], file.name, { type: 'image/jpeg', lastModified: Date.now() });
                            resolve(compressedFile);
                        }, 'image/jpeg', quality);
                    };
                    img.onerror = (err) => reject(err);
                };
                reader.onerror = (err) => reject(err);
            });
        }

        document.getElementById('admissionForm').addEventListener('submit', async (e) => {
            e.preventDefault(); 
            if (localStorage.getItem('userRole') === 'Guest') { alert("⚠️ This action is disabled in Guest/Demo mode."); return; }

            const phoneVal = document.getElementById('phone').value.trim();
            if (phoneVal.length !== 10) { alert('❌ Phone number must be exactly 10 digits.'); return; }

            const totalFee = Number(document.getElementById('totalFee').value);
            const admissionFee = Number(document.getElementById('admissionFee').value);

            if (admissionFee > totalFee) { alert('❌ Error: Admission fee cannot be greater than Total Course Fee!'); return; }

            let finalQualification = document.getElementById('qualification').value;
            if (finalQualification === 'Other') {
                const otherVal = document.getElementById('otherQualification').value.trim();
                if (!otherVal) { alert('❌ Please specify the qualification.'); return; }
                finalQualification = otherVal;
            }

            const btn = document.getElementById('submitBtn');
            btn.textContent = 'Processing Data...'; btn.disabled = true;

            let photoUrl = '';
            const fileInput = document.getElementById('photoFile');

            try {
                if (fileInput.files.length > 0) {
                    btn.textContent = 'Compressing Image...';
                    let originalFile = fileInput.files[0];
                    
                    // COMPRESS THE IMAGE (Max 600px width/height, 60% Quality)
                    const compressedFile = await compressImage(originalFile, 600, 600, 0.6);
                    console.log(`Original: ${(originalFile.size/1024).toFixed(2)}KB -> Compressed: ${(compressedFile.size/1024).toFixed(2)}KB`);

                    btn.textContent = 'Uploading Image...';
                    const fileName = `${Date.now()}_${compressedFile.name.replace(/\.[^/.]+$/, "")}.jpg`; // Always save as JPG
                    
                    await supabase.storage.from('student-photos').upload(fileName, compressedFile);
                    photoUrl = supabase.storage.from('student-photos').getPublicUrl(fileName).data.publicUrl;
                }

                btn.textContent = 'Saving Admission...';
                const studentName = document.getElementById('fullName').value;
                const regNumber = document.getElementById('regNo').value;

                const { error } = await supabase.from('students').insert([{
                    full_name: studentName,
                    register_number: regNumber,
                    phone_number: phoneVal,
                    admission_date: document.getElementById('admissionDate').value,
                    date_of_birth: document.getElementById('dateOfBirth').value || null,
                    address: document.getElementById('address').value,
                    qualification: finalQualification, 
                    gender: document.getElementById('gender').value,
                    photo_url: photoUrl,
                    course_id: document.getElementById('courseSelect').value,
                    module: document.getElementById('moduleSelect').value || null, 
                    total_fee: totalFee,
                    admission_fee: admissionFee,
                    status: 'active'
                }]);

                if (error) throw error;

                // --- NEW: AUDIT TRAIL LOGGING ---
                if(window.ThemeManager) {
                    await window.ThemeManager.logAction(
                        'Admission', 
                        'CREATE', 
                        `New student admitted: ${studentName} (Reg: ${regNumber})`
                    );
                }

                alert('✅ Admission Successful!'); 
                setTimeout(() => { window.location.href = 'dashboard.html'; }, 1000);
            } catch (err) {
                alert('❌ Error: ' + err.message);
                btn.textContent = 'Submit Admission'; btn.disabled = false;
            }
        });

        checkAuth();
    </script>

    <!-- THE NEW DYNAMIC SECURITY SYSTEM -->
    <script type="module">
        import './assets/js/auth-check.js';
        window.checkDynamicAccess('Admission');
    </script>
</body>
</html>

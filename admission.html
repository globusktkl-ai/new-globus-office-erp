<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Admission - Globus Office ERP</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .navbar { background-color: var(--white); padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .navbar-brand { font-size: 20px; font-weight: 700; color: var(--primary-dark); }
        .navbar-menu a { margin-right: 20px; text-decoration: none; color: var(--text-muted); font-weight: 500; }
        .navbar-menu a:hover, .navbar-menu a.active { color: var(--primary-dark); }
        .main-content { padding: 32px 24px; max-width: 800px; margin: 0 auto; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .full-width { grid-column: span 2; }
        @media (max-width: 768px) { .form-grid { grid-template-columns: 1fr; } .full-width { grid-column: span 1; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">Globus ERP</div>
        <div class="navbar-menu">
            <a href="dashboard.html">Dashboard</a>
            <a href="students.html" class="active">Students</a>
            <a href="fees.html">Fees</a>
        </div>
    </nav>

    <main class="main-content">
        <div class="page-header" style="margin-bottom:24px;">
            <h2>New Admission</h2>
        </div>

        <div class="card">
            <div id="alertMessage" class="alert hidden"></div>
            <form id="admissionForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">Joining Date *</label>
                        <input type="date" id="admissionDate" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Qualification</label>
                        <select id="qualification" class="form-control">
                            <option value="No Qualification">-- Select Qualification --</option>
                            <option value="SSLC">SSLC</option>
                            <option value="Plus Two">Plus Two</option>
                            <option value="Degree">Degree</option>
                        </select>
                    </div>

                    <div class="form-group full-width">
                        <label class="form-label">Student Full Name *</label>
                        <input type="text" id="fullName" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Phone Number *</label>
                        <input type="tel" id="phone" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <input type="email" id="email" class="form-control">
                    </div>

                    <div class="form-group full-width">
                        <label class="form-label">Select Course *</label>
                        <select id="courseId" class="form-control" required>
                            <option value="">-- Loading Courses... --</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Total Course Fee (₹) *</label>
                        <input type="number" id="totalFee" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Admission Fee Paid Now (₹)</label>
                        <input type="number" id="admissionFee" class="form-control" value="0" min="0">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Select Batch *</label>
                        <select id="batchId" class="form-control" required>
                            <option value="">-- Loading Batches... --</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Gender</label>
                        <select id="gender" class="form-control">
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>
                <div class="form-group mt-4" style="text-align: right;">
                    <button type="submit" class="btn btn-primary" id="submitBtn">Save Admission</button>
                </div>
            </form>
        </div>
    </main>

    <script type="module">
        import { supabase } from './assets/js/supabase-config.js';

        const alertMessage = document.getElementById('alertMessage');
        const submitBtn = document.getElementById('submitBtn');

        document.getElementById('admissionDate').valueAsDate = new Date();

        async function loadDependencies() {
            try {
                // Load Courses
                const { data: courses, error: cError } = await supabase.from('courses').select('id, course_name, fee_amount');
                if (cError) throw cError;
                window.courseList = courses;
                const courseSelect = document.getElementById('courseId');
                courseSelect.innerHTML = '<option value="">-- Select Course --</option>';
                courses.forEach(c => courseSelect.add(new Option(c.course_name, c.id)));

                // Load Batches
                const { data: batches, error: bError } = await supabase.from('batches').select('id, batch_name');
                if (bError) throw bError;
                const batchSelect = document.getElementById('batchId');
                batchSelect.innerHTML = '<option value="">-- Select Batch --</option>';
                batches.forEach(b => batchSelect.add(new Option(b.batch_name, b.id)));
            } catch (err) {
                console.error('Error fetching dependencies:', err);
            }
        }

        // Auto-fill total fee when course is selected
        document.getElementById('courseId').addEventListener('change', (e) => {
            const selected = window.courseList?.find(c => c.id === e.target.value);
            document.getElementById('totalFee').value = selected ? selected.fee_amount : '';
        });

        document.getElementById('admissionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.textContent = 'Saving...';
            submitBtn.disabled = true;

            const regNo = 'REG-' + Math.floor(10000 + Math.random() * 90000);
            
            const studentData = {
                register_number: regNo,
                full_name: document.getElementById('fullName').value,
                phone_number: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                course_id: document.getElementById('courseId').value,
                batch_id: document.getElementById('batchId').value,
                admission_date: document.getElementById('admissionDate').value,
                gender: document.getElementById('gender').value,
                qualification: document.getElementById('qualification').value,
                total_fee: document.getElementById('totalFee').value,
                admission_fee: document.getElementById('admissionFee').value,
                status: 'active'
            };

            try {
                // 1. Save Student
                const { data: stuData, error: stuErr } = await supabase.from('students').insert([studentData]).select();
                if (stuErr) throw stuErr;

                // 2. Save Admission Fee to fee_payments if paid
                if (studentData.admission_fee > 0 && stuData && stuData.length > 0) {
                    const payData = {
                        student_id: stuData[0].id,
                        amount: studentData.admission_fee,
                        payment_date: studentData.admission_date,
                        payment_mode: 'Cash',
                        remarks: 'Admission Fee Paid'
                    };
                    await supabase.from('fee_payments').insert([payData]);
                }

                alertMessage.textContent = 'Admission Successful!';
                alertMessage.className = 'alert alert-success';
                alertMessage.classList.remove('hidden');
                setTimeout(() => window.location.href = 'students.html', 1500);
            } catch (err) {
                alertMessage.textContent = 'Error: ' + err.message;
                alertMessage.className = 'alert alert-error';
                alertMessage.classList.remove('hidden');
                submitBtn.textContent = 'Save Admission';
                submitBtn.disabled = false;
            }
        });

        loadDependencies();
    </script>
</body>
</html>

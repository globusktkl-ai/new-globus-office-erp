
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>New Admission - Globus Technical Academy</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .btn-submit-custom {
            background-color: #3B82F6; color: white; border: none; padding: 14px 20px;
            border-radius: 8px; font-size: 16px; font-weight: bold; width: 100%;
            cursor: pointer; transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 6px rgba(59, 130, 246, 0.3); margin-top: 10px;
        }
        .btn-submit-custom:hover { background-color: #2563eb; }
        .btn-submit-custom:active { transform: scale(0.98); }
        .btn-submit-custom:disabled { background-color: #94a3b8; cursor: not-allowed; box-shadow: none; }

        /* Premium 3D Back to Dashboard Button */
        .btn-back-dashboard { display: inline-flex; align-items: center; gap: 8px; background: #ffffff; border: 1px solid #cbd5e1; padding: 8px 16px; border-radius: 10px; color: #1e293b; font-weight: 800; font-size: 14px; text-decoration: none; box-shadow: 0 4px 6px rgba(0,0,0,0.05), inset 0 -2px 0 rgba(226,232,240,0.8); transition: all 0.2s ease; cursor: pointer; }
        .btn-back-dashboard:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.08), inset 0 -2px 0 rgba(226,232,240,0.8); border-color: #94a3b8; }
        .btn-back-dashboard:active { transform: translateY(1px); box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .btn-back-dashboard svg { width: 22px; height: 22px; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; filter: drop-shadow(0px 2px 2px rgba(37,99,235,0.3)); }

        @media (max-width: 600px) {
            .btn-back-dashboard span { display: none; } /* Hide text on small screens, keep only icon */
        }

        /* DISABLE SCROLLING ON NUMBER INPUTS */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
    </style>
</head>
<body>
    <nav class="app-header">
        <div class="header-left" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px;">
            <img src="assets/images/logo.png" class="logo-small" alt="Logo" onerror="this.style.display='none'">
            <div style="display: flex; flex-direction: column; overflow: hidden;">
                <span class="brand-top" style="font-size: 16px; font-weight: bold;">Globus</span>
                <span class="brand-bottom" style="font-size: 11px; color: #64748b;">Technical Academy</span>
            </div>
        </div>
        <div class="header-right">
            <!-- 3D RETURN TO DASHBOARD BUTTON (HEADER) -->
            <a href="dashboard.html" class="btn-back-dashboard">
                <svg viewBox="0 0 24 24" style="stroke:url(#grad-return);">
                    <defs>
                        <linearGradient id="grad-return" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#2563eb" />
                            <stop offset="100%" stop-color="#9333ea" />
                        </linearGradient>
                    </defs>
                    <path d="M9 14L4 9l5-5" />
                    <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11" />
                </svg>
                <span>Dashboard</span>
            </a>
        </div>
    </nav>
    
    <main class="main-content">
        <div class="form-card">
            <h2 style="font-size: 18px; margin-bottom: 20px; color: var(--primary-dark);">New Student Admission</h2>
            
            <form id="admissionForm">
                <div class="form-group"><label class="form-label">Full Name</label><input type="text" id="fullName" class="form-control" required></div>
                <div class="form-group"><label class="form-label">Register Number</label><input type="text" id="regNo" class="form-control" required></div>
                <div class="form-group"><label class="form-label">Phone Number</label><input type="tel" id="phone" class="form-control" required maxlength="10"></div>
                <div class="form-group"><label class="form-label">Admission Date</label><input type="date" id="admissionDate" class="form-control" required></div>
                <div class="form-group"><label class="form-label">Date of Birth</label><input type="date" id="dateOfBirth" class="form-control"></div>
                <div class="form-group"><label class="form-label">Address</label><textarea id="address" class="form-control" rows="3" required style="resize: none;"></textarea></div>
                
                <div class="form-group">
                    <label class="form-label">Qualification</label>
                    <select id="qualification" class="form-control" required>
                        <option value="">-- Select --</option><option value="SSLC">SSLC</option><option value="Plus Two">Plus Two</option><option value="Degree">Degree</option><option value="Other">Other</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Gender</label>
                    <select id="gender" class="form-control" required>
                        <option value="Male">Male</option><option value="Female">Female</option>
                    </select>
                </div>

                <div class="form-group"><label class="form-label">Student Photo</label><input type="file" id="photoFile" class="form-control" accept="image/*"></div>
                
                <div class="form-group"><label class="form-label">Select Course</label><select id="courseSelect" class="form-control" required><option value="">-- Select Course --</option></select></div>
                <div class="form-group"><label class="form-label">Select Module (Optional)</label><select id="moduleSelect" class="form-control"><option value="">-- Select Module --</option></select></div>
                
                <!-- AUTO FILLED TOTAL FEE -->
                <div class="form-group"><label class="form-label">Total Course Fee (₹)</label><input type="number" id="totalFee" class="form-control" required readonly style="background:#e2e8f0; color:#64748b; cursor:not-allowed;"></div>
                
                <div style="background: #F0FDF4; border: 1px solid #BBF7D0; padding: 15px; border-radius: 8px; margin-bottom: 24px;">
                    <h3 style="font-size: 14px; margin-bottom: 10px; color: #166534;">Admission Fee Details</h3>
                    <div class="form-group"><label class="form-label">Admission Fee Paid (₹)</label><input type="number" id="admissionFee" class="form-control" required></div>
                    <div class="form-group">
                        <label class="form-label">Payment Mode</label>
                        <select id="paymentMode" class="form-control" required><option value="Cash">Cash</option><option value="UPI">UPI</option><option value="Bank Transfer">Bank Transfer</option></select>
                    </div>
                    <div class="form-group" style="margin-bottom: 0;"><label class="form-label">Receipt / Transaction ID</label><input type="text" id="receiptNo" class="form-control"></div>
                </div>
                
                <button type="submit" class="btn-submit-custom" id="submitBtn">Submit Admission</button>
            </form>
            
            <div style="display: flex; justify-content: center; margin-top: 25px;">
                <!-- 3D RETURN TO DASHBOARD BUTTON (FOOTER) -->
                <a href="dashboard.html" class="btn-back-dashboard">
                    <svg viewBox="0 0 24 24" style="stroke:url(#grad-return-footer);">
                        <defs>
                            <linearGradient id="grad-return-footer" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#2563eb" />
                                <stop offset="100%" stop-color="#9333ea" />
                            </linearGradient>
                        </defs>
                        <path d="M9 14L4 9l5-5" />
                        <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11" />
                    </svg>
                    <span>Dashboard</span>
                </a>
            </div>
        </div>
    </main>

    <script type="module">
        import { supabase } from './assets/js/supabase-config.js';
        let globalCourses = [];

        // PREVENT SCROLL WHEEL ON NUMBER INPUTS
        document.addEventListener('wheel', function(event) {
            if (document.activeElement.type === 'number') { document.activeElement.blur(); }
        });

        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return; }
            document.getElementById('admissionDate').value = new Date().toISOString().split('T')[0];
            fetchCourses();
        }

        async function fetchCourses() {
            // Modified to also fetch total_fee
            const { data } = await supabase.from('courses').select('id, course_name, modules, total_fee').eq('status', 'Active');
            if (data) {
                globalCourses = data;
                const select = document.getElementById('courseSelect');
                data.forEach(c => select.add(new Option(c.course_name, c.id)));
            }
        }

        document.getElementById('courseSelect').addEventListener('change', function() {
            const moduleSelect = document.getElementById('moduleSelect');
            const totalFeeInput = document.getElementById('totalFee');
            moduleSelect.innerHTML = '<option value="">-- Select Module --</option>';
            
            const courseInfo = globalCourses.find(c => c.id == this.value);
            
            if (courseInfo) {
                if (courseInfo.modules) {
                    courseInfo.modules.forEach(mod => moduleSelect.add(new Option(mod, mod)));
                }
                // Auto fill the total fee from DB
                totalFeeInput.value = courseInfo.total_fee || 0;
            } else {
                totalFeeInput.value = '';
            }
        });

        document.getElementById('phone').addEventListener('input', function() {
            let val = this.value.trim();
            if (/^\d+$/.test(val) && val.length > 10) this.value = val.slice(0, 10);
        });

        document.getElementById('admissionForm').addEventListener('submit', async (e) => {
            e.preventDefault(); 
            const phoneVal = document.getElementById('phone').value.trim();
            if (phoneVal.length !== 10) { alert('Phone number must be exactly 10 digits.'); return; }

            const totalFee = Number(document.getElementById('totalFee').value);
            const admissionFee = Number(document.getElementById('admissionFee').value);

            if (admissionFee > totalFee) { alert('❌ Error: Admission fee cannot be greater than Total Course Fee!'); return; }

            const btn = document.getElementById('submitBtn');
            btn.textContent = 'Processing...'; btn.disabled = true;

            let photoUrl = '';
            const fileInput = document.getElementById('photoFile');
            
            try {
                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    const fileName = `${Date.now()}_${file.name}`;
                    await supabase.storage.from('student-photos').upload(fileName, file);
                    photoUrl = supabase.storage.from('student-photos').getPublicUrl(fileName).data.publicUrl;
                }

                const { error } = await supabase.from('students').insert([{
                    full_name: document.getElementById('fullName').value,
                    register_number: document.getElementById('regNo').value,
                    phone_number: phoneVal,
                    admission_date: document.getElementById('admissionDate').value,
                    date_of_birth: document.getElementById('dateOfBirth').value || null,
                    address: document.getElementById('address').value,
                    qualification: document.getElementById('qualification').value,
                    gender: document.getElementById('gender').value,
                    photo_url: photoUrl,
                    course_id: document.getElementById('courseSelect').value,
                    module: document.getElementById('moduleSelect').value || null, 
                    total_fee: totalFee,
                    admission_fee: admissionFee,
                    status: 'active'
                }]);

                if (error) throw error;
                alert('Admission Successful!'); 
                window.location.href = 'dashboard.html'; 
            } catch (err) {
                alert('Error: ' + err.message);
                btn.textContent = 'Submit Admission'; btn.disabled = false;
            }
        });

        checkAuth();
    </script>
</body>
</html>

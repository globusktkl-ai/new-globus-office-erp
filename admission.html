<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>New Admission - Globus Technical Academy</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    
    <nav class="app-header">
        <div class="header-left" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px;">
            <img src="assets/images/logo.png" class="logo-small" alt="Logo" onerror="this.style.display='none'">
            <div style="display: flex; flex-direction: column; overflow: hidden;">
                <span class="brand-top" style="font-size: 16px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Globus</span>
                <span class="brand-bottom" style="text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Technical Academy</span>
            </div>
        </div>
        
        <div class="header-right" style="flex-shrink: 0; margin-left: 10px;">
            <button class="btn-logout-custom" id="logoutBtn">Logout</button>
        </div>
    </nav>
    
    <main class="main-content">
        <div class="form-card">
            <h2 style="font-size: 18px; margin-bottom: 20px; color: var(--primary-dark);">New Student Admission</h2>
            
            <form id="admissionForm">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" id="fullName" class="form-control" required placeholder="Enter student name">
                </div>
                
                <div class="form-group">
                    <label class="form-label">Register Number</label>
                    <input type="text" id="regNo" class="form-control" required placeholder="e.g. GTA-001">
                </div>
                
                <div class="form-group">
                    <label class="form-label">Phone Number</label>
                    <input type="tel" id="phone" class="form-control" required placeholder="10-digit mobile number" maxlength="10">
                </div>

                <!-- പുതിയതായി ചേർത്ത Admission Date ഫീൽഡ് -->
                <div class="form-group">
                    <label class="form-label">Admission Date</label>
                    <input type="date" id="admissionDate" class="form-control" required>
                </div>

                <!-- പുതിയതായി ചേർത്ത Date of Birth ഫീൽഡ് -->
                <div class="form-group">
                    <label class="form-label">Date of Birth</label>
                    <input type="date" id="dateOfBirth" class="form-control">
                </div>

                <div class="form-group">
                    <label class="form-label">Address</label>
                    <textarea id="address" class="form-control" rows="3" required placeholder="Enter student residential address" style="resize: none; height: auto; padding: 10px;"></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label">Educational Qualification</label>
                    <select id="qualification" class="form-control" required>
                        <option value="">-- Select Qualification --</option>
                        <option value="SSLC">SSLC</option>
                        <option value="Plus Two">Plus Two</option>
                        <option value="Degree">Degree</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Gender</label>
                    <select id="gender" class="form-control" required>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Student Photo</label>
                    <input type="file" id="photoFile" class="form-control" accept="image/*">
                </div>
                
                <div class="form-group">
                    <label class="form-label">Select Course</label>
                    <select id="courseSelect" class="form-control" required>
                        <option value="">-- Select Course --</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Total Course Fee (₹)</label>
                    <input type="number" id="totalFee" class="form-control" required placeholder="e.g. 15000">
                </div>
                
                <div class="form-group" style="margin-bottom: 24px;">
                    <label class="form-label">Admission Fee Paid (₹)</label>
                    <input type="number" id="admissionFee" class="form-control" required placeholder="Amount paid during admission">
                </div>
                
                <button type="submit" class="btn btn-primary" id="submitBtn">Submit Admission</button>
            </form>
            
            <div style="text-align: center; margin-top: 20px;">
                <a href="dashboard.html" style="color: var(--primary-light); text-decoration: none; font-weight: 600;">Return to Dashboard</a>
            </div>
        </div>
    </main>

    <script type="module">
        import { supabase } from './assets/js/supabase-config.js';

        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return; }
            
            // ഓട്ടോമാറ്റിക്കായി ഇന്നത്തെ തീയതി Admission Date ഫീൽഡിൽ സെറ്റ് ചെയ്യുന്നു
            document.getElementById('admissionDate').value = new Date().toISOString().split('T')[0];
            fetchCourses();
        }

        async function fetchCourses() {
            const { data, error } = await supabase.from('courses').select('id, course_name');
            
            if (error) {
                console.error("Error fetching courses:", error.message);
                return;
            }
            
            if (data) {
                const select = document.getElementById('courseSelect');
                select.innerHTML = '<option value="">-- Select Course --</option>';
                data.forEach(c => select.add(new Option(c.course_name, c.id)));
            }
        }

        document.getElementById('phone').addEventListener('input', function() {
            let val = this.value.trim();
            if (/^\d+$/.test(val) && val.length > 10) {
                this.value = val.slice(0, 10);
            }
        });

        document.getElementById('admissionForm').addEventListener('submit', async (e) => {
            e.preventDefault(); 
            const phoneVal = document.getElementById('phone').value.trim();
            if (phoneVal.length !== 10) {
                alert('Phone number must be exactly 10 digits.');
                return;
            }

            const totalFee = Number(document.getElementById('totalFee').value);
            const admissionFee = Number(document.getElementById('admissionFee').value);

            if (admissionFee > totalFee) {
                alert('❌ Error: Admission fee cannot be greater than the Total Course Fee!');
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.textContent = 'Processing...'; btn.disabled = true;

            let photoUrl = '';
            const fileInput = document.getElementById('photoFile');
            
            try {
                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    const fileName = `${Date.now()}_${file.name}`;
                    const { data: uploadData, error: uploadError } = await supabase.storage.from('student-photos').upload(fileName, file);
                    if (uploadError) throw uploadError;
                    
                    const { data: publicUrlData } = supabase.storage.from('student-photos').getPublicUrl(fileName);
                    photoUrl = publicUrlData.publicUrl;
                }

                // Supabase-ലേക്ക് പുതിയ ഡേറ്റകൾ ഉൾപ്പെടുത്തി സേവ് ചെയ്യുന്നു
                const { error } = await supabase.from('students').insert([{
                    full_name: document.getElementById('fullName').value,
                    register_number: document.getElementById('regNo').value,
                    phone_number: phoneVal,
                    admission_date: document.getElementById('admissionDate').value,
                    date_of_birth: document.getElementById('dateOfBirth').value || null,
                    address: document.getElementById('address').value,
                    qualification: document.getElementById('qualification').value,
                    gender: document.getElementById('gender').value,
                    photo_url: photoUrl,
                    course_id: document.getElementById('courseSelect').value,
                    total_fee: totalFee,
                    admission_fee: admissionFee,
                    status: 'active'
                }]);

                if (error) throw error;

                alert('Admission Successful!'); 
                window.location.href = 'dashboard.html'; 
            } catch (err) {
                alert('Error: ' + err.message);
                btn.textContent = 'Submit Admission'; 
                btn.disabled = false;
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => { 
            await supabase.auth.signOut(); localStorage.clear(); sessionStorage.clear();
            window.history.replaceState(null, '', 'login.html'); window.location.replace('login.html'); 
        });

        checkAuth();
    </script>
</body>
</html>

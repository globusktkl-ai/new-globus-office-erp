<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPKTechsolutions ERP - Total Financial Report</title>
    
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* അടിസ്ഥാന സ്റ്റൈലിംഗ് */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 20px; 
            background-color: #f4f7f6; 
            color: #333;
        }
        h2 { color: #2c3e50; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        
        /* Summary Cards */
        .summary-cards { display: flex; gap: 20px; margin-bottom: 25px; }
        .card { 
            flex: 1; padding: 20px; border-radius: 10px; color: white; 
            text-align: center; font-size: 22px; font-weight: bold; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .income-card { background: linear-gradient(135deg, #2ecc71, #27ae60); }
        .expense-card { background: linear-gradient(135deg, #e74c3c, #c0392b); }
        .balance-card { background: linear-gradient(135deg, #3498db, #2980b9); }
        
        /* Filters Section */
        .filters { 
            display: flex; gap: 15px; margin-bottom: 20px; padding: 20px; 
            background: white; border-radius: 10px; flex-wrap: wrap; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); align-items: center;
        }
        .filters label { font-weight: bold; font-size: 14px; color: #555; }
        .filters input, .filters select, .filters button { 
            padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px;
        }
        .filters input[type="text"] { flex-grow: 1; min-width: 200px; }
        .filters button { 
            background-color: #2c3e50; color: white; border: none; cursor: pointer; 
            font-weight: bold; transition: 0.3s; 
        }
        .filters button:hover { background-color: #1a252f; }
        .btn-export { background-color: #27ae60 !important; }
        .btn-export:hover { background-color: #219653 !important; }
        
        /* Table Styling */
        table { 
            width: 100%; border-collapse: collapse; background: white; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-radius: 10px; overflow: hidden;
        }
        th, td { padding: 15px; border-bottom: 1px solid #eee; text-align: left; }
        th { background-color: #f8f9fa; color: #2c3e50; font-weight: bold; }
        tr:hover { background-color: #f1f2f6; }
        
        /* Utility */
        .action-btn {
            text-decoration: none; background: #f39c12; color: white; 
            padding: 6px 12px; border-radius: 4px; font-size: 12px; font-weight: bold;
        }
        .action-btn:hover { background: #e67e22; }
    </style>
</head>
<body>

    <h2>📊 Financial Report Dashboard</h2>

    <!-- Total Summary Cards -->
    <div class="summary-cards">
        <div class="card income-card">Total Income<br>₹<span id="total-income">0.00</span></div>
        <div class="card expense-card">Total Expense<br>₹<span id="total-expense">0.00</span></div>
        <div class="card balance-card">Net Balance<br>₹<span id="net-balance">0.00</span></div>
    </div>

    <!-- Intense Level Filters -->
    <div class="filters">
        <div>
            <label for="from-date">From:</label>
            <input type="date" id="from-date">
        </div>
        <div>
            <label for="to-date">To:</label>
            <input type="date" id="to-date">
        </div>
        
        <select id="report-type">
            <option value="all">Income & Expense</option>
            <option value="income">Income Only</option>
            <option value="expense">Expense Only</option>
        </select>

        <input type="text" id="search-query" placeholder="Search Purpose, Voucher No, Name...">
        
        <button onclick="fetchReports()">🔍 Generate Report</button>
        <button onclick="exportToCSV()" class="btn-export">📥 Export CSV</button>
    </div>

    <!-- Report Data Table -->
    <table id="report-table">
        <thead>
            <tr>
                <th>Date</th>
                <th>Type</th>
                <th>Purpose / Name</th>
                <th>Category</th>
                <th>Voucher / Receipt</th>
                <th>Remarks</th>
                <th>Amount (₹)</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="report-body">
            <tr><td colspan="8" style="text-align: center;">Loading data...</td></tr>
        </tbody>
    </table>

    <!-- JavaScript Logic -->
    <script>
        // --- 1. Supabase Initialization ---
        const SUPABASE_URL = 'YOUR_SUPABASE_URL'; // നിങ്ങളുടെ URL നൽകുക
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY'; // നിങ്ങളുടെ KEY നൽകുക
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- 2. Notification Sound Setup ---
        // ഒരു പുതിയ ഇൻകം അല്ലെങ്കിൽ എക്സ്പെൻസ് ചേർക്കുമ്പോൾ വിളിക്കാനുള്ള ഫംഗ്ഷൻ (Testing purpose)
        const successSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3');
        function playAlertSound() {
            successSound.play().catch(e => console.log("Audio play blocked by browser."));
        }

        // --- 3. Fetch and Generate Report ---
        async function fetchReports() {
            document.getElementById('report-body').innerHTML = '<tr><td colspan="8" style="text-align: center;">Fetching records...</td></tr>';
            
            const fromDate = document.getElementById('from-date').value;
            const toDate = document.getElementById('to-date').value;
            const reportType = document.getElementById('report-type').value;
            const searchQuery = document.getElementById('search-query').value.toLowerCase();

            let totalIncome = 0;
            let totalExpense = 0;
            let combinedData = [];

            try {
                // --- FETCH INCOME ---
                if (reportType === 'all' || reportType === 'income') {
                    let incomeQuery = supabase.from('fee_payments').select(`
                        id, amount, payment_date, receipt_no, remarks,
                        students (student_name)
                    `);

                    if (fromDate) incomeQuery = incomeQuery.gte('payment_date', fromDate);
                    if (toDate) incomeQuery = incomeQuery.lte('payment_date', toDate);

                    const { data: incomeData, error: incomeError } = await incomeQuery;
                    if (incomeError) throw incomeError;

                    incomeData.forEach(item => {
                        const studentName = item.students?.student_name || 'Unknown Student';
                        const purpose = studentName + " (Fee)";
                        const voucher = item.receipt_no || '-';
                        const remarks = item.remarks || '-';

                        // Search Filter Logic
                        if (searchQuery === '' || 
                            purpose.toLowerCase().includes(searchQuery) || 
                            voucher.toLowerCase().includes(searchQuery) ||
                            remarks.toLowerCase().includes(searchQuery)) {
                            
                            totalIncome += parseFloat(item.amount);
                            combinedData.push({
                                date: item.payment_date,
                                type: 'Income',
                                purpose: purpose,
                                category: 'Course Fees',
                                voucher: voucher,
                                remarks: remarks,
                                amount: parseFloat(item.amount),
                                color: '#27ae60'
                            });
                        }
                    });
                }

                // --- FETCH EXPENSE ---
                if (reportType === 'all' || reportType === 'expense') {
                    let expenseQuery = supabase.from('expenses').select('*');

                    if (fromDate) expenseQuery = expenseQuery.gte('expense_date', fromDate);
                    if (toDate) expenseQuery = expenseQuery.lte('expense_date', toDate);

                    const { data: expenseData, error: expenseError } = await expenseQuery;
                    if (expenseError) throw expenseError;

                    expenseData.forEach(item => {
                        const purpose = item.purpose || '-';
                        const voucher = item.voucher_no || '-';
                        const remarks = item.remarks || '-';

                        // Search Filter Logic
                        if (searchQuery === '' || 
                            purpose.toLowerCase().includes(searchQuery) || 
                            voucher.toLowerCase().includes(searchQuery) ||
                            remarks.toLowerCase().includes(searchQuery)) {
                            
                            totalExpense += parseFloat(item.amount);
                            combinedData.push({
                                date: item.expense_date,
                                type: 'Expense',
                                purpose: purpose,
                                category: item.category || 'General',
                                voucher: voucher,
                                remarks: remarks,
                                amount: parseFloat(item.amount),
                                color: '#e74c3c'
                            });
                        }
                    });
                }

                // Sort by Date (Descending - Newest first)
                combinedData.sort((a, b) => new Date(b.date) - new Date(a.date));

                // Update UI Summary
                document.getElementById('total-income').innerText = totalIncome.toFixed(2);
                document.getElementById('total-expense').innerText = totalExpense.toFixed(2);
                document.getElementById('net-balance').innerText = (totalIncome - totalExpense).toFixed(2);

                // Render Table
                const tableBody = document.getElementById('report-body');
                tableBody.innerHTML = ''; 

                if (combinedData.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="8" style="text-align: center;">No records found for the selected filters.</td></tr>';
                    return;
                }

                combinedData.forEach(row => {
                    const tr = document.createElement('tr');
                    
                    // Calendar Link Generation for Expenses
                    let actionHtml = '-';
                    if (row.type === 'Expense') {
                        const eventTitle = encodeURIComponent(`Pay: ${row.purpose}`);
                        const eventDetails = encodeURIComponent(`Amount: ₹${row.amount} | Remarks: ${row.remarks}`);
                        // Create a basic calendar date string format
                        const dateStr = row.date.replace(/-/g, '');
                        const calendarUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${eventTitle}&details=${eventDetails}&dates=${dateStr}T040000Z/${dateStr}T050000Z`;
                        
                        actionHtml = `<a href="${calendarUrl}" target="_blank" class="action-btn">📅 Alert</a>`;
                    }

                    tr.innerHTML = `
                        <td>${new Date(row.date).toLocaleDateString('en-IN')}</td>
                        <td style="color: ${row.color}; font-weight: bold;">${row.type}</td>
                        <td>${row.purpose}</td>
                        <td>${row.category}</td>
                        <td>${row.voucher}</td>
                        <td>${row.remarks}</td>
                        <td style="color: ${row.color}; font-weight: bold;">₹${row.amount.toFixed(2)}</td>
                        <td>${actionHtml}</td>
                    `;
                    tableBody.appendChild(tr);
                });

                // പ്ലേ സൗണ്ട് (ഓപ്ഷണൽ - ഫിൽറ്റർ ചെയ്യുമ്പോൾ സൗണ്ട് വേണമെങ്കിൽ ഇത് അൺകമന്റ് ചെയ്യാം)
                // playAlertSound();

            } catch (error) {
                console.error("Error fetching reports:", error);
                document.getElementById('report-body').innerHTML = `<tr><td colspan="8" style="text-align: center; color: red;">Error: ${error.message}</td></tr>`;
            }
        }

        // --- 4. Export Table to CSV / Excel ---
        function exportToCSV() {
            let csv = [];
            let rows = document.querySelectorAll("table tr");
            
            for (let i = 0; i < rows.length; i++) {
                let row = [], cols = rows[i].querySelectorAll("td, th");
                // അവസാനത്തെ 'Action' കോളം ഒഴിവാക്കുന്നു
                for (let j = 0; j < cols.length - 1; j++) {
                    let data = cols[j].innerText.replace(/(\r\n|\n|\r)/gm, "").replace(/₹/g, "");
                    // കോമ ഉള്ള ഡാറ്റ കുഴപ്പമുണ്ടാക്കാതിരിക്കാൻ
                    row.push('"' + data + '"'); 
                }
                csv.push(row.join(","));
            }

            // Download Logic
            let csvFile = new Blob([csv.join("\n")], {type: "text/csv"});
            let downloadLink = document.createElement("a");
            downloadLink.download = "Financial_Report_" + new Date().toISOString().split('T')[0] + ".csv";
            downloadLink.href = window.URL.createObjectURL(csvFile);
            downloadLink.style.display = "none";
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        }

        // --- 5. Page Load Setup ---
        window.onload = () => {
            // Default Date Setup: From 1st of current month to Today
            const date = new Date();
            document.getElementById('to-date').value = date.toISOString().split('T')[0];
            date.setDate(1); 
            document.getElementById('from-date').value = date.toISOString().split('T')[0];
            
            // ഫയൽ ലോഡ് ആകുമ്പോൾ തന്നെ റിപ്പോർട്ട് ജനറേറ്റ് ചെയ്യുന്നു
            fetchReports();
        };
    </script>
</body>
</html>
